name: XenaTV 6.9 - Busca Galactica Corrigida (Build Validado)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xenatv-69-busca-planetas-corrigida.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Verificar pacote e arquivos obrigatórios
        shell: bash
        run: |
          set -euo pipefail
          for file in XenaTV_69_PLAYER_CONTROLES_CODIGO_TESTE.zip XenaTV_Android_LibVLC_Teste1.zip patch_filmes_69.py .github/workflows/xenatv-premium-6-9-revisao-cosmica-pipoou-compacta.yml; do
            if [[ ! -f "$file" ]]; then echo "ERRO: arquivo necessário ausente no repositório: $file" >&2; exit 1; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          own=Path('.github/workflows/xenatv-69-busca-planetas-corrigida.yml')
          assert own.is_file(), f'Workflow ausente no caminho esperado: {own}'
          assert own.stat().st_size < 100_000, 'Workflow muito grande'
          compact=Path('.github/workflows/xenatv-premium-6-9-revisao-cosmica-pipoou-compacta.yml')
          assert compact.stat().st_size <= 500_000, 'Base compacta excedeu 500 KB'
          z=zipfile.ZipFile('XenaTV_69_PLAYER_CONTROLES_CODIGO_TESTE.zip')
          names=z.namelist()
          required=['patch_xenatv_69_integrada.py','patch_player_69.py','1000510040.jpg']
          for item in required:
              assert names.count(item)==1, f'Arquivo ausente/duplicado: {item}'
              Path(item).write_bytes(z.read(item))
          print('Arquivos extraídos com sucesso.')
          PY
          python3 -m py_compile patch_xenatv_69_integrada.py patch_player_69.py patch_filmes_69.py

      - name: Instalar Java e Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restaurar base 6.9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,lzma,pathlib,re
          p=pathlib.Path('.github/workflows/xenatv-premium-6-9-revisao-cosmica-pipoou-compacta.yml')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'payload = """\s*(.*?)\s*"""',s,re.S)
          if not m: raise RuntimeError('Base compacta sem payload')
          pathlib.Path('xena-build-step.sh').write_bytes(lzma.decompress(base64.b85decode(''.join(m.group(1).split()))))
          PY
          python3 patch_filmes_69.py
          bash xena-build-step.sh

      - name: Integrar ícones, tela dupla e controles do player
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 patch_xenatv_69_integrada.py
          python3 patch_player_69.py

      - name: Corrigir nomes completos e aplicar ícones neon nos atalhos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          old='''            TextView cap=text(compact?dest.equals("TV ao vivo")?"TV":dest.equals("Minha lista")?"Lista":dest:dest,10,selected?WHITE:MUTED,selected);\n            cap.setSingleLine(true);cap.setGravity(Gravity.CENTER);cell.addView(cap);\n            LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(0,dp(53),1);\n            if(!compact)cp=lp(-2,53);'''
          new='''            String dockLabel=dest;\n            if(dest.equals("TV ao vivo"))dockLabel="TV ao\\nvivo";\n            else if(dest.equals("Minha lista"))dockLabel="Minha\\nlista";\n            TextView cap=text(dockLabel,compact?9:10,selected?WHITE:MUTED,selected);\n            cap.setSingleLine(false);cap.setMaxLines(2);cap.setGravity(Gravity.CENTER);cell.addView(cap);\n            LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(0,dp(compact?64:58),1);\n            if(!compact)cp=lp(-2,58);'''
          if old not in s: raise RuntimeError('Trecho do dock não encontrado')
          s=s.replace(old,new,1)

          old='''    private void addQuick(LinearLayout parent,String symbol,String label,String destination){\n        LinearLayout tile=col();tile.setPadding(dp(17),dp(13),dp(17),dp(13));tile.setBackground(gradient(SURFACE,0xff1a2331,16));\n        tile.addView(text(symbol,24,ACCENT,false));gap(tile,8);tile.addView(text(label,12,WHITE,true));\n        LinearLayout.LayoutParams p=lp(137,93);p.rightMargin=dp(10);parent.addView(tile,p);\n        tapMotion(tile);tile.setOnClickListener(v->navigate(destination));\n    }'''
          new='''    private void addQuick(LinearLayout parent,String symbol,String label,String destination){\n        LinearLayout tile=col();tile.setGravity(Gravity.CENTER_HORIZONTAL);\n        tile.setPadding(dp(16),dp(12),dp(16),dp(12));\n        tile.setBackground(gradient(SURFACE,0xff1a2331,16));\n        tile.addView(xenaNavImage(destination,38),lp(44,44));\n        gap(tile,8);\n        TextView title=text(label.equals("Jogos hoje")?"Jogos\\nhoje":label,12,WHITE,true);\n        title.setGravity(Gravity.CENTER);title.setSingleLine(false);title.setMaxLines(2);\n        tile.addView(title);\n        LinearLayout.LayoutParams p=lp(145,100);p.rightMargin=dp(10);parent.addView(tile,p);\n        tapMotion(tile);tile.setOnClickListener(v->navigate(destination));\n    }'''
          if old not in s: raise RuntimeError('Trecho dos atalhos não encontrado')
          s=s.replace(old,new,1)

          checks=['dockLabel="TV ao\\nvivo"','xenaNavImage(destination,38)','title.setSingleLine(false)']
          for c in checks:
              if c not in s: raise RuntimeError('Validação falhou: '+c)
          p.write_text(s,encoding='utf-8')
          print('Correção visual aplicada com sucesso.')
          PY

      - name: Iniciar TV Mirante e diferenciar o áudio das duas telas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('tv.py').write_bytes(base64.b64decode(''))
          Path('audio.py').write_bytes(base64.b64decode(''))
          PY
          python3 tv.py
          python3 audio.py

      - name: Implementar sincronização independente de filmes Xtream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('patch_sync_filmes_69.py').write_bytes(base64.b64decode(''))
          PY
          python3 patch_sync_filmes_69.py
          grep -q 'Sincronizar filmes desta fonte' xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java

      - name: Validar integração final
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('xena-premium/XenaTV_Android/app/src/main')
          main=(base/'java/br/com/xenatv/app/MainActivity.java').read_text(encoding='utf-8')
          player=(base/'java/br/com/xenatv/app/FullScreenPlayerActivity.java').read_text(encoding='utf-8')
          for key in ('xenaNavImage(destination,38)', 'dockLabel="TV ao\\nvivo"', 'Minha\\nlista', 'buildPlayerBar()', 'playSecond('):
              assert key in (main+player), f'Chave ausente: {key}'
          assert 'buildSplitAudioPicker()' in player and 'Ouvir ESQUERDA' in player
          assert 'onlyFazenda' in (base/'java/br/com/xenatv/app/LiveTvActivity.java').read_text(encoding='utf-8')
          print('VALIDAÇÃO OK: Mirante, Pipoou, áudio dividido, nomes e ícones.')
          PY

      - name: Corrigir vinculo das categorias de filmes e series por plataforma
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('patch_plataformas_filmes_series_69.py').write_bytes(base64.b64decode(''))
          PY
          python3 patch_plataformas_filmes_series_69.py
          grep -q 'choosePlatformSeriesCategories' xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java

      - name: Mostrar filmes e séries não classificados e corrigir a seleção de pastas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('patch_catalogo_visivel_69.py').write_bytes(base64.b64decode(''))
          PY
          python3 patch_catalogo_visivel_69.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java').read_text()
          for key in ('showUnclassifiedPreview(', 'Associar categorias de séries', 'XenaTV-Associar-Series', 'DA SUA BIBLIOTECA'):
              assert key in s, 'Recurso não aplicado: '+key
          print('VALIDADO: preview real sem atribuir plataforma incorreta')
          PY

      - name: Aplicar ícones neon ao menu de navegação
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMENU'
          from pathlib import Path
          import base64
          Path('patch_menu_navegacao_neon_69.py').write_bytes(base64.b64decode(''))
          PYMENU
          python3 patch_menu_navegacao_neon_69.py
          grep -q 'xenaNavImage(dest,40)' xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java

      - name: Aplicar busca galáctica horizontal e três categorias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSEARCH'
          from pathlib import Path
          import base64
          Path('patch_busca_planetas_69.py').write_bytes(base64.b64decode(""""""))
          PYSEARCH
          python3 patch_busca_planetas_69.py
          python3 - <<'PYVALIDATE'
          from pathlib import Path
          s=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java').read_text()
          for key in ('renderSearchRail(target,"Canais",live,true)','renderSearchRail(target,"Filmes",movies,false)','renderSearchRail(target,"Séries",series,false)','openPlatformItem(item)'):
              assert key in s, 'Integração incompleta: '+key
          print('OK - busca horizontal com canais, filmes e séries da IPTV.')
          PYVALIDATE

      - name: Compilar APK debug para testes
        working-directory: xena-premium/XenaTV_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: XenaTV-6-9-BUSCA-PLANETAS-APK
          path: xena-premium/XenaTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
