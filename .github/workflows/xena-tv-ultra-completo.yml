name: Xena TV ULTRA - TV Filmes Series APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xena-tv-ultra-completo.yml'

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto original
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Aplicar interface ULTRA completa e gerenciador de IPTV
        shell: bash
        run: |
          set -euo pipefail
          test -f XenaTV_Android_LibVLC_Teste1.zip
          mkdir -p xena-build
          unzip -q XenaTV_Android_LibVLC_Teste1.zip -d xena-build
          mkdir -p xena-build/XenaTV_Android/app/src/main/java/br/com/xenatv/app
          cat > xena-build/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java <<'XENA_MAIN_JAVA'
          package br.com.xenatv.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.util.LruCache;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.LinkedHashMap;
          import java.util.Locale;

          /** Xena TV: interface nativa para conteúdos importados pelo próprio usuário. */
          public class MainActivity extends Activity {
              private static final int BG=0xff0a0910, PANEL=0xff191521, PANEL2=0xff292434,
                      WHITE=0xfff7f4ff, SUB=0xffb3adbc, GREEN=0xff3aff9d,
                      PURPLE=0xffa45aff, YELLOW=0xffffdf55;
              private static final String HOME="Início", TV="TV", MOVIES="Filmes", SERIES="Séries",
                      FAV="Favoritos", SEARCH="Buscar";
              private final ArrayList<Entry> all=new ArrayList<>();
              private final LinkedHashMap<String,String> loadErrors=new LinkedHashMap<>();
              private final LruCache<String,Bitmap> logoCache=new LruCache<String,Bitmap>(12*1024){
                  @Override protected int sizeOf(String key,Bitmap value){return Math.max(1,value.getByteCount()/1024);}
              };
              private SharedPreferences settings, listsPrefs;
              private String currentTab=HOME, selectedGroup="Todos", listSignature="", searchText="";
              private boolean showingFullScreen=false, showingDetails=false, isLandscape=false, refreshWhenBack=false;
              private int generation=0, shown=80, imported=0, pending=0;
              private Item selectedItem;
              private Entry detailsItem;
              private LinearLayout centerRows, categoriesBox, previewBox;
              private View highlightedRow;
              private TextView listingCount;
              private LibVLC libVlc;
              private MediaPlayer mediaPlayer;

              static final class Item {
                  final String name, url, group, image, source, kind;
                  Item(String n,String u,String g,String img,String from,String type){
                      name=n;url=u;group=g;image=img;source=from;kind=type;
                  }
              }
              // Keeps a single stable model throughout navigation (no separate fake movie catalog).
              static final class Entry {
                  final Item value;
                  Entry(Item v){value=v;}
              }

              @Override public void onCreate(Bundle saved){
                  super.onCreate(saved);
                  getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);
                  settings=getSharedPreferences("xena_tv_ui_v2",Context.MODE_PRIVATE);
                  listsPrefs=getSharedPreferences("xena_iptv_private_v1",Context.MODE_PRIVATE);
                  builtInChannels();render();
              }
              @Override protected void onResume(){
                  super.onResume();String raw=listsPrefs.getString("sources","[]");
                  if(refreshWhenBack||!raw.equals(listSignature)){refreshWhenBack=false;reloadAll(raw);}
              }
              private void builtInChannels(){
                  all.clear();
                  add("TV Câmara","https://stream3.camara.gov.br/tv1/manifest.m3u8","Canais públicos","","Xena TV","TV");
                  add("TV Senado","https://tv.senado.leg.br/hls/tv-senado.m3u8","Canais públicos","","Xena TV","TV");
                  add("TV Brasil","https://tvbrasil-stream.ebc.com.br/index.m3u8","Canais públicos","","Xena TV","TV");
                  add("Teste do player • Mux","https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8","Demonstrações","","Xena TV","TV");
                  add("Teste do player • Apple","https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8","Demonstrações","","Xena TV","TV");
              }
              private void add(String name,String url,String group,String logo,String source,String kind){
                  all.add(new Entry(new Item(name,url,group,logo,source,kind)));
              }
              private static String classify(String title,String group,String url){
                  String g=group.toLowerCase(Locale.ROOT), u=url.toLowerCase(Locale.ROOT), n=title.toLowerCase(Locale.ROOT);
                  if(g.contains("séries")||g.contains("series")||g.contains("seriados")||g.contains("tv shows")
                          ||u.contains("/series/")||n.matches(".*s[0-9]{1,2}e[0-9]{1,3}.*"))return SERIES;
                  if(g.contains("filme")||g.contains("movie")||g.contains("cinema")||g.contains("vod")
                          ||u.contains("/movie/"))return MOVIES;
                  return TV;
              }
              private void reloadAll(String raw){
                  listSignature=raw;final int request=++generation;
                  builtInChannels();loadErrors.clear();imported=0;pending=0;render();
                  JSONArray sources;
                  try {sources=new JSONArray(raw);}catch(Exception e){return;}
                  final ArrayList<String[]> catalogs=new ArrayList<>();
                  for(int i=0;i<sources.length();i++){
                      JSONObject o=sources.optJSONObject(i);
                      if(o==null)continue;
                      String u=o.optString("url",""), name=o.optString("name","Minha lista");
                      if(!u.isEmpty())catalogs.add(new String[]{name,u});
                  }
                  pending=catalogs.size();render();
                  // Sequential background fetch keeps bandwidth and memory usage predictable.
                  new Thread(()->{
                      for(String[] source:catalogs){
                          if(request!=generation)return;
                          try{
                              M3UStreamParser.Result parsed=M3UStreamParser.importUrl(source[0],source[1]);
                              ArrayList<Entry> importedEntries=new ArrayList<>();
                              for(M3UStreamParser.Channel c:parsed.channels){
                                  importedEntries.add(new Entry(new Item(c.name,c.url,c.category,c.logo,source[0],classify(c.name,c.category,c.url))));
                              }
                              runOnUiThread(()->{
                                  if(request!=generation||isFinishing()||isDestroyed())return;
                                  all.addAll(importedEntries);imported+=importedEntries.size();pending--;render();
                              });
                          }catch(Exception e){
                              String error=e.getMessage()==null?e.getClass().getSimpleName():e.getMessage();
                              runOnUiThread(()->{
                                  if(request!=generation||isFinishing()||isDestroyed())return;
                                  loadErrors.put(source[0],error);pending--;render();
                              });
                          }
                      }
                  },"XenaTV-Import").start();
              }
              private int dp(float p){return (int)(getResources().getDisplayMetrics().density*p+.5f);}
              private LinearLayout col(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);return l;}
              private LinearLayout row(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.HORIZONTAL);l.setGravity(Gravity.CENTER_VERTICAL);return l;}
              private LinearLayout.LayoutParams lp(int w,int h){return new LinearLayout.LayoutParams(w<0?w:dp(w),h<0?h:dp(h));}
              private void gap(LinearLayout l,int value){View v=new View(this);l.addView(v,lp(1,value));}
              private TextView text(String s,int size,int color,boolean bold){
                  TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);
                  if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;
              }
              private GradientDrawable surface(int fill,int stroke,int radius){
                  GradientDrawable d=new GradientDrawable();d.setColor(fill);d.setCornerRadius(dp(radius));
                  if(stroke!=0)d.setStroke(dp(1),stroke);return d;
              }
              private GradientDrawable heroGradient(){
                  GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xff342153,0xff1a2135,0xff10231e});
                  d.setCornerRadius(dp(20));d.setStroke(dp(1),0xff64478c);return d;
              }
              private Button button(String s,boolean accent){
                  Button b=new Button(this);b.setAllCaps(false);b.setText(s);
                  b.setTextColor(accent?BG:WHITE);b.setTextSize(13);b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  b.setBackground(surface(accent?GREEN:0xff382c4c,0,12));return b;
              }
              private ScrollView scroller(LinearLayout parent){
                  ScrollView sc=new ScrollView(this);sc.setFillViewport(true);
                  parent.addView(sc,new LinearLayout.LayoutParams(-1,0,1));return sc;
              }
              private LinearLayout page(ScrollView sc){
                  LinearLayout content=col();content.setPadding(dp(15),dp(12),dp(15),dp(25));sc.addView(content);return content;
              }
              private int count(String kind){int n=0;for(Entry e:all)if(e.value.kind.equals(kind))n++;return n;}
              private void render(){
                  if(isFinishing()||showingFullScreen||showingDetails)return;
                  stopPlayer();isLandscape=getResources().getConfiguration().orientation==Configuration.ORIENTATION_LANDSCAPE;
                  LinearLayout root=col();root.setBackgroundColor(BG);setContentView(root);
                  LinearLayout header=row();header.setPadding(dp(16),dp(8),dp(14),dp(6));
                  TextView brand=text("XENA TV",23,WHITE,true);header.addView(brand);
                  TextView dot=text("  ●",12,GREEN,true);header.addView(dot);
                  TextView clock=text(new SimpleDateFormat("EEE, dd MMM  HH:mm",new Locale("pt","BR")).format(new Date()),
                          isLandscape?14:10,SUB,false);clock.setGravity(Gravity.END);
                  header.addView(clock,new LinearLayout.LayoutParams(0,-2,1));
                  root.addView(header);View divider=new View(this);divider.setBackgroundColor(0xff35283f);root.addView(divider,lp(-1,1));
                  if(currentTab.equals(TV))renderTelevision(root);
                  else if(currentTab.equals(MOVIES)||currentTab.equals(SERIES))renderCatalog(root,currentTab);
                  else if(currentTab.equals(FAV))renderFavorites(root);
                  else if(currentTab.equals(SEARCH))renderSearch(root);
                  else renderHome(root);
                  renderNav(root);
              }
              private void renderNav(LinearLayout root){
                  HorizontalScrollView slider=new HorizontalScrollView(this);slider.setHorizontalScrollBarEnabled(false);
                  slider.setBackgroundColor(0xff15101c);LinearLayout nav=row();nav.setPadding(dp(7),dp(4),dp(7),dp(4));
                  String[][] options={{"⌂","Início",HOME},{"▣","TV",TV},{"▤","Filmes",MOVIES},
                          {"▥","Séries",SERIES},{"★","Favoritos",FAV},{"⌕","Buscar",SEARCH},{"⚙","Listas","Listas"}};
                  for(String[] option:options){
                      TextView tab=text(option[0]+"  "+option[1],12,currentTab.equals(option[2])?GREEN:SUB,true);
                      tab.setGravity(Gravity.CENTER);tab.setPadding(dp(12),dp(12),dp(12),dp(12));
                      if(currentTab.equals(option[2]))tab.setBackground(surface(0xff292335,0,18));
                      nav.addView(tab);tab.setOnClickListener(v->{
                          if(option[2].equals("Listas")){openListManager();return;}
                          navigate(option[2]);
                      });
                  }
                  slider.addView(nav);root.addView(slider,lp(-1,-2));
              }
              private void navigate(String tab){
                  currentTab=tab;shown=80;selectedGroup="Todos";searchText="";render();
              }
              private void renderHome(LinearLayout root){
                  LinearLayout home=page(scroller(root));
                  LinearLayout hero=col();hero.setPadding(dp(19),dp(19),dp(19),dp(17));hero.setBackground(heroGradient());
                  hero.addView(text("SUA CENTRAL DE ENTRETENIMENTO",11,GREEN,true));gap(hero,9);
                  Entry top=first(MOVIES);if(top==null)top=first(SERIES);if(top==null)top=first(TV);
                  final Entry picked=top;
                  hero.addView(text(picked==null?"Tudo em um só lugar":picked.value.name,23,WHITE,true));gap(hero,7);
                  hero.addView(text(picked==null?"TV ao vivo, filmes e séries organizados para você.":
                          "Explore suas listas e escolha o que assistir.",13,SUB,false));gap(hero,12);
                  LinearLayout links=row();Button watch=button("▶ Assistir",true);links.addView(watch,lp(132,46));
                  watch.setOnClickListener(v->{if(picked!=null)playFullscreen(picked.value);else navigate(TV);});
                  Button more=button("+ Minhas listas",false);LinearLayout.LayoutParams p=lp(-2,46);p.leftMargin=dp(8);
                  links.addView(more,p);more.setOnClickListener(v->openListManager());
                  hero.addView(links);home.addView(hero);gap(home,19);
                  LinearLayout sections=row();home.addView(sections);
                  addShortcut(sections,"▣","TV ao vivo",TV);
                  addShortcut(sections,"▤","Filmes",MOVIES);
                  addShortcut(sections,"▥","Séries",SERIES);
                  gap(home,20);
                  if(pending>0)home.addView(text("⟳ Carregando "+pending+" lista(s) IPTV...",13,YELLOW,false));
                  if(!loadErrors.isEmpty())home.addView(text("Algumas listas não carregaram. Abra Listas para verificar.",12,YELLOW,false));
                  addRecentStrip(home);
                  addPosterStrip(home,"ÚLTIMOS FILMES ADICIONADOS",MOVIES,18);
                  addPosterStrip(home,"SÉRIES",SERIES,18);
                  addPosterStrip(home,"CANAIS AO VIVO",TV,18);
                  addPosterStrip(home,"MEUS FAVORITOS","favorite",18);
                  addProviderSection(home);
              }
              private void addShortcut(LinearLayout parent,String glyph,String label,String tab){
                  LinearLayout card=col();card.setGravity(Gravity.CENTER);card.setPadding(dp(7),dp(13),dp(7),dp(12));
                  card.setBackground(surface(0xff272231,0xff494052,14));
                  card.addView(text(glyph,29,GREEN,true));gap(card,5);
                  TextView name=text(label,12,WHITE,true);name.setGravity(Gravity.CENTER);card.addView(name);
                  LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(0,dp(105),1);p.rightMargin=dp(8);
                  parent.addView(card,p);card.setOnClickListener(v->navigate(tab));
              }
              private Entry first(String type){for(Entry e:all)if(e.value.kind.equals(type))return e;return null;}
              private void addRecentStrip(LinearLayout page){
                  ArrayList<Entry> recent=new ArrayList<>();
                  try{
                      JSONArray records=new JSONArray(settings.getString("recent","[]"));
                      java.util.HashMap<String,Entry> lookup=new java.util.HashMap<>();
                      for(Entry e:all)lookup.put(id(e.value),e);
                      for(int n=0;n<records.length()&&recent.size()<18;n++){
                          Entry e=lookup.get(records.optString(n));if(e!=null)recent.add(e);
                      }
                  }catch(Exception ignored){}
                  if(recent.isEmpty())return;
                  page.addView(text("CONTINUAR ASSISTINDO",16,WHITE,true));gap(page,10);
                  HorizontalScrollView sc=new HorizontalScrollView(this);sc.setHorizontalScrollBarEnabled(false);
                  LinearLayout strip=row();for(Entry e:recent)strip.addView(poster(e));
                  sc.addView(strip);page.addView(sc);gap(page,20);
              }
              private void addPosterStrip(LinearLayout page,String heading,String type,int limit){
                  ArrayList<Entry> items=new ArrayList<>();
                  for(int i=all.size()-1;i>=0&&items.size()<limit;i--){
                      Entry e=all.get(i);
                      if(type.equals("favorite")?isFavorite(e.value):e.value.kind.equals(type))items.add(e);
                  }
                  LinearLayout title=row();title.addView(text(heading,16,WHITE,true),new LinearLayout.LayoutParams(0,-2,1));
                  TextView viewAll=text("Ver todos ›",12,GREEN,true);title.addView(viewAll);
                  viewAll.setOnClickListener(v->navigate(type.equals("favorite")?FAV:type));
                  page.addView(title);gap(page,10);
                  if(items.isEmpty()){
                      TextView empty=text(type.equals(MOVIES)||type.equals(SERIES)?
                              "Adicione uma lista com essa categoria para ver os pôsteres aqui.":"Nenhum item nesta seção por enquanto.",12,SUB,false);
                      empty.setPadding(dp(8),dp(15),dp(8),dp(24));page.addView(empty);
                  }else{
                      HorizontalScrollView sc=new HorizontalScrollView(this);sc.setHorizontalScrollBarEnabled(false);
                      LinearLayout row=row();for(Entry e:items)row.addView(poster(e));sc.addView(row);page.addView(sc);gap(page,20);
                  }
              }
              private View poster(Entry e){
                  Item item=e.value;LinearLayout panel=col();panel.setPadding(dp(3),dp(3),dp(3),dp(6));
                  LinearLayout.LayoutParams p=lp(132,-2);p.rightMargin=dp(10);panel.setLayoutParams(p);
                  FrameLayout art=new FrameLayout(this);art.setBackground(heroGradient());
                  TextView letter=text(item.kind.equals(TV)?"▣":"▤",38,0xff857a98,true);letter.setGravity(Gravity.CENTER);
                  art.addView(letter,new FrameLayout.LayoutParams(-1,-1));
                  ImageView image=new ImageView(this);image.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  art.addView(image,new FrameLayout.LayoutParams(-1,-1));
                  loadLogo(image,item.image);
                  panel.addView(art,lp(-1,174));gap(panel,7);
                  TextView name=text(item.name,12,WHITE,true);name.setMaxLines(2);name.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  panel.addView(name);gap(panel,3);
                  TextView group=text(item.group.isEmpty()?item.kind:item.group,10,SUB,false);
                  group.setSingleLine(true);group.setEllipsize(android.text.TextUtils.TruncateAt.END);panel.addView(group);
                  panel.setOnClickListener(v->showDetails(e));return panel;
              }
              private void addProviderSection(LinearLayout page){
                  page.addView(text("PLATAFORMAS OFICIAIS",15,WHITE,true));gap(page,8);
                  page.addView(text("Atalhos externos; a Xena TV não transmite os catálogos dessas plataformas.",11,SUB,false));gap(page,10);
                  LinearLayout r=row();Button yt=button("▶ YouTube",false),gl=button("◉ Globoplay",false);
                  LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(0,dp(46),1);p.rightMargin=dp(9);r.addView(yt,p);
                  r.addView(gl,new LinearLayout.LayoutParams(0,dp(46),1));page.addView(r);
                  yt.setOnClickListener(v->openLink("https://www.youtube.com/"));
                  gl.setOnClickListener(v->openLink("https://globoplay.globo.com/"));
              }
              private void openListManager(){refreshWhenBack=true;startActivity(new Intent(this,IPTVActivity.class));}
              private void openLink(String address){
                  try{Intent i=new Intent(Intent.ACTION_VIEW,Uri.parse(address));i.setPackage("com.brave.browser");startActivity(i);}
                  catch(Exception e){try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(address)));}catch(Exception ignored){}}
              }
              private void renderCatalog(LinearLayout root,String kind){
                  LinearLayout page=page(scroller(root));
                  page.addView(text(kind.toUpperCase(Locale.ROOT),22,WHITE,true));gap(page,5);
                  page.addView(text("Conteúdos identificados nas listas importadas.",12,SUB,false));gap(page,16);
                  Entry featured=first(kind);
                  if(featured!=null){
                      LinearLayout hero=col();hero.setPadding(dp(14),dp(15),dp(14),dp(13));hero.setBackground(heroGradient());
                      hero.addView(text(kind.equals(MOVIES)?"EM DESTAQUE • FILME":"EM DESTAQUE • SÉRIE",12,GREEN,true));gap(hero,8);
                      hero.addView(text(featured.value.name,22,WHITE,true));gap(hero,8);
                      hero.addView(text(featured.value.group,12,SUB,false));gap(hero,10);
                      Button details=button("Ver detalhes",true);hero.addView(details,lp(150,46));
                      details.setOnClickListener(v->showDetails(featured));page.addView(hero);gap(page,19);
                  }
                  addPosterStrip(page,kind.equals(MOVIES)?"TODOS OS FILMES":"TODAS AS SÉRIES",kind,30);
                  LinkedHashMap<String,ArrayList<Entry>> grouped=new LinkedHashMap<>();
                  for(Entry e:all)if(e.value.kind.equals(kind)){
                      String g=e.value.group.isEmpty()?"Outros":e.value.group;
                      if(!grouped.containsKey(g))grouped.put(g,new ArrayList<>());
                      if(grouped.get(g).size()<18)grouped.get(g).add(e);
                  }
                  int sections=0;
                  for(String g:grouped.keySet()){
                      if(++sections>12)break;
                      page.addView(text(g.toUpperCase(Locale.ROOT),16,WHITE,true));gap(page,9);
                      HorizontalScrollView scroll=new HorizontalScrollView(this);LinearLayout strip=row();
                      for(Entry e:grouped.get(g))strip.addView(poster(e));scroll.addView(strip);page.addView(scroll);gap(page,21);
                  }
                  if(featured==null)page.addView(text("Ainda não há "+kind.toLowerCase(Locale.ROOT)+
                          " nesta instalação. Importe uma lista M3U com grupos apropriados.",13,SUB,false));
              }
              private void renderTelevision(LinearLayout root){
                  isLandscape=getResources().getConfiguration().orientation==Configuration.ORIENTATION_LANDSCAPE;
                  LinearLayout content=col();root.addView(content,new LinearLayout.LayoutParams(-1,0,1));
                  LinearLayout header=row();header.setPadding(dp(14),dp(8),dp(14),dp(8));
                  header.addView(text("TV AO VIVO",18,WHITE,true),new LinearLayout.LayoutParams(0,-2,1));
                  TextView n=text(count(TV)+" canais",12,GREEN,true);header.addView(n);content.addView(header);
                  EditText search=new EditText(this);search.setSingleLine(true);search.setTextColor(WHITE);
                  search.setHintTextColor(SUB);search.setHint("⌕ Pesquisar canais");
                  search.setPadding(dp(13),dp(5),dp(13),dp(5));search.setBackground(surface(PANEL2,0xff50405b,14));
                  search.setText(searchText);content.addView(search,lp(-1,47));
                  search.addTextChangedListener(new TextWatcher(){
                      public void beforeTextChanged(CharSequence s,int st,int c,int a){}
                      public void onTextChanged(CharSequence s,int st,int before,int count){
                          searchText=s.toString();shown=80;renderChannelRows();
                      }
                      public void afterTextChanged(Editable e){}
                  });gap(content,8);
                  LinearLayout panels=row();panels.setGravity(Gravity.TOP);content.addView(panels,new LinearLayout.LayoutParams(-1,0,1));
                  ScrollView catScroll=new ScrollView(this);categoriesBox=col();categoriesBox.setPadding(dp(9),dp(7),dp(7),0);
                  catScroll.addView(categoriesBox);catScroll.setBackgroundColor(0xff17131c);
                  panels.addView(catScroll,new LinearLayout.LayoutParams(0,-1,isLandscape?0.23f:0.34f));
                  ScrollView channelScroll=new ScrollView(this);centerRows=col();centerRows.setPadding(dp(8),dp(7),dp(8),dp(12));
                  channelScroll.addView(centerRows);
                  panels.addView(channelScroll,new LinearLayout.LayoutParams(0,-1,isLandscape?0.39f:0.66f));
                  if(isLandscape){
                      previewBox=col();previewBox.setPadding(dp(8),dp(7),dp(8),dp(7));
                      previewBox.setBackgroundColor(0xff111019);
                      panels.addView(previewBox,new LinearLayout.LayoutParams(0,-1,0.38f));
                  }else previewBox=null;
                  renderCategories();renderChannelRows();
