          cat > xena-build/XenaTV_Android/app/src/main/java/br/com/xenatv/app/M3UStreamParser.java <<'XENA_M3U_JAVA'
          package br.com.xenatv.app;

          import java.io.BufferedInputStream;
          import java.io.BufferedReader;
          import java.io.FilterInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URI;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.GZIPInputStream;

          /** Importa playlists IPTV sem guardar o arquivo inteiro em RAM. */
          public final class M3UStreamParser {
              private M3UStreamParser() {}

              // O limite é de segurança, não um limite de 6 MB: lê o arquivo progressivamente.
              public static final int MAX_CHANNELS = 60000;
              private static final long MAX_DECOMPRESSED_BYTES = 192L * 1024L * 1024L;
              private static final Pattern HTTP = Pattern.compile("^https?://", Pattern.CASE_INSENSITIVE);
              private static final Pattern SCHEME = Pattern.compile("^(?:https?|rtsp|rtmp)://", Pattern.CASE_INSENSITIVE);

              public static final class Channel {
                  public final String name;
                  public final String url;
                  public final String category;
                  public final String logo;
                  Channel(String name, String url, String category) { this(name, url, category, ""); }
                  Channel(String name, String url, String category, String logo) {
                      this.name = name;
                      this.url = url;
                      this.category = category;
                      this.logo = logo;
                  }
              }
              public static final class Result {
                  public final ArrayList<Channel> channels;
                  public final boolean limited;
                  public final boolean direct;
                  Result(ArrayList<Channel> channels, boolean limited, boolean direct) {
                      this.channels = channels;
                      this.limited = limited;
                      this.direct = direct;
                  }
              }

              private static Result single(String name, String url) {
                  ArrayList<Channel> channels = new ArrayList<>();
                  channels.add(new Channel(name, url, "Transmissão direta"));
                  return new Result(channels, false, true);
              }

              public static Result importUrl(String name, String address) throws IOException {
                  if (!HTTP.matcher(address).find()) return single(name, address); // RTSP/RTMP: abrir pelo VLC
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(address).openConnection();
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(20000);
                      conn.setInstanceFollowRedirects(true);
                      conn.setRequestProperty("User-Agent", "XenaTV/1.2 (LibVLC)");
                      conn.setRequestProperty("Accept-Encoding", "gzip");
                      conn.setRequestProperty("Accept", "application/x-mpegURL, application/vnd.apple.mpegurl, text/plain, */*");
                      int code = conn.getResponseCode();
                      if (code < 200 || code >= 300) {
                          throw new IOException("Servidor HTTP " + code + ". Confira o endereço ou sua autorização.");
                      }
                      String contentType = conn.getContentType();
                      String mime = contentType == null ? "" : contentType.toLowerCase(Locale.ROOT);
                      if ((mime.startsWith("video/") || mime.startsWith("audio/"))
                              && !mime.contains("mpegurl") && !mime.contains("m3u")) {
                          return single(name, address);
                      }

                      try (InputStream response = conn.getInputStream()) {
                          InputStream decoded = response;
                          String encoding = conn.getContentEncoding();
                          if (encoding != null && encoding.toLowerCase(Locale.ROOT).contains("gzip")) {
                              decoded = new GZIPInputStream(response);
                          }
                          // A leitura progressiva evita estourar a memória em listas grandes.
                          try (BufferedInputStream input = new BufferedInputStream(
                                  new LimitedInputStream(decoded, MAX_DECOMPRESSED_BYTES), 32768)) {
                              input.mark(8192);
                              byte[] peek = new byte[4096];
                              int length = input.read(peek);
                              input.reset();
                              if (length < 1) throw new IOException("O servidor retornou uma lista vazia.");
                              String preview = new String(peek, 0, length, StandardCharsets.UTF_8)
                                      .replace("\uFEFF", "").trim();
                              boolean playlist = preview.startsWith("#EXTM3U")
                                      || preview.startsWith("#EXTINF")
                                      || preview.startsWith("#EXTGRP")
                                      || (SCHEME.matcher(preview).find() && preview.contains("\n"));
                              if (!playlist) {
                                  if (looksBinary(peek, length)) return single(name, address);
                                  throw new IOException("O link não retornou uma playlist M3U válida.");
                              }
                              BufferedReader reader = new BufferedReader(
                                      new InputStreamReader(input, StandardCharsets.UTF_8), 32768);
                              Result parsed = parse(reader, address);
                              if (parsed.direct) return single(name, address); // #EXT-X- indica mídia HLS
                              if (parsed.channels.isEmpty()) {
                                  throw new IOException("Nenhum canal válido foi encontrado na lista M3U.");
                              }
                              return parsed;
                          }
                      }
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private static boolean looksBinary(byte[] data, int length) {
                  int control = 0;
                  for (int i = 0; i < length; i++) {
                      int b = data[i] & 0xff;
                      if (b == 0 || (b < 0x20 && b != 9 && b != 10 && b != 13)) control++;
                  }
                  return control > 0;
              }

              /** Package-private para testar listas longas sem abrir uma conexão real. */
              static Result parse(BufferedReader reader, String base) throws IOException {
                  ArrayList<Channel> channels = new ArrayList<>();
                  String pendingName = "", group = "", logo = "";
                  String line;
                  while ((line = reader.readLine()) != null) {
                      line = line.trim();
                      if (line.startsWith("\uFEFF")) line = line.substring(1);
                      if (line.isEmpty()) continue;
                      if (line.regionMatches(true, 0, "#EXT-X-", 0, 7)) {
                          return new Result(new ArrayList<>(), false, true); // HLS, não um catálogo
                      }
                      if (line.regionMatches(true, 0, "#EXTINF", 0, 7)) {
                          String meta = line.substring(7);
                          int comma = commaOutsideQuotes(meta);
                          String attributes = comma < 0 ? meta : meta.substring(0, comma);
                          pendingName = comma < 0 ? "" : meta.substring(comma + 1).trim();
                          if (pendingName.isEmpty()) pendingName = attribute(attributes, "tvg-name");
                          group = attribute(attributes, "group-title");
                          logo = attribute(attributes, "tvg-logo");
                      } else if (line.regionMatches(true, 0, "#EXTGRP:", 0, 8)) {
                          group = line.substring(8).trim();
                      } else if (!line.startsWith("#")) {
                          String address = normalizeLink(line, base);
                          if (address != null) {
                              String title = pendingName.isEmpty() ? "Canal " + (channels.size() + 1) : pendingName;
                              channels.add(new Channel(title, address, group, logo));
                              if (channels.size() >= MAX_CHANNELS) return new Result(channels, true, false);
                          }
                          pendingName = "";
                          group = "";
                          logo = "";
                      }
                  }
                  return new Result(channels, false, false);
              }

              private static int commaOutsideQuotes(String value) {
                  char quote = 0;
                  for (int i = 0; i < value.length(); i++) {
                      char c = value.charAt(i);
                      if (quote == 0 && (c == '\'' || c == '"')) quote = c;
                      else if (quote == c) quote = 0;
                      else if (c == ',' && quote == 0) return i;
                  }
                  return -1;
              }

              private static String attribute(String attributes, String key) {
                  Matcher m = Pattern.compile("(?:^|\\s)" + Pattern.quote(key)
                          + "\\s*=\\s*([\\\"'])(.*?)\\1", Pattern.CASE_INSENSITIVE).matcher(attributes);
                  return m.find() ? m.group(2).trim() : "";
              }

              private static String normalizeLink(String raw, String base) {
                  try {
                      URI uri = new URI(raw);
                      if (!uri.isAbsolute()) uri = new URI(base).resolve(uri);
                      String scheme = uri.getScheme();
                      if (scheme == null || uri.getHost() == null || uri.getHost().isEmpty()) return null;
                      String lowered = scheme.toLowerCase(Locale.ROOT);
                      if (!lowered.equals("http") && !lowered.equals("https")
                              && !lowered.equals("rtsp") && !lowered.equals("rtmp")) return null;
                      return uri.toString();
                  } catch (Exception ignored) {
                      return null;
                  }
              }

              private static final class LimitedInputStream extends FilterInputStream {
                  private final long limit;
                  private long consumed;
                  LimitedInputStream(InputStream input, long limit) { super(input); this.limit = limit; }
                  @Override public int read() throws IOException {
                      int value = super.read();
                      if (value >= 0 && ++consumed > limit) throw new IOException("Playlist muito extensa.");
                      return value;
                  }
                  @Override public int read(byte[] data, int offset, int count) throws IOException {
                      int n = in.read(data, offset, count);
                      if (n > 0 && (consumed += n) > limit) throw new IOException("Playlist muito extensa.");
                      return n;
                  }
              }
          }
