              private void startMedia(Item item,VLCVideoLayout view,TextView status){
                  try{
                      if(libVlc==null){ArrayList<String> opts=new ArrayList<>();opts.add("--network-caching=1600");opts.add("--http-reconnect");libVlc=new LibVLC(this,opts);}
                      mediaPlayer=new MediaPlayer(libVlc);mediaPlayer.attachViews(view,null,false,false);
                      final MediaPlayer current=mediaPlayer;
                      current.setEventListener(event->runOnUiThread(()->{
                          if(current!=mediaPlayer)return;
                          if(event.type==MediaPlayer.Event.Playing)status.setText("● Reproduzindo");
                          else if(event.type==MediaPlayer.Event.Buffering)status.setText("Carregando vídeo...");
                          else if(event.type==MediaPlayer.Event.EncounteredError)status.setText("Falha ao reproduzir. Verifique o endereço ou a fonte.");
                          else if(event.type==MediaPlayer.Event.EndReached)status.setText("Reprodução encerrada.");
                      }));
                      Media media=new Media(libVlc,Uri.parse(item.url));
                      media.addOption(":network-caching=1600");media.addOption(":http-reconnect=true");
                      current.setMedia(media);media.release();current.play();
                  }catch(Exception e){status.setText("Erro: "+e.getClass().getSimpleName());}
              }
              private void stopPlayer(){
                  if(mediaPlayer!=null){
                      try{mediaPlayer.stop();if(mediaPlayer.getVLCVout().areViewsAttached())mediaPlayer.detachViews();}
                      catch(Exception ignored){}
                      mediaPlayer.release();mediaPlayer=null;
                  }
              }
              private String id(Item item){return Integer.toHexString(item.url.hashCode());}
              private boolean isFavorite(Item item){return settings.getBoolean("favorite_"+id(item),false);}
              private void toggleFavorite(Item item){settings.edit().putBoolean("favorite_"+id(item),!isFavorite(item)).apply();}
              private void rememberRecent(Item item){
                  try{
                      JSONArray array=new JSONArray(settings.getString("recent","[]"));
                      JSONArray out=new JSONArray();out.put(id(item));
                      for(int i=0;i<array.length()&&out.length()<40;i++){
                          String old=array.optString(i);if(!old.equals(id(item)))out.put(old);
                      }
                      settings.edit().putString("recent",out.toString()).apply();
                  }catch(Exception ignored){}
              }
              private boolean isRecent(Item item){
                  try{return settings.getString("recent","[]").contains("\""+id(item)+"\"");}
                  catch(Exception e){return false;}
              }
              private void loadLogo(ImageView target,String imageUrl){
                  if(imageUrl==null||!imageUrl.matches("(?i)^https?://.+"))return;
                  target.setTag(imageUrl);Bitmap cached=logoCache.get(imageUrl);
                  if(cached!=null){target.setImageBitmap(cached);return;}
                  new Thread(()->{
                      HttpURLConnection conn=null;
                      try{
                          URL url=new URL(imageUrl);conn=(HttpURLConnection)url.openConnection();
                          conn.setConnectTimeout(6000);conn.setReadTimeout(6000);
                          conn.setInstanceFollowRedirects(true);
                          if(conn.getContentLength()>2*1024*1024)return;
                          try(InputStream stream=conn.getInputStream()){
                              BitmapFactory.Options opts=new BitmapFactory.Options();opts.inSampleSize=4;
                              Bitmap bitmap=BitmapFactory.decodeStream(stream,null,opts);
                              if(bitmap==null)return;
                              logoCache.put(imageUrl,bitmap);
                              runOnUiThread(()->{if(imageUrl.equals(target.getTag()))target.setImageBitmap(bitmap);});
                          }
                      }catch(Exception ignored){}finally{if(conn!=null)conn.disconnect();}
                  },"XenaTV-Art").start();
              }
              @Override public void onConfigurationChanged(Configuration configuration){
                  super.onConfigurationChanged(configuration);
                  isLandscape=configuration.orientation==Configuration.ORIENTATION_LANDSCAPE;
                  if(!showingFullScreen&&!showingDetails)render();
              }
              @Override public void onBackPressed(){
                  if(showingFullScreen){closeFullscreen();return;}
                  if(showingDetails){closeDetails();return;}
                  if(!currentTab.equals(HOME)){navigate(HOME);return;}
                  super.onBackPressed();
              }
              @Override protected void onDestroy(){generation++;stopPlayer();if(libVlc!=null){libVlc.release();libVlc=null;}super.onDestroy();}
          }
