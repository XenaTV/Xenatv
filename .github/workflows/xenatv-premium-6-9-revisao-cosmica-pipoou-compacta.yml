name: XenaTV Premium 6.9 - Revisao Cosmica e Pipoou Corrigida

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xenatv-premium-6-9-revisao-cosmica-pipoou-compacta.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
