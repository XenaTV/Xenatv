                  String catalog;
                  try{result.folder=b+"vod/";catalog=read(result.folder+"indice.txt");}
                  catch(IOException missing){
                      // Há distribuições Saimo que publicam indice.txt direto na raiz.
                      result.folder=b;catalog=read(result.folder+"indice.txt");
                  }
                  for(String line:catalog.split("\\r?\\n")){
                      if(!line.startsWith("base:"))continue;
                      String[] a=clean(line.substring(5)).split("\\s+",2);
                      if(a.length==2)try{result.bases.put(Integer.parseInt(a[0]),a[1]);}catch(Exception ignored){}
                  }
                  if(result.bases.isEmpty())throw new IOException("indice.txt não informou os servidores VOD");
                  return result;
              }
              private static String expand(String token,VodIndex index){
                  token=clean(token);if(valid(token))return token;
                  int pos=token.indexOf(':');if(pos<1)return "";
                  try{
                      String b=index.bases.get(Integer.parseInt(token.substring(0,pos)));
                      if(b==null||!valid(b))return "";
