          /** Fonte/credenciais ficam apenas nas preferências privadas do aparelho; nunca no APK ou GitHub. */
          public final class SourceRegistry {
              public static final class SourceEntry {
                  public final String id;
                  public String name, url, status, kind;
                  public boolean enabled;
                  SourceEntry(String id,String name,String url,boolean enabled,String status,String kind){
