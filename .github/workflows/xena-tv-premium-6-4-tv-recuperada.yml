              private String brandLogo(String group){
                  String key=group.toLowerCase(Locale.ROOT);
                  String domain=null;
                  if(key.contains("netflix"))domain="netflix.com";
                  else if(key.contains("prime video")||key.contains("amazon"))domain="primevideo.com";
                  else if(key.contains("disney"))domain="disneyplus.com";
                  else if(key.contains("hbo")||key.contains("max ")||key.endsWith("max")||key.contains("hbo max"))domain="max.com";
                  else if(key.contains("globoplay"))domain="globoplay.globo.com";
                  else if(key.contains("apple tv"))domain="tv.apple.com";
                  else if(key.contains("paramount"))domain="paramountplus.com";
                  else if(key.contains("crunchyroll"))domain="crunchyroll.com";
                  else if(key.contains("telecine"))domain="telecine.com.br";
                  else if(key.contains("universal"))domain="universalplus.com";
                  else if(key.contains("mgm"))domain="mgmplus.com";
                  else if(key.contains("looke"))domain="looke.com.br";
                  else if(key.contains("pluto"))domain="pluto.tv";
                  else if(key.contains("discovery"))domain="discoveryplus.com";
                  else if(key.contains("youtube"))domain="youtube.com";
                  else if(key.contains("warner"))domain="warnerbros.com";
                  else if(key.contains("star+")||key.contains("star plus"))domain="disneyplus.com";
                  else if(key.contains("hulu"))domain="hulu.com";
                  else if(key.contains("peacock"))domain="peacocktv.com";
                  else if(key.contains("netmovies"))domain="netmovies.com.br";
                  else if(key.contains("vix"))domain="vix.com";
                  else if(key.contains("sony"))domain="sony.com";
                  else if(key.contains("tubi"))domain="tubitv.com";
                  else if(key.contains("rakuten"))domain="rakuten.tv";
                  else if(key.contains("samsung"))domain="samsung.com";
                  else if(key.contains("saimo"))domain="saimo-tv.pages.dev";
                  else if(key.contains("espn"))domain="espn.com";
                  else if(key.contains("sportv"))domain="sportv.globo.com";
                  return domain==null?"":"https://www.google.com/s2/favicons?domain="+domain+"&sz=128";
              }
              /** Um pequeno ícone local sempre aparece, mesmo que a plataforma bloqueie o favicon. */
              private String categoryMonogram(String group){
                  String lower=group.toLowerCase(Locale.ROOT);
                  if(lower.contains("netflix"))return "N";
                  if(lower.contains("prime video")||lower.contains("amazon"))return "▶";
                  if(lower.contains("disney"))return "D+";
                  if(lower.contains("globoplay"))return "G";
                  if(lower.contains("hbo")||lower.contains("max"))return "M";
                  if(lower.contains("apple tv"))return "TV";
                  if(lower.contains("paramount"))return "P+";
                  if(lower.contains("crunchyroll"))return "C";
                  if(lower.contains("telecine"))return "TC";
                  if(lower.contains("universal"))return "U+";
                  if(lower.contains("mgm"))return "M+";
                  if(lower.contains("looke"))return "LK";
                  if(lower.contains("pluto"))return "PL";
                  if(lower.contains("discovery"))return "D";
                  if(lower.contains("youtube"))return "YT";
                  if(lower.contains("warner"))return "WB";
                  if(lower.contains("hulu"))return "H";
                  if(lower.contains("peacock"))return "PC";
                  if(lower.contains("netmovies"))return "NM";
                  if(lower.contains("vix"))return "VX";
                  if(lower.contains("sony"))return "SY";
                  if(lower.contains("tubi"))return "TB";
                  if(lower.contains("rakuten"))return "RK";
                  if(lower.contains("samsung"))return "SS";
                  if(lower.contains("saimo"))return "S";
                  if(lower.contains("espn"))return "E";
                  if(lower.contains("sportv"))return "SP";
                  if(lower.contains("doram"))return "DR";
                  if(lower.contains("anime"))return "AN";
                  if(lower.contains("infantil")||lower.contains("kids"))return "KI";
                  if(lower.contains("document"))return "DC";
                  if(lower.contains("net"))return "NT";
                  String s=group.replaceAll("[^\\p{L}\\p{N} ]", " ").trim();
                  if(s.isEmpty())return "✦";
                  String[] words=s.split("\\s+");
                  return (words.length>1?(words[0].substring(0,1)+words[1].substring(0,1)):s.substring(0,Math.min(2,s.length()))).toUpperCase(Locale.ROOT);
              }
              private int categoryColor(String group){
                  String k=group.toLowerCase(Locale.ROOT);
                  if(k.contains("netflix"))return 0xff9d1827;
                  if(k.contains("prime")||k.contains("amazon"))return 0xff115eaa;
                  if(k.contains("disney"))return 0xff193e9a;
                  if(k.contains("hbo")||k.contains("max"))return 0xff6422a5;
                  if(k.contains("globoplay"))return 0xffaa2848;
                  if(k.contains("apple"))return 0xff555969;
                  if(k.contains("paramount"))return 0xff1f5eac;
                  if(k.contains("crunchyroll"))return 0xffd2731a;
                  if(k.contains("youtube"))return 0xffc32338;
                  if(k.contains("espn"))return 0xffa72025;
                  int[] colors={0xff3c6079,0xff46678a,0xff315b69,0xff624b82,0xff695078,0xff526c4d,0xff6c5a3d};
                  return colors[(group.hashCode()&0x7fffffff)%colors.length];
              }
              private void addGroup(String group,String type){
                  boolean selected=group.equals(selectedGroup);
                  String logo=brandLogo(group);
                  Button button=button(group,false);
                  if(selected){button.setTextColor(MINT);button.setBackground(shape(0xff26384a,0xff566e81,12));}
                  button.setTextSize(11);button.setSingleLine(true);
                  LinearLayout.LayoutParams p=lp(groups.getOrientation()==LinearLayout.VERTICAL?-1:-2,44);
                  if(groups.getOrientation()==LinearLayout.VERTICAL)p.bottomMargin=dp(6);else p.rightMargin=dp(7);
                  Runnable select=()->{selectedGroup=group;visibleCount=PAGE;fillGroups(type);
                      if(rows!=null)renderTvRows();else renderMediaGrid();};
                  if(group.equals("Todos")||group.equals("Recentes")||group.equals("Favoritos")){
                      groups.addView(button,p);button.setOnClickListener(v->select.run());return;
                  }
                  LinearLayout line=row();line.setBackground(shape(selected?0xff26384a:PANEL,selected?0xff566e81:BORDER,12));
                  FrameLayout mark=new FrameLayout(this);
                  TextView badge=text(categoryMonogram(group),10,WHITE,true);
                  badge.setGravity(Gravity.CENTER);badge.setBackground(shape(categoryColor(group),0,8));
                  mark.addView(badge,new FrameLayout.LayoutParams(-1,-1));
                  if(!logo.isEmpty()){
                      ImageView image=new ImageView(this);image.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      mark.addView(image,new FrameLayout.LayoutParams(-1,-1));
                      ChannelArtwork.bind(image,logo,false);
                  }
                  LinearLayout.LayoutParams ip=lp(27,27);ip.leftMargin=dp(8);ip.rightMargin=dp(5);
                  line.addView(mark,ip);
                  button.setBackground(shape(Color.TRANSPARENT,0,12));
                  line.addView(button,new LinearLayout.LayoutParams(groups.getOrientation()==LinearLayout.VERTICAL?0:-2,dp(44),groups.getOrientation()==LinearLayout.VERTICAL?1:0));
                  line.setOnClickListener(v->select.run());button.setOnClickListener(v->select.run());
                  groups.addView(line,p);
              }
