              private void handleItem(ChannelStore.Channel ch){
                  if(ch.url.startsWith("xena-saimo://")){showSaimoItem(ch);return;}
                  if(ch.url.startsWith("xena-series://")){showSeriesEpisodes(ch);return;}
                  if(ch.type.equals(MOVIES)||ch.type.equals(SERIES))showDetails(ch);
                  else openFullscreen(ch);
              }
              private void openFullscreen(ChannelStore.Channel ch){
                  Intent intent=new Intent(this,FullScreenPlayerActivity.class);
                  intent.putExtra("address",ch.url);intent.putExtra("name",ch.name);
                  intent.putExtra("category",ch.category);intent.putExtra("logo",ch.logo);intent.putExtra("kind",ch.type);
                  intent.putExtra("source_id",currentSourceId);
                  startActivity(intent);
              }
              private void showDetails(ChannelStore.Channel ch){
                  AlertDialog dialog=new AlertDialog.Builder(this).create();
                  LinearLayout content=col();content.setPadding(dp(18),dp(18),dp(18),dp(18));content.setBackground(shape(SURFACE,0xff4b607c,20));
                  LinearLayout heading=row();FrameLayout art=new FrameLayout(this);art.setBackground(shape(PANEL,0,11));
                  ImageView image=new ImageView(this);art.addView(image,new FrameLayout.LayoutParams(-1,-1));
                  ChannelArtwork.bind(image,ch.logo,true);heading.addView(art,lp(86,119));
                  LinearLayout info=col();info.setPadding(dp(13),0,0,0);
                  info.addView(text(ch.type.toUpperCase(Locale.ROOT),10,MINT,true));gap(info,9);
                  TextView title=text(ch.name,20,WHITE,true);title.setMaxLines(3);info.addView(title);gap(info,8);
                  TextView cat=text(ch.category,12,MUTED,false);info.addView(cat);
                  heading.addView(info,new LinearLayout.LayoutParams(0,-2,1));content.addView(heading);gap(content,18);
                  LinearLayout controls=row();Button watch=button(ch.url.startsWith("xena-series://")?"Episódios":"▶ Assistir",true);
                  controls.addView(watch,new LinearLayout.LayoutParams(0,dp(50),1));
                  Button favorite=button(ch.favorite?"★ Favorito":"☆ Favoritar",false);
                  LinearLayout.LayoutParams fp=new LinearLayout.LayoutParams(0,dp(50),1);fp.leftMargin=dp(8);controls.addView(favorite,fp);
                  content.addView(controls);
                  watch.setOnClickListener(v->{dialog.dismiss();handlePlayable(ch);});
                  final boolean[] saved={ch.favorite};
                  favorite.setOnClickListener(v->{saved[0]=!saved[0];store.favorite(ch.url,saved[0]);
                      favorite.setText(saved[0]?"★ Favorito":"☆ Favoritar");});
                  dialog.setView(content,0,0,0,0);dialog.show();
                  if(dialog.getWindow()!=null)dialog.getWindow().setBackgroundDrawableResource(android.R.color.transparent);
              }
              private void handlePlayable(ChannelStore.Channel ch){
                  if(ch.url.startsWith("xena-saimo://"))showSaimoItem(ch);
                  else if(ch.url.startsWith("xena-series://"))showSeriesEpisodes(ch);else openFullscreen(ch);
              }
              private void showSaimoItem(ChannelStore.Channel ch){
                  SourceRegistry.SourceEntry source=sourceRegistry.find(currentSourceId);
                  if(source==null){Toast.makeText(this,"Fonte de filmes indisponível",Toast.LENGTH_LONG).show();return;}
                  final String ref=ch.url,base=source.url;
                  AlertDialog dialog=new AlertDialog.Builder(this).setTitle(ch.name)
                      .setMessage("Consultando as fontes e episódios...").setNegativeButton("Fechar",null).create();dialog.show();
                  new Thread(()->{
                      try{
                          if(ref.startsWith("xena-saimo://movie/")){
                              ArrayList<ChannelStore.Variant> list=SaimoCatalog.movieSources(base,ref);
                              runOnUiThread(()->{if(!dialog.isShowing())return;dialog.dismiss();showSources(ch,list);});
                          }else{
                              ArrayList<SaimoCatalog.Episode> episodes=SaimoCatalog.seriesEpisodes(base,ref);
                              runOnUiThread(()->{
                                  if(!dialog.isShowing())return;dialog.dismiss();
                                  String[] names=new String[episodes.size()];for(int i=0;i<names.length;i++)names[i]=episodes.get(i).title;
                                  new AlertDialog.Builder(this).setTitle(ch.name+" • Episódios").setItems(names,(d,pos)->showSources(ch,episodes.get(pos).variants)).setNegativeButton("Voltar",null).show();
                              });
                          }
                      }catch(Exception ex){final String msg=safeError(ex);runOnUiThread(()->{
                          if(!dialog.isShowing())return;dialog.setMessage("Não foi possível consultar as fontes: "+msg);
                      });}
                  },"XenaTV-Saimo-VOD").start();
              }
              private void showSources(ChannelStore.Channel original,ArrayList<ChannelStore.Variant> sources){
                  ArrayList<ChannelStore.Variant> valid=new ArrayList<>();
                  for(ChannelStore.Variant v:sources)if(!v.drm)valid.add(v);
                  if(valid.isEmpty()){
                      new AlertDialog.Builder(this).setTitle("Sem fontes compatíveis")
                          .setMessage("Não há fonte reproduzível sem DRM especial neste player.").setPositiveButton("OK",null).show();return;
                  }
                  String[] labels=new String[valid.size()];String[] urls=new String[valid.size()];
                  String[] names=new String[valid.size()];
                  for(int i=0;i<valid.size();i++){
                      ChannelStore.Variant v=valid.get(i);urls[i]=v.url;names[i]=v.label;
                      labels[i]=v.label+(v.quality==null||v.quality.isEmpty()?"":" • "+v.quality);
                  }
                  new AlertDialog.Builder(this).setTitle("Fontes de "+original.name)
                    .setItems(labels,(d,which)->{
                        ChannelStore.Channel item=new ChannelStore.Channel(0,original.name,urls[which],original.category,original.logo,original.type,false);
                        Intent intent=new Intent(this,FullScreenPlayerActivity.class);
                        intent.putExtra("address",item.url);intent.putExtra("name",item.name);
                        intent.putExtra("category",item.category);intent.putExtra("logo",item.logo);
                        intent.putExtra("kind",item.type);intent.putExtra("source_id",currentSourceId);
                        intent.putExtra("source_urls",urls);intent.putExtra("source_labels",names);
                        intent.putExtra("source_choice",which);
                        startActivity(intent);
                    }).setNegativeButton("Cancelar",null).show();
              }
              private void showSeriesEpisodes(ChannelStore.Channel show){
                  String link=prefs.getString("url","");
                  if(!XtreamCatalog.supports(link)){
                      new AlertDialog.Builder(this).setTitle("Série")
                          .setMessage("A sua fonte não oferece a API de episódios desta série. Para assistir, importe uma playlist com os episódios individualizados.")
                          .setPositiveButton("OK",null).show();return;
                  }
                  AlertDialog dialog=new AlertDialog.Builder(this).create();
                  ScrollView scroll=new ScrollView(this);scroll.setBackgroundColor(SURFACE);
                  LinearLayout content=col();content.setPadding(dp(16),dp(17),dp(16),dp(18));scroll.addView(content);
                  content.addView(text(show.name,20,WHITE,true));gap(content,8);
                  TextView progress=text("Buscando temporadas e episódios...",13,MUTED,false);content.addView(progress);
                  dialog.setView(scroll);dialog.show();if(dialog.getWindow()!=null){
                      dialog.getWindow().setBackgroundDrawableResource(android.R.color.transparent);
                      dialog.getWindow().setLayout(Math.min(dp(540),getResources().getDisplayMetrics().widthPixels-dp(28)), -2);
                  }
                  final String id=show.url.substring("xena-series://".length());
                  new Thread(()->{
                      List<M3UStreamParser.Channel> episodes=null;String message="";
                      try{episodes=XtreamCatalog.episodes(link,id);}catch(Exception ex){message=safeError(ex);}
                      final List<M3UStreamParser.Channel> data=episodes;final String error=message;
                      runOnUiThread(()->{
                          if(isFinishing()||!dialog.isShowing())return;
                          content.removeView(progress);
                          if(data==null||data.isEmpty()){
                              content.addView(text("Não foi possível obter episódios. "+error,12,MUTED,false));return;
                          }
                          int shown=0;
                          for(M3UStreamParser.Channel e:data){
                              if(shown++>=150){content.addView(text("Exibidos os primeiros 150 episódios.",12,MUTED,false));break;}
                              ChannelStore.Channel episode=new ChannelStore.Channel(0,e.name,e.url,e.category,e.logo,SERIES,false);
                              Button play=button("▶ "+e.name,false);play.setTextSize(11);
                              LinearLayout.LayoutParams p=lp(-1,53);p.bottomMargin=dp(7);content.addView(play,p);
                              play.setOnClickListener(v->{dialog.dismiss();openFullscreen(episode);});
                          }
                      });
                  },"XenaTV-Episodes").start();
              }

              private void showAddDialog(){
                  openSourceManager();
              }
              private void openSourceManager(){
                  if(loading||syncingSeries){Toast.makeText(this,"Conclua a importação em andamento antes de trocar de fonte.",Toast.LENGTH_LONG).show();return;}
                  startActivity(new Intent(this,SourcesActivity.class));
              }
              private void pickFile(){
                  Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(intent,SELECT_FILE);
              }
              @Override protected void onActivityResult(int request,int result,Intent intent){
                  super.onActivityResult(request,result,intent);
                  if(request!=SELECT_FILE||result!=RESULT_OK||intent==null||intent.getData()==null)return;
                  Uri selected=intent.getData();
                  try{getContentResolver().takePersistableUriPermission(selected,Intent.FLAG_GRANT_READ_URI_PERMISSION);}catch(Exception ignored){}
                  SourceRegistry.SourceEntry file=sourceRegistry.add("Arquivo M3U local",selected.toString());
                  sourceRegistry.select(file.id);
                  switchSourceIfNeeded();
              }
              private void updateList(){
                  final String source=prefs.getString("url","");
                  if(source.isEmpty()){showAddDialog();return;}
                  if(loading){Toast.makeText(this,"Aguarde esta importação terminar.",Toast.LENGTH_SHORT).show();return;}
                  final int request=++loadVersion;
                  loading=true;renderAll();
                  new Thread(()->{
                      ArrayList<M3UStreamParser.Channel> channels=null;
                      String method="",error="";
                      try {
                          if(source.startsWith("content://")){
                              try(java.io.InputStream input=getContentResolver().openInputStream(Uri.parse(source))){
                                  if(input==null)throw new IOException("Arquivo local indisponível.");
                                  M3UStreamParser.Result parsed=M3UStreamParser.importStream("Minha IPTV",source,input);
                                  if(parsed.direct)throw new IOException("O arquivo é um stream HLS, não uma lista de canais.");
                                  channels=parsed.channels;method="arquivo M3U";
                              }
                          }else{
                              try {
                                  M3UStreamParser.Result parsed=M3UStreamParser.importUrl("Minha IPTV",source,true);
                                  if(!parsed.direct&&parsed.channels.size()>0){channels=parsed.channels;method="lista M3U";}
                                  else error="O endereço devolveu um único stream HLS, não um catálogo.";
                              }catch(Exception e){error=safeError(e);}
                              if((channels==null||channels.isEmpty())&&XtreamCatalog.supports(source)){
                                  try {
                                      XtreamCatalog.Result result=XtreamCatalog.load(source);
                                      channels=result.entries;method="API Xtream ("+result.liveCount+" TV / "+result.moviesCount+" filmes)";
                                  } catch(Exception e){error="M3U: "+error+" | API Xtream: "+safeError(e);}
                              }
                          }
                          if(channels==null||channels.isEmpty())throw new IOException("Não foi possível obter os canais. "+error);
                          // Substituição transacional: se a nova importação falhar, o catálogo anterior é preservado.
                          store.replace(channels);
                          String finalStatus="Importados "+store.count()+" itens usando "+method+".";
                          sourceRegistry.updateStatus(currentSourceId,finalStatus);
                          prefs.edit().putString("status",finalStatus).apply();
                          runOnUiThread(()->{
                              if(request!=loadVersion||isFinishing()||isDestroyed())return;
                              loading=false;selectedGroup="Todos";visibleCount=PAGE;renderAll();
                          });
                      } catch(Exception ex){
                          final String finalStatus="Importação não concluída: "+safeError(ex)+". Os canais anteriores foram preservados.";
                          prefs.edit().putString("status",finalStatus).apply();
                          sourceRegistry.updateStatus(currentSourceId,finalStatus);
                          runOnUiThread(()->{
                              if(request!=loadVersion||isFinishing()||isDestroyed())return;
                              loading=false;renderAll();
                              new AlertDialog.Builder(this).setTitle("Não foi possível carregar sua lista")
                                  .setMessage(finalStatus).setPositiveButton("OK",null).show();
                          });
                      }
                  },"XenaTV-Importador").start();
              }
              private static String safeError(Exception e){
                  String s=e.getMessage()==null?e.getClass().getSimpleName():e.getMessage();
                  // Nunca mostrar credenciais ou URLs completas em alertas/diagnósticos.
                  if(s.contains("http://")||s.contains("https://")||s.contains("password="))return "servidor rejeitou ou não retornou o catálogo esperado";
                  return s.length()>300?s.substring(0,300):s;
              }
              @Override public void onConfigurationChanged(Configuration change){
                  super.onConfigurationChanged(change);drawApp();
              }
              @Override public void onBackPressed(){
                  if(!tab.equals(HOME)){navigate(HOME);return;}super.onBackPressed();
              }
              private void switchSourceIfNeeded(){
                  if(sourceRegistry==null)return;
                  sourceRegistry.reload();
                  String wanted=sourceRegistry.activeId();
                  String pageId=preferredIdFor(tab);
                  wanted=pageId;
                  if(wanted.equals(currentSourceId)){
                      if(store!=null&&body!=null)renderBody();
                      return;
                  }
                  loadVersion++; // stale UI results must not overwrite an unrelated source
                  if(store!=null)store.close();
                  currentSourceId=wanted;
                  store=new ChannelStore(this,wanted);
                  selectedGroup="Todos";search="";visibleCount=PAGE;
                  drawApp();
                  if(store.count()==0&&!prefs.getString("url","").isEmpty())updateList();
              }
              @Override protected void onResume(){
                  super.onResume();
                  if(sourceRegistry!=null&&store!=null&&body!=null&&!firstPaint){
                      if(loading||syncingSeries)return; // source switching is blocked during a local import
                      switchSourceIfNeeded();
                  }
              }
              @Override protected void onDestroy(){loadVersion++;if(store!=null)store.close();super.onDestroy();}
          }
