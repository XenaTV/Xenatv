              private void syncSeries(Button button){
                  String link=prefs.getString("url","");
                  if(!XtreamCatalog.supports(link))return;
                  if(syncingSeries)return;
                  syncingSeries=true;
                  button.setEnabled(false);button.setText("Consultando catálogo de séries...");
                  final ChannelStore sourceStore=store;
                  new Thread(()->{
                      ArrayList<M3UStreamParser.Channel> series=null;String error="";
                      try{series=XtreamCatalog.seriesOnly(link);if(!series.isEmpty())sourceStore.mergeSeries(series);}
                      catch(Exception e){error=safeError(e);}
                      final int count=series==null?0:series.size();final String failure=error;
                      runOnUiThread(()->{
                          syncingSeries=false;
                          if(isFinishing()||isDestroyed())return;
                          if(!failure.isEmpty())Toast.makeText(this,"Séries: "+failure,Toast.LENGTH_LONG).show();
                          else Toast.makeText(this,count+" séries organizadas na biblioteca.",Toast.LENGTH_LONG).show();
                          renderBody();
                      });
                  },"XenaTV-SeriesSync").start();
              }
