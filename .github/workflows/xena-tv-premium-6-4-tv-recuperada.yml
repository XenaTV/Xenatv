              private final SharedPreferences prefs,legacy;
              private final ArrayList<SourceEntry> entries=new ArrayList<>();
              private String selected="principal";

              public SourceRegistry(Context context){
                  prefs=context.getSharedPreferences("xena_sources_v2",Context.MODE_PRIVATE);
                  legacy=context.getSharedPreferences("xena_minha_lista_v1",Context.MODE_PRIVATE);
                  reload();
