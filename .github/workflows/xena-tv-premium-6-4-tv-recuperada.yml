               * Não apaga canais, favoritos, históricos, capas ou credenciais locais.
               */
              @Override public void onUpgrade(SQLiteDatabase db,int oldVersion,int newVersion){
                  if(oldVersion<2){
                      SQLiteStatement update=db.compileStatement("UPDATE channels SET kind=? WHERE _id=?");
                      try(Cursor c=db.rawQuery("SELECT _id,category,address,kind FROM channels",null)){
                          while(c.moveToNext()){
                              String newKind=classify(c.getString(1),c.getString(2));
                              if(!newKind.equals(c.getString(3))){
                                  update.clearBindings();
                                  update.bindString(1,newKind);
                                  update.bindLong(2,c.getLong(0));
                                  update.executeUpdateDelete();
                              }
                          }
                      }finally{update.close();}
                  }
                  if(oldVersion<3)db.execSQL("CREATE TABLE IF NOT EXISTS variants (address TEXT NOT NULL, url TEXT NOT NULL, label TEXT, quality TEXT, referer TEXT, agent TEXT, drm INTEGER NOT NULL DEFAULT 0, PRIMARY KEY(address,url))");
              }

              /**
               * A categoria pode chamar-se "Filmes" mesmo quando contém CANAIS de TV,
               * como A&E e AMC. A natureza da URL ganha prioridade sobre o nome do grupo.
               * Filmes e séries sob demanda continuam em suas áreas específicas.
               */
              static String classify(String category,String address){
                  String cat=category==null?"":category.toLowerCase(Locale.ROOT);
                  String url=address==null?"":address.toLowerCase(Locale.ROOT);
                  if(url.startsWith("xena-saimo://movie/"))return "Filmes";
                  if(url.startsWith("xena-saimo://series/"))return "Séries";
                  if(url.startsWith("xena-series://")||url.contains("/series/")||url.contains("/episode/"))return "Séries";
                  if(url.contains("/movie/")||url.contains("/vod/"))return "Filmes";
                  if(url.contains("/live/")||url.startsWith("rtsp://")||url.startsWith("rtmp://")
                      ||url.startsWith("rtp://")||url.startsWith("udp://"))return "TV";
                  int suffix=url.indexOf('?');
                  String resource=suffix<0?url:url.substring(0,suffix);
                  int fragment=resource.indexOf('#');
                  if(fragment>=0)resource=resource.substring(0,fragment);
                  // Transportes de TV ao vivo; não presumir filme pelo nome da categoria.
                  if(resource.endsWith(".ts")||resource.endsWith(".m3u8")||resource.endsWith(".m3u"))return "TV";
                  // VOD: um arquivo de mídia individual com categoria correspondente.
                  boolean vodFile=resource.endsWith(".mp4")||resource.endsWith(".mkv")
                      ||resource.endsWith(".avi")||resource.endsWith(".m4v")
                      ||resource.endsWith(".mov")||resource.endsWith(".webm");
                  if(vodFile&&(cat.contains("série")||cat.contains("serie")||cat.contains("series")
                      ||cat.contains("temporada")||cat.contains("episódio")))return "Séries";
                  if(vodFile&&(cat.contains("filme")||cat.contains("movie")||cat.contains("cinema")
                      ||cat.contains("vod")))return "Filmes";
                  return "TV";
              }
              public void replace(ArrayList<M3UStreamParser.Channel> items){
                  SQLiteDatabase db=getWritableDatabase();
                  db.beginTransaction();
                  try {
                      db.delete("channels",null,null);
                      db.delete("variants",null,null);
                      SQLiteStatement st=db.compileStatement("INSERT INTO channels(title,address,category,logo,kind) VALUES(?,?,?,?,?)");
                      for(M3UStreamParser.Channel c:items){
                          if(c.url==null||c.url.isEmpty())continue;
                          st.clearBindings();
                          String cat=c.category==null||c.category.trim().isEmpty()?"Sem categoria":c.category.trim();
                          String kind=classify(cat,c.url);
                          st.bindString(1,c.name==null||c.name.isEmpty()?"Canal sem nome":c.name);
                          st.bindString(2,c.url);st.bindString(3,cat);
                          st.bindString(4,c.logo==null?"":c.logo);st.bindString(5,kind);
                          st.executeInsert();
                      }
                      st.close();db.setTransactionSuccessful();
                  } finally {db.endTransaction();}
              }
