          manifest=base/'app/src/main/AndroidManifest.xml'
          xml=manifest.read_text(encoding='utf-8')
          assert 'android.permission.INTERNET' in xml, 'Sem permissão INTERNET'
          xml=xml.replace('android:usesCleartextTraffic="false"','android:usesCleartextTraffic="true"')
          if 'android:name=".FullScreenPlayerActivity"' not in xml:
              marker='<activity android:name=".MainActivity"'
              assert xml.count(marker)==1, 'MainActivity nao localizada'
              xml=xml.replace(marker, '<activity android:name=".FullScreenPlayerActivity" android:exported="false" android:configChanges="keyboardHidden|orientation|screenSize"/>\n        '+marker)
          # Gerenciador privado de fontes, sem permissão para exposição externa.
          if '<activity android:name=".SourcesActivity"' not in xml:
              mainTag='<activity android:name=".MainActivity"'
              assert mainTag in xml
              xml=xml.replace(mainTag,'<activity android:name=".SourcesActivity" android:exported="false"/>\n        '+mainTag)
          if 'android:name=".EventsActivity"' not in xml:
              mainTag='<activity android:name=".MainActivity"'
              assert mainTag in xml
              xml=xml.replace(mainTag,'<activity android:name=".EventsActivity" android:exported="false"/>\n        '+mainTag)
          manifest.write_text(xml,encoding='utf-8')
          app=base/'app/build.gradle'
          data=app.read_text(encoding='utf-8')
          data=re.sub(r'compileSdk\s+35', 'compileSdk 36', data)
          data=re.sub(r'versionCode\s+\d+', 'versionCode 11', data)
          data=re.sub(r"versionName\s+'[^']+'", "versionName '6.4-tv-recuperada'", data)
          assert 'compileSdk 36' in data
          app.write_text(data,encoding='utf-8')
          gradle=base/'build.gradle'
          data=gradle.read_text(encoding='utf-8').replace("version '8.7.3'","version '8.10.1'")
          assert "version '8.10.1'" in data
          gradle.write_text(data,encoding='utf-8')
          print('Xena TV 6.0 Premium • importador M3U/Xtream local, filmes, series, guias e interface nova')
          XENA_PREMIUM_CONFIG
      - name: Compilar APK
        working-directory: xena-premium/XenaTV_Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: XenaTV-PREMIUM-6-4-TV-RECUPERADA-APK
          path: xena-premium/XenaTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
