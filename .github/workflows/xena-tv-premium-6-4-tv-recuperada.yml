                  tagline.setTextSize(10);
                  tagline.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  tagline.setLetterSpacing(.11f);
                  tagline.setGravity(Gravity.CENTER);
                  tagline.setAlpha(0f);
                  stack.addView(tagline, new LinearLayout.LayoutParams(-1, dp(activity, 30)));

                  final AtomicBoolean ending = new AtomicBoolean(false);
                  final Runnable close = () -> {
                      if (!ending.compareAndSet(false, true)) return;
                      overlay.animate().cancel();
