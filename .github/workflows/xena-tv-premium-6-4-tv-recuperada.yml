          package br.com.xenatv.app;

          import android.net.Uri;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.IOException;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /** Leitor independente de catálogos públicos no formato Saimo. Nunca inclui links privados no APK. */
          public final class SaimoCatalog {
              private SaimoCatalog(){}
              public static final class Result {
                  public final ArrayList<M3UStreamParser.Channel> channels=new ArrayList<>();
                  public final HashMap<String,ArrayList<ChannelStore.Variant>> variants=new HashMap<>();
              }
              public static final class Episode {
                  public String title;
                  public ArrayList<ChannelStore.Variant> variants=new ArrayList<>();
              }
              private static String clean(String s){return s==null?"":s.trim();}
              private static String norm(String s){return clean(s).toLowerCase(Locale.ROOT).replaceAll("(?i)\\s+(fhd|hd|sd|uhd|4k)$","").replaceAll("[^a-z0-9]+","");}
              private static boolean valid(String url){return url!=null&&(url.startsWith("https://")||url.startsWith("http://"));}
              public static String base(String address){
                  String s=clean(address);if(!valid(s))return "";
                  try{
                      URL parsed=new URL(s);
                      String path=parsed.getPath();if(path==null||path.isEmpty())path="/";
                      String last=path.substring(path.lastIndexOf('/')+1);
                      if(last.contains("."))path=path.substring(0,path.lastIndexOf('/')+1);
                      if(!path.endsWith("/"))path+="/";
                      if(path.endsWith("/vod/"))path=path.substring(0,path.length()-4);
                      return parsed.getProtocol()+"://"+parsed.getAuthority()+path;
                  }catch(Exception e){return "";}
              }
              private static String read(String address)throws IOException{
                  if(!valid(address))throw new IOException("Endereço de catálogo inválido");
                  HttpURLConnection c=(HttpURLConnection)new URL(address).openConnection();
                  c.setConnectTimeout(12000);c.setReadTimeout(15000);c.setRequestProperty("Accept","text/plain, application/json, */*");
                  c.setRequestProperty("User-Agent","XenaTV/6.3 Android");c.setInstanceFollowRedirects(true);
                  try{
                      int status=c.getResponseCode();if(status!=200)throw new IOException("Catálogo: HTTP "+status);
                      if(c.getContentLengthLong()>18_000_000)throw new IOException("Catálogo acima do tamanho permitido");
                      StringBuilder sb=new StringBuilder(10000);
                      try(BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream(),StandardCharsets.UTF_8))){
                          char[] buf=new char[8192];int n;while((n=br.read(buf))!=-1){
                              sb.append(buf,0,n);if(sb.length()>18_000_000)throw new IOException("Catálogo acima do tamanho permitido");
                          }
                      }
                      return sb.toString().replace("\ufeff","");
                  }finally{c.disconnect();}
              }
              private static String maybe(String s){return valid(s)?s:"";}
              private static void save(Result result,String name,String category,String logo,ArrayList<ChannelStore.Variant> alternatives){
                  if(clean(name).isEmpty()||alternatives.isEmpty())return;
                  for(M3UStreamParser.Channel old:result.channels){
                      if(norm(old.name).equals(norm(name))){
                          ArrayList<ChannelStore.Variant> prior=result.variants.get(old.url);
                          if(prior==null)prior=new ArrayList<>();
                          for(ChannelStore.Variant v:alternatives){boolean found=false;for(ChannelStore.Variant u:prior)if(u.url.equals(v.url))found=true;if(!found)prior.add(v);}
                          result.variants.put(old.url,prior);return;
                      }
                  }
                  String primary=alternatives.get(0).url;
                  result.channels.add(new M3UStreamParser.Channel(name,primary,category,logo));
                  result.variants.put(primary,new ArrayList<>(alternatives));
              }
              public static Result parseChannels(String text){
                  Result out=new Result();String name="",cat="TV ao vivo",logo="";
                  ArrayList<ChannelStore.Variant> choices=new ArrayList<>();
                  for(String raw:text.split("\\r?\\n")){
                      String line=clean(raw);if(line.isEmpty()||line.startsWith("#"))continue;
                      int pos=line.indexOf(':');if(pos<1)continue;
                      String key=clean(line.substring(0,pos)).toLowerCase(Locale.ROOT),v=clean(line.substring(pos+1));
                      if(key.equals("canal")){
                          save(out,name,cat,logo,choices);name=v;cat="TV ao vivo";logo="";choices=new ArrayList<>();
                      }else if(key.equals("logo"))logo=maybe(v);
                      else if(key.equals("categoria"))cat=v.isEmpty()?"TV ao vivo":v;
                      else if(key.equals("fonte")&&valid(v))choices.add(new ChannelStore.Variant(v,"Fonte "+(choices.size()+1),"","","",false));
                      else if(!choices.isEmpty()){
                          ChannelStore.Variant old=choices.get(choices.size()-1);
                          if(key.equals("nome"))old.label=v;
                          else if(key.equals("qualidade"))old.quality=v;
                          else if(key.equals("referer"))old.referer=v;
                          else if(key.equals("agente"))old.agent=v;
                          else if(key.equals("chave"))old.drm=true; // LibVLC não suporta licença ClearKey configurada desta forma
                      }
                  }
                  save(out,name,cat,logo,choices);
                  return out;
              }
              private static void parseM3uExtras(String text,Result out){
                  String name="",category="TV ao vivo",logo="";
                  for(String raw:text.split("\\r?\\n")){
                      String line=clean(raw);
                      if(line.startsWith("#EXTINF")){
                          int comma=line.indexOf(',');name=comma>=0?clean(line.substring(comma+1)):"Canal";
                          category=attribute(line,"group-title");if(category.isEmpty())category="TV ao vivo";
                          logo=attribute(line,"tvg-logo");
                      }else if(valid(line)){
                          ArrayList<ChannelStore.Variant> one=new ArrayList<>();one.add(new ChannelStore.Variant(line,"M3U reserva","","","",false));
                          save(out,name,category,logo,one);
                          name="";
                      }
                  }
              }
              private static String attribute(String line,String attribute){
                  java.util.regex.Matcher m=java.util.regex.Pattern.compile("(?:^|\\s)"+attribute+"=\"([^\"]*)\"").matcher(line);
                  return m.find()?clean(m.group(1)):"";
              }
              public static Result loadChannels(String address)throws IOException{
                  String b=base(address);if(b.isEmpty())throw new IOException("Insira a pasta da lista de canais");
                  Result r=parseChannels(read(b+"catalogo.txt"));
                  if(r.channels.isEmpty())throw new IOException("catalogo.txt não tem canais válidos");
                  try{parseM3uExtras(read(b+"canais.txt"),r);}catch(IOException ignored){}
                  return r;
              }
              private static final class VodIndex {
