                      if(!rest.matches("(?is).*\\.[a-z0-9]{2,5}([?#].*)?$"))rest+=".mp4";
                      return b+rest;
                  }catch(Exception e){return "";}
              }
              private static ArrayList<ChannelStore.Variant> parseVariants(String[] cols,int offset,VodIndex index){
                  ArrayList<ChannelStore.Variant> choices=new ArrayList<>();
                  for(int i=offset;i<cols.length;i++){
                      String value=cols[i];int eq=value.indexOf('=');if(eq<1)continue;
                      String kind=value.substring(0,eq).toLowerCase(Locale.ROOT);
                      if(!kind.equals("dub")&&!kind.equals("leg"))continue;
                      String[] tokens=value.substring(eq+1).split(",");
                      for(String token:tokens){
                          String url=expand(token,index);if(!valid(url))continue;
                          String label=(kind.equals("dub")?"Dublado":"Legendado")+" • Fonte "+(choices.size()+1);
                          choices.add(new ChannelStore.Variant(url,label,"","","",false));
                      }
                  }
                  return choices;
              }
              private static HashMap<String,String> covers(String address,String folder){
                  HashMap<String,String> out=new HashMap<>();String prefix="";
                  try{
                      for(String raw:read(folder+"fichas.txt").split("\\r?\\n")){
                          String line=clean(raw);if(line.startsWith("capa:")){prefix=clean(line.substring(5));continue;}
                          if(line.startsWith("#"))continue;
                          String[] v=line.split("\\t");
                          if(v.length>=5&&!v[3].isEmpty()&&(v[0].equals("f")||v[0].equals("s"))){
                              String image=valid(v[3])?v[3]:prefix+v[3];if(valid(image))out.put(norm(v[1]),image);
                          }
                      }
                  }catch(Exception ignored){}
                  return out;
              }
              public static Result loadVod(String address)throws IOException{
                  String b=base(address);if(b.isEmpty())throw new IOException("Insira a pasta da lista de filmes");
                  VodIndex parsed=index(address); // Validar antes de substituir acervo já salvo
                  HashMap<String,String> logos=covers(address,parsed.folder);
                  String raw=read(parsed.folder+"busca.txt");Result out=new Result();HashSet<String> seen=new HashSet<>();
                  for(String row:raw.split("\\r?\\n")){
                      String[] c=row.split("\\t");if(c.length<3)continue;
                      String kind=c[1].equals("f")?"movie":c[1].equals("s")?"series":"";
                      if(kind.isEmpty())continue;
                      String name=clean(c[0]),letter=clean(c[2]);
                      if(name.isEmpty()||letter.isEmpty()||!seen.add(kind+":"+norm(name)))continue;
                      String year=c.length>3?clean(c[3]):"";
                      String ref="xena-saimo://"+kind+"/"+Uri.encode(letter)+"/"+Uri.encode(name)+"?year="+Uri.encode(year);
                      out.channels.add(new M3UStreamParser.Channel(name,ref,kind.equals("movie")?"Filmes sob demanda":"Séries sob demanda",logos.getOrDefault(norm(name),"")));
                  }
                  if(out.channels.isEmpty())throw new IOException("busca.txt não tem títulos reconhecíveis");
                  return out;
              }
              public static ArrayList<ChannelStore.Variant> movieSources(String base,String ref)throws IOException{
                  Uri u=Uri.parse(ref);String[] segments=u.getPathSegments().toArray(new String[0]);
                  if(segments.length<2)throw new IOException("Filme sem identificação válida");
                  String letter=segments[0],wanted=segments[1];VodIndex index=index(base);
                  for(String row:read(index.folder+"filmes-"+Uri.encode(letter)+".txt").split("\\r?\\n")){
                      String[] cols=row.split("\\t");if(cols.length<2||!norm(cols[0]).equals(norm(wanted)))continue;
                      ArrayList<ChannelStore.Variant> found=parseVariants(cols,1,index);
                      if(!found.isEmpty())return found;
                  }
                  throw new IOException("Sem fontes de reprodução para este filme");
              }
              public static ArrayList<Episode> seriesEpisodes(String base,String ref)throws IOException{
                  Uri u=Uri.parse(ref);List<String> ss=u.getPathSegments();if(ss.size()<2)throw new IOException("Série inválida");
                  String letter=ss.get(0),wanted=ss.get(1),year=u.getQueryParameter("year");
                  VodIndex idx=index(base);String chunk=null;
                  for(String row:read(idx.folder+"series-"+Uri.encode(letter)+".txt").split("\\r?\\n")){
                      String[] c=row.split("\\t");if(c.length>=3&&norm(c[0]).equals(norm(wanted))){chunk=c[2];if(year==null||year.isEmpty()||c[1].equals(year))break;}
                  }
                  if(chunk==null)throw new IOException("Série não localizada no índice");
                  ArrayList<Episode> episodes=new ArrayList<>();boolean found=false;
                  for(String row:read(idx.folder+"series-"+Uri.encode(letter)+"-"+chunk+".txt").split("\\r?\\n")){
                      if(row.startsWith("@")){
                          String[] header=row.substring(1).split("\\t");
                          found=header.length>0&&norm(header[0]).equals(norm(wanted))&&(year==null||year.isEmpty()||header.length<2||header[1].equals(year));
                          continue;
                      }
                      if(!found)continue;
                      String[] c=row.split("\\t");if(c.length<4)continue;
                      String[] fields={"",c[2]+"="+c[3]};
                      Episode e=new Episode();e.title="T"+c[0]+" • E"+c[1]+" — "+(c[2].equals("dub")?"Dublado":"Legendado");
                      e.variants=parseVariants(fields,1,idx);if(!e.variants.isEmpty())episodes.add(e);
                  }
                  return episodes;
              }
          }
