                      ChannelArtwork.bind(image,item.logo,!"TV".equals(item.type));
                      line.addView(logo,lp(45,46));
                      LinearLayout names=col();names.setPadding(dp(9),0,0,0);
                      TextView label=text(item.name,13,WHITE,true);label.setMaxLines(2);names.addView(label);
