                              new int[] { 0x772f1761, 0x002f1761 }, null, Shader.TileMode.CLAMP));
                      canvas.drawCircle(w * .85f, h * .83f, radius * .64f, paint);
                      paint.setShader(null);
                  }
              }
          }
