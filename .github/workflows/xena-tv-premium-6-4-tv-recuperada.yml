              private static boolean looksPlaylist(String preview){
                  // Pode haver uma linha de comentário, aviso ou espaços antes de #EXTM3U.
                  String sample=preview.replace("\r","\n");
                  return sample.contains("#EXTINF")||sample.contains("#EXTM3U")||sample.contains("#EXTGRP:")
                      ||(sample.contains("\n")&&ACCEPTED.matcher(sample.trim()).find());
              }
              private static boolean isHls(String preview){
                  // Playlist HLS é um ÚNICO stream (segmentos/variantes), não lista de canais IPTV.
                  if(!preview.contains("#EXT-X-"))return false;
                  int x=preview.indexOf("#EXT-X-");
                  int ext=preview.indexOf("#EXTINF");
                  return x>=0&&(ext<0||x<ext||preview.contains("#EXT-X-TARGETDURATION")||preview.contains("#EXT-X-STREAM-INF"));
