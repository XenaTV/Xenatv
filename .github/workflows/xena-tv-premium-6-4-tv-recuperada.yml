                  if(s==null||!s.enabled||s.url.isEmpty())return;
                  busy=true;final int req=++revision;registry.updateStatus(id,"Importando canais...");render();
                  final String address=s.url;
                  new Thread(()->{
                      ArrayList<M3UStreamParser.Channel> imported=null;
                      String method="",diagnostic="";
                      try {
                          SaimoCatalog.Result saimo=null;
                          if("saimo_channels".equals(s.kind)){
                              saimo=SaimoCatalog.loadChannels(address);imported=saimo.channels;method="Saimo canais";
                          }else if("saimo_vod".equals(s.kind)){
                              saimo=SaimoCatalog.loadVod(address);imported=saimo.channels;method="Saimo filmes e séries";
                          }else if(address.startsWith("content://")){
                              try(InputStream in=getContentResolver().openInputStream(Uri.parse(address))){
                                  if(in==null)throw new IOException("O arquivo local não está acessível.");
                                  M3UStreamParser.Result result=M3UStreamParser.importStream("IPTV",address,in);
                                  if(!result.direct)imported=result.channels;
                              }
                              method="arquivo M3U";
                          }else {
                              try{
                                  M3UStreamParser.Result result=M3UStreamParser.importUrl("IPTV",address,true);
                                  if(!result.direct)imported=result.channels;
                              }catch(Exception e){diagnostic=safeError(e);}
                              method="lista M3U";
                              if((imported==null||imported.isEmpty())&&XtreamCatalog.supports(address)){
                                  try{
                                      XtreamCatalog.Result result=XtreamCatalog.load(address);
                                      imported=result.entries;method="API Xtream";
                                  }catch(Exception e){diagnostic="M3U: "+diagnostic+" • API: "+safeError(e);}
                              }
                          }
                          if(imported==null||imported.isEmpty())throw new IOException("Não foi possível ler o catálogo. "+diagnostic);
                          // Cada id abre seu próprio banco. Atualizar esta fonte não mexe nas demais.
                          ChannelStore local=new ChannelStore(this,id);
                          int size;
                          try{
                              if("saimo_channels".equals(s.kind))local.replaceLiveCatalogue(imported);
                              else local.replace(imported);
                              if(saimo!=null)local.putVariants(saimo.variants);
                              size=local.count();
                          }finally{local.close();}
                          String status=size+" itens carregados por "+method;
                          runOnUiThread(()->{
                              if(isFinishing()||isDestroyed()||req!=revision)return;
                              registry.updateStatus(id,status);
                              if(selectOnSuccess)registry.select(id);
                              busy=false;render();
                          });
                      }catch(Exception e){
                          final String failure="Falha: "+safeError(e)+". Catálogo anterior preservado.";
                          runOnUiThread(()->{
                              if(isFinishing()||isDestroyed()||req!=revision)return;
                              registry.updateStatus(id,failure);busy=false;render();
                          });
                      }
                  },"XenaTV-Fonte-"+id.substring(0,Math.min(6,id.length()))).start();
              }
              private static String safeError(Exception e){
                  String raw=e.getMessage()==null?e.getClass().getSimpleName():e.getMessage();
                  if(raw.contains("http://")||raw.contains("https://")||raw.contains("password="))return "o servidor recusou ou não retornou um catálogo válido";
                  return raw.length()>180?raw.substring(0,180):raw;
              }
              @Override public void onBackPressed(){if(busy){Toast.makeText(this,"A importação ainda está em andamento.",Toast.LENGTH_SHORT).show();return;}super.onBackPressed();}
          }
