              private void start(ChannelStore.Channel item){
                  if(item==null)return;
                  current=item;store.seen(item.url);
                  available=new ArrayList<>();
                  if(suppliedUrls!=null && item.url.equals(getIntent().getStringExtra("address"))){
                      for(int i=0;i<suppliedUrls.length;i++){
                          String label=suppliedLabels!=null&&i<suppliedLabels.length?suppliedLabels[i]:"Fonte "+(i+1);
                          available.add(new ChannelStore.Variant(suppliedUrls[i],label,"","","",false));
                      }
                      activeVariant=Math.max(0,Math.min(suppliedChoice,available.size()-1));
                  }else{
                      suppliedUrls=null;
                      available=store.variants(item.url);
                      if(available.isEmpty())available.add(new ChannelStore.Variant(item.url,"Principal","","","",false));
                      activeVariant=0;
                  }
                  appendOtherLists(item);
                  startVariant(activeVariant);
              }
              /** Fonte alternativa de outra lista cadastrada, apenas quando o nome do conteúdo coincide. */
              private void appendOtherLists(ChannelStore.Channel item){
                  if(!"TV".equals(item.type))return;
                  String target=normalName(item.name);
                  SourceRegistry registry=new SourceRegistry(this);
                  for(SourceRegistry.SourceEntry source:registry.all()){
                      if(!source.enabled||source.id.equals(getIntent().getStringExtra("source_id")))continue;
                      ChannelStore other=new ChannelStore(this,source.id);
                      try{
                          for(ChannelStore.Channel candidate:other.query("Todos","TV",item.name,35,0)){
                              if(!target.equals(normalName(candidate.name)))continue;
                              ArrayList<ChannelStore.Variant> variants=other.variants(candidate.url);
                              if(variants.isEmpty())variants.add(new ChannelStore.Variant(candidate.url,source.name,"","","",false));
                              for(ChannelStore.Variant v:variants){
                                  boolean exists=false;for(ChannelStore.Variant old:available)if(old.url.equals(v.url))exists=true;
                                  if(!exists){available.add(new ChannelStore.Variant(v.url,source.name+" • "+v.label,v.quality,v.referer,v.agent,v.drm));}
                              }
                          }
                      }finally{other.close();}
                      if(available.size()>35)break;
                  }
              }
              private String normalName(String s){
                  return java.text.Normalizer.normalize(s,java.text.Normalizer.Form.NFD).replaceAll("[\u0300-\u036f]","")
                      .toLowerCase(Locale.ROOT).replaceAll("(?i)\s+(fhd|hd|sd|uhd|4k)$","")
                      .replaceAll("[^a-z0-9]","");
              }
              private void showSources(){
                  if(available.isEmpty()){message("Nenhuma fonte alternativa cadastrada.");return;}
                  String[] labels=new String[available.size()];
                  for(int i=0;i<labels.length;i++){
                      ChannelStore.Variant v=available.get(i);
                      labels[i]=(i==activeVariant?"✓  ":"")+(v.label==null||v.label.isEmpty()?"Fonte "+(i+1):v.label)
                          +(v.quality==null||v.quality.isEmpty()?"":" • "+v.quality)
                          +(v.drm?" • Protegida":"");
                  }
                  new android.app.AlertDialog.Builder(this).setTitle("Fontes de "+(current==null?"vídeo":current.name))
                      .setItems(labels,(dialog,pos)->startVariant(pos)).setNegativeButton("Cancelar",null).show();
              }
              private void startVariant(int index){
                  if(index<0||index>=available.size())return;
                  ChannelStore.Variant candidate=available.get(index);
                  if(candidate.drm){
                      if(index+1<available.size()){startVariant(index+1);return;}
                      message("Esta fonte requer DRM ClearKey, não disponível neste player.");return;
                  }
                  activeVariant=index;
                  final int generation=++playbackGeneration;
                  playSource(candidate,generation);
              }
              private void playSource(ChannelStore.Variant candidate,int generation){
                  final ChannelStore.Channel item=current;
                  if(currentTitle!=null)currentTitle.setText(item.name);
                  if(currentLogo!=null)ChannelArtwork.bind(currentLogo,item.logo,!"TV".equals(item.type));
                  if(state!=null){state.setVisibility(View.VISIBLE);state.setText("Conectando: "+item.name);}
                  if(channelRows!=null)renderChannels();
                  try{
                      stopVideo();
                      if(engine==null){ArrayList<String> opts=new ArrayList<>();opts.add("--network-caching=2000");
                          opts.add("--http-reconnect");engine=new LibVLC(this,opts);}
                      player=new MediaPlayer(engine);player.attachViews(videoSurface,null,false,false);
                      final MediaPlayer currentPlayer=player;
                      currentPlayer.setEventListener(event->runOnUiThread(()->{
                          if(player!=currentPlayer||isFinishing())return;
                          if(event.type==MediaPlayer.Event.Opening)message("Abrindo transmissão...");
                          else if(event.type==MediaPlayer.Event.Buffering)message("Carregando sinal...");
                          else if(event.type==MediaPlayer.Event.Playing)message("● Reproduzindo: "+item.name);
                          else if(event.type==MediaPlayer.Event.EncounteredError){
                              int next=activeVariant+1;
                              while(next<available.size()&&available.get(next).drm)next++;
                              if(next<available.size()){
                                  final int nextIndex=next;
                                  message("Fonte indisponível. Tentando reserva "+(next+1)+"...");
                                  screen.postDelayed(()->{if(generation==playbackGeneration&&!isFinishing())startVariant(nextIndex);},550);
                              }else message("Sem sinal nas fontes disponíveis. Escolha Fontes ou tente novamente.");
                          }
                          else if(event.type==MediaPlayer.Event.EndReached)message("Transmissão encerrada.");
                      }));
                      Media m=new Media(engine,Uri.parse(candidate.url));
                      m.addOption(":network-caching=2000");m.addOption(":http-reconnect=true");
                      m.addOption(":http-user-agent="+(candidate.agent==null||candidate.agent.isEmpty()?"VLC/3.0.21 LibVLC/3.0.21":candidate.agent));
                      if(candidate.referer!=null&&!candidate.referer.isEmpty())m.addOption(":http-referrer="+candidate.referer);
                      if(candidate.url.startsWith("rtsp://"))m.addOption(":rtsp-tcp");
                      currentPlayer.setMedia(m);m.release();currentPlayer.play();
                  }catch(Exception e){message("Não foi possível iniciar o player. Tente novamente.");}
              }
              private void message(String text){if(state!=null){state.setText(text);state.setVisibility(View.VISIBLE);}}
              private void external(){
                  try{Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(Uri.parse(available.isEmpty()?current.url:available.get(activeVariant).url),"video/*");
                      i.setPackage("org.videolan.vlc");startActivity(i);
                  }catch(Exception e){Toast.makeText(this,"VLC não encontrado no aparelho.",Toast.LENGTH_SHORT).show();}
              }
              private void stopVideo(){
                  if(player!=null){try{player.stop();if(player.getVLCVout().areViewsAttached())player.detachViews();}
                      catch(Exception ignored){}player.release();player=null;}
              }
              @Override public void onBackPressed(){if(open){setGuide(false);return;}finish();}
              @Override protected void onStop(){super.onStop();stopVideo();}
              @Override protected void onRestart(){super.onRestart();if(current!=null&&videoSurface!=null)start(current);}
              @Override protected void onDestroy(){stopVideo();if(engine!=null){engine.release();engine=null;}
                  if(store!=null)store.close();super.onDestroy();}
          }
