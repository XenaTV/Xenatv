              public synchronized void reload(){
                  entries.clear();
                  String data=prefs.getString("sources","");
                  if(!data.isEmpty())try{
                      JSONArray a=new JSONArray(data);
                      for(int i=0;i<a.length();i++){
                          JSONObject j=a.optJSONObject(i);if(j==null)continue;
                          String id=j.optString("id","");
                          if(!id.matches("[a-zA-Z0-9_-]{1,80}"))continue;
                          entries.add(new SourceEntry(id,j.optString("name","Minha lista"),
                              j.optString("url",""),j.optBoolean("enabled",true),j.optString("status",""),j.optString("kind","iptv")));
                      }
                  }catch(Exception ignored){}
                  if(data.isEmpty()){
                      // Banco antigo permanece intacto, vinculado à fonte "principal".
                      entries.add(new SourceEntry("principal",legacy.getString("name","Minha IPTV"),
                          legacy.getString("url",""),true,legacy.getString("status",""),"iptv"));
                      selected="principal";
                      save();
                  }else selected=prefs.getString("selected","principal");
                  SourceEntry active=find(selected);
                  if(active==null||!active.enabled){
                      active=null;
                      for(SourceEntry e:entries)if(e.enabled){active=e;break;}
                      selected=active==null?"none":active.id;
                      save();
                  }
                  mirrorSelected();
              }
              public synchronized ArrayList<SourceEntry> all(){return new ArrayList<>(entries);}
              public synchronized SourceEntry find(String id){
                  for(SourceEntry e:entries)if(e.id.equals(id))return e;
                  return null;
              }
              public synchronized String activeId(){return selected;}
              public synchronized SourceEntry firstOfKind(String kind){for(SourceEntry e:entries)if(e.enabled&&kind.equals(e.kind))return e;return null;}
              public synchronized SourceEntry active(){return find(selected);}
              public synchronized SourceEntry add(String name,String url){return add(name,url,"iptv");}
              public synchronized SourceEntry add(String name,String url,String kind){
                  SourceEntry placeholder=find("principal");
                  if(entries.size()==1 && placeholder!=null && placeholder.url.isEmpty()){
                      placeholder.name=name;placeholder.url=url;placeholder.kind=kind;placeholder.enabled=true;placeholder.status="Aguardando importação";
                      selected=placeholder.id;save();return placeholder;
                  }
                  SourceEntry source=new SourceEntry(UUID.randomUUID().toString(),name,url,true,"Aguardando importação",kind);
                  // Não trocar a fonte selecionada antes da nova lista carregar com sucesso.
                  entries.add(source);save();return source;
              }
              public synchronized void edit(String id,String name,String url){edit(id,name,url,null);}
              public synchronized void edit(String id,String name,String url,String kind){
                  SourceEntry s=find(id);if(s==null)return;
                  if(!s.url.equals(url))s.status="Endereço alterado: atualize para carregar o catálogo";
                  s.name=name;s.url=url;if(kind!=null)s.kind=kind;save();
              }
              public synchronized boolean select(String id){
