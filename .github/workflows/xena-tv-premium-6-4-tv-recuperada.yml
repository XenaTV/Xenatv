              private void renderMediaGrid(){
                  if(mediaGrid==null||(tab.equals(TV)))return;mediaGrid.removeAllViews();
                  List<ChannelStore.Channel> found=store.query(selectedGroup,tab,search,visibleCount+1,0);
                  int amount=Math.min(visibleCount,found.size());
                  if(countText!=null)countText.setText(amount+" itens exibidos");
                  int columns=widthDp()>=800?5:widthDp()>=540?4:widthDp()>=380?3:2;
                  int posterWidth=Math.max(112,(widthDp()-32-(columns-1)*10)/columns);
                  LinearLayout line=null;
                  for(int i=0;i<amount;i++){
                      if(i%columns==0){line=row();line.setGravity(Gravity.TOP);mediaGrid.addView(line,lp(-1,-2));gap(mediaGrid,10);}
                      LinearLayout card=posterCard(found.get(i),posterWidth);
                      LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(0,dp((int)(posterWidth*1.75f)),1);
                      if(i%columns!=columns-1)p.rightMargin=dp(9);
                      line.addView(card,p);
                  }
                  if(found.size()>amount){Button more=button("Mostrar mais "+tab.toLowerCase(Locale.ROOT),false);
                      mediaGrid.addView(more,lp(-1,52));more.setOnClickListener(v->{visibleCount+=36;renderMediaGrid();});}
                  if(amount==0)showEmpty(mediaGrid,"Nenhum conteúdo encontrado. Confira as categorias fornecidas pela sua lista.");
              }
