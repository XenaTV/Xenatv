                  halo.setBackground(fill(activity, 0x286a56ff, 46, 0x7756dfff));
                  halo.setElevation(dp(activity, 18));
                  FrameLayout.LayoutParams haloLp = new FrameLayout.LayoutParams(-1, -1);
                  haloLp.setMargins(dp(activity, 2), dp(activity, 2), dp(activity, 2), dp(activity, 2));
                  glowContainer.addView(halo, haloLp);

