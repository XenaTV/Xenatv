          public final class XenaIntroSplash {
              private XenaIntroSplash() { }

              private static int dp(Context c, float n) {
                  return (int) (n * c.getResources().getDisplayMetrics().density + 0.5f);
              }
              private static GradientDrawable fill(Context c, int color, int radius, int border) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
