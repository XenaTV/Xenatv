              private void renderChannels(){
                  if(channelRows==null||store==null)return;channelRows.removeAllViews();
                  List<ChannelStore.Channel> rows=store.query(group,kind,filter,showCount+1,0);
                  int count=Math.min(showCount,rows.size());
                  for(int i=0;i<count;i++){
                      ChannelStore.Channel item=rows.get(i);
                      LinearLayout line=row();line.setPadding(dp(5),dp(7),dp(5),dp(7));
                      if(current!=null&&item.url.equals(current.url))line.setBackground(shape(HIGHLIGHT,9));
