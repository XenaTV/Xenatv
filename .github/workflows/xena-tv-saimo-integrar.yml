          XENA_SAIMO_SCRIPT
          node --check saimo-integracao.js
          python3 - <<'XENA_PATCH_SITE'
          from pathlib import Path
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          tag='<script src="saimo-integracao.js"></script>'
          if tag not in html:
              assert '</body>' in html, 'Nao foi localizado o fechamento do HTML.'
              html=html.replace('</body>', tag+'\n</body>', 1)
              page.write_text(html,encoding='utf-8')
          print('Adaptador Saimo instalado sem substituir o importador M3U/Xtream.')
          XENA_PATCH_SITE
      - name: Publicar arquivos no proprio repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html saimo-integracao.js
          if git diff --cached --quiet; then
            echo 'O site ja estava atualizado.'
            exit 0
          fi
          git commit -m 'Add Saimo catalog support to Xena TV site'
          git push origin HEAD:main
