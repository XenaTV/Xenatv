                  folders.setHorizontalScrollBarEnabled(false);
                  LinearLayout tabs=row();
                  for(String label:new String[]{"Todos","Canais","Filmes","Séries","Esportes","Realities"}){
                      Button folder=button(label,label.equals(favoriteFilter));
                      LinearLayout.LayoutParams p=lp(-2,44);p.rightMargin=dp(8);
                      tabs.addView(folder,p);folder.setOnClickListener(v->{favoriteFilter=label;renderBody();});
                  }
                  folders.addView(tabs);body.addView(folders);gap(body,12);
                  LinearLayout container=col();body.addView(container);
                  TextView progress=text("Carregando favoritos das fontes ativas...",12,MUTED,false);
                  container.addView(progress);
                  final String selected=favoriteFilter;
                  final int token=++favoritesRevision;
                  new Thread(()->{
                      ArrayList<PlatformResult> saved=new ArrayList<>();
                      for(SourceRegistry.SourceEntry source:new SourceRegistry(this).all()){
                          if(!source.enabled)continue;
                          ChannelStore db=null;
                          try{
                              db=new ChannelStore(this,source.id);
                              for(ChannelStore.Channel ch:db.query("Favoritos","Todos","",350,0)){
                                  if(favoriteMatches(ch,selected))saved.add(new PlatformResult(source.id,source.name,ch));
                              }
                          }catch(Exception ignored){}finally{if(db!=null)db.close();}
                      }
                      runOnUiThread(()->{
                          if(isFinishing()||isDestroyed()||token!=favoritesRevision||!FAV.equals(tab)
                              ||!selected.equals(favoriteFilter))return;
                          container.removeAllViews();
                          if(saved.isEmpty()){
                              showEmpty(container,"Nenhum favorito nesta pasta. Seus itens anteriores continuam preservados.");return;
                          }
                          container.addView(text(saved.size()+" favoritos nesta pasta",12,MINT,true));gap(container,10);
                          int shown=Math.min(100,saved.size());
                          for(int i=0;i<shown;i++){
                              PlatformResult item=saved.get(i);
                              LinearLayout card=channelTile(item.channel,false);
                              card.setOnClickListener(v->openPlatformItem(item));
                              container.addView(card,lp(-1,73));gap(container,7);
                          }
                          if(saved.size()>shown)container.addView(text("Mostrando os primeiros "+shown+" itens desta pasta.",11,MUTED,false));
                      });
                  },"XenaTV-Favorites").start();
              }
