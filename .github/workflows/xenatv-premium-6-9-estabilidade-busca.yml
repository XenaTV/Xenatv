        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app
          cat > xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/GalaxyBackground.java <<'XENATV_V67_GALAXYBACKGROUND'
          package br.com.xenatv.app;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorFilter;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.RadialGradient;
          import android.graphics.Rect;
          import android.graphics.Shader;
          import android.graphics.drawable.Drawable;
          import java.util.Random;

          /**
           * Fundo estelar estático e leve. Não cria bitmaps, não executa animações,
           * não usa rede e não interfere nos cards ou na superfície de vídeo do LibVLC.
           */
          public final class GalaxyBackground extends Drawable {
              private final Paint paint=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final int baseColor;
              private final float density;
              private final float[] starX=new float[150],starY=new float[150],starR=new float[150];
              private final int[] starColor=new int[150];
              private RadialGradient purpleGlow,greenGlow;
              private int alpha=255;

              public GalaxyBackground(Context context,int baseColor){
                  this.baseColor=baseColor;
                  this.density=context.getResources().getDisplayMetrics().density;
                  Random random=new Random(0x58454E415456L); // "XENATV", mesmas posições a cada abertura
                  for(int i=0;i<starX.length;i++){
                      starX[i]=random.nextFloat();starY[i]=random.nextFloat();
                      starR[i]=(0.35f+random.nextFloat()*0.75f)*density;
                      int luminosity=32+random.nextInt(70);
                      if(i%16==0){starColor[i]=Color.argb(luminosity+12,156,236,200);starR[i]*=1.35f;}
                      else if(i%12==0){starColor[i]=Color.argb(luminosity+12,190,146,244);starR[i]*=1.3f;}
                      else starColor[i]=Color.argb(luminosity,223,229,255);
                  }
              }
              @Override protected void onBoundsChange(Rect bounds){
                  super.onBoundsChange(bounds);
                  float w=bounds.width(),h=bounds.height();
                  if(w<=0||h<=0)return;
                  float radius=Math.max(w,h)*0.92f;
                  purpleGlow=new RadialGradient(w*0.18f,h*0.06f,radius,
                      new int[]{0x1a7b3ac8,0x0a56318f,0x007b3ac8},null,Shader.TileMode.CLAMP);
                  greenGlow=new RadialGradient(w*0.90f,h*0.84f,radius,
                      new int[]{0x1274caa6,0x0763ac91,0x0074caa6},null,Shader.TileMode.CLAMP);
              }
              @Override public void draw(Canvas canvas){
                  Rect b=getBounds();if(b.isEmpty())return;
                  canvas.drawColor(baseColor);
                  paint.setAlpha(alpha);
                  if(purpleGlow!=null){paint.setShader(purpleGlow);canvas.drawRect(b,paint);paint.setShader(null);}
                  if(greenGlow!=null){paint.setShader(greenGlow);canvas.drawRect(b,paint);paint.setShader(null);}
                  for(int i=0;i<starX.length;i++){
                      int c=starColor[i];
                      paint.setColor(Color.argb(Color.alpha(c)*alpha/255,Color.red(c),Color.green(c),Color.blue(c)));
                      canvas.drawCircle(b.left+b.width()*starX[i],b.top+b.height()*starY[i],starR[i],paint);
                  }
              }
              @Override public void setAlpha(int value){alpha=Math.max(0,Math.min(255,value));invalidateSelf();}
              @Override public void setColorFilter(ColorFilter filter){paint.setColorFilter(filter);invalidateSelf();}
              @Override public int getOpacity(){return PixelFormat.OPAQUE;}
          }
