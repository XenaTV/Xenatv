          package br.com.xenatv.app;
          
          import java.io.BufferedInputStream;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.FilterInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URI;
          import java.net.URL;
          import java.nio.charset.Charset;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.GZIPInputStream;
          
          /** Lê catálogos M3U canal por canal. Nunca confia apenas no Content-Type do provedor. */
          public final class M3UStreamParser {
              private M3UStreamParser() {}
              public static final int MAX_CHANNELS = 100000;
              private static final long MAX_BYTES = 256L * 1024L * 1024L;
              private static final int SNIFF_BYTES = 16384;
              private static final Pattern ACCEPTED = Pattern.compile("^(https?|rtsp|rtmp|rtp|udp)://", Pattern.CASE_INSENSITIVE);
              private static final Pattern HTTP = Pattern.compile("^https?://", Pattern.CASE_INSENSITIVE);
          
              public static final class Channel {
                  public final String name, url, category, logo;
                  Channel(String name, String url, String category, String logo) {
                      this.name=name;this.url=url;this.category=category;this.logo=logo;
                  }
              }
              public static final class Result {
                  public final ArrayList<Channel> channels;
                  public final boolean limited, direct;
                  Result(ArrayList<Channel> channels, boolean limited, boolean direct) {
                      this.channels=channels;this.limited=limited;this.direct=direct;
                  }
              }
              private static Result single(String name, String url) {
                  ArrayList<Channel> channels=new ArrayList<>();
                  channels.add(new Channel(name,url,"Transmissão direta",""));
                  return new Result(channels,false,true);
              }
              public static Result direct(String name,String url) throws IOException {
                  if(!ACCEPTED.matcher(url).find())throw new IOException("O endereço não é um link de transmissão compatível.");
                  return single(name,url);
              }
              /** Importação automática para compatibilidade com versões antigas. */
              public static Result importUrl(String name,String url) throws IOException {
                  return importUrl(name,url,true);
              }
              /** forceList=true: uma lista inválida dá erro, jamais vira silenciosamente um falso canal. */
              public static Result importUrl(String name,String url,boolean forceList) throws IOException {
                  if(!HTTP.matcher(url).find()) {
                      if(forceList)throw new IOException("Para RTSP/RTMP/RTP/UDP escolha 'Canal direto'.");
                      return direct(name,url);
                  }
                  HttpURLConnection conn=null;
                  try {
                      conn=(HttpURLConnection)new URL(url).openConnection();
                      conn.setInstanceFollowRedirects(true);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(25000);
                      conn.setRequestProperty("User-Agent","VLC/3.0.21 LibVLC/3.0.21");
                      conn.setRequestProperty("Accept","*/*");
                      conn.setRequestProperty("Accept-Encoding","gzip");
                      int code=conn.getResponseCode();
                      if(code<200||code>=300)throw new IOException("Servidor HTTP "+code+". Confira se sua lista ainda está autorizada.");
                      String ct=conn.getContentType();
                      String encoding=conn.getContentEncoding();
                      try(InputStream response=conn.getInputStream()) {
                          InputStream stream=response;
                          if(encoding!=null&&encoding.toLowerCase(Locale.ROOT).contains("gzip"))stream=new GZIPInputStream(stream);
                          return parseInput(name,url,stream,forceList,ct);
                      }
                  }finally {if(conn!=null)conn.disconnect();}
              }
              /** Permite importar um arquivo M3U selecionado do celular (ACTION_OPEN_DOCUMENT). */
              public static Result importStream(String name,String base,InputStream stream) throws IOException {
                  return parseInput(name,base,stream,true,"");
              }
              private static Result parseInput(String name,String base,InputStream decoded,boolean forceList,String mime) throws IOException {
                  BufferedInputStream input=new BufferedInputStream(new LimitedInputStream(decoded,MAX_BYTES),32768);
                  input.mark(SNIFF_BYTES+16);
                  byte[] peek=new byte[SNIFF_BYTES];
                  int count=input.read(peek);
                  input.reset();
                  if(count<1)throw new IOException("Lista vazia: o servidor não enviou dados.");
                  if(count>=2&&(peek[0]&255)==31&&(peek[1]&255)==139) {
                      // Alguns servidores enviam .m3u.gz sem Content-Encoding.
                      return parseInput(name,base,new GZIPInputStream(input),forceList,mime);
                  }
                  Charset charset=detectEncoding(peek,count,mime);
                  String preview=new String(peek,0,count,charset).replace("\uFEFF","").trim();
                  String lowered=preview.toLowerCase(Locale.ROOT);
                  if(lowered.startsWith("<!doctype")||lowered.startsWith("<html")||lowered.startsWith("<?xml")
                      ||lowered.startsWith("{\"error\"")||lowered.startsWith("{\"user_info\"")){
                      throw new IOException("O endereço devolveu HTML/JSON, não uma lista M3U. Confira o link de download.");
                  }
                  if(isHls(preview))return single(name,base);
                  if(looksPlaylist(preview)){
                      try(BufferedReader reader=new BufferedReader(new InputStreamReader(input,charset),32768)) {
                          Result result=parse(reader,base);
                          if(result.direct)return single(name,base);
                          if(result.channels.isEmpty())throw new IOException("Lista M3U encontrada, mas não há canais com links válidos.");
                          return result;
                      }
                  }
                  if(forceList){
                      if(looksBinary(peek,count))throw new IOException("O link enviou vídeo/binário em vez de catálogo M3U. Escolha 'Canal direto' se for um stream.");
                      throw new IOException("O link não devolveu uma lista M3U (#EXTM3U/#EXTINF). Confirme o endereço da playlist.");
                  }
                  if(looksBinary(peek,count)||isMediaMime(mime))return single(name,base);
                  throw new IOException("O link não devolveu uma lista M3U nem uma mídia reconhecida.");
              }
              private static boolean looksPlaylist(String preview){
                  // Pode haver uma linha de comentário, aviso ou espaços antes de #EXTM3U.
                  String sample=preview.replace("\r","\n");
                  return sample.contains("#EXTINF")||sample.contains("#EXTM3U")||sample.contains("#EXTGRP:")
                      ||(sample.contains("\n")&&ACCEPTED.matcher(sample.trim()).find());
              }
              private static boolean isHls(String preview){
                  // Playlist HLS é um ÚNICO stream (segmentos/variantes), não lista de canais IPTV.
                  if(!preview.contains("#EXT-X-"))return false;
                  int x=preview.indexOf("#EXT-X-");
                  int ext=preview.indexOf("#EXTINF");
                  return x>=0&&(ext<0||x<ext||preview.contains("#EXT-X-TARGETDURATION")||preview.contains("#EXT-X-STREAM-INF"));
              }
              private static boolean isMediaMime(String value){
                  String mime=value==null?"":value.toLowerCase(Locale.ROOT);
                  return (mime.startsWith("video/")||mime.startsWith("audio/"))
                      && !mime.contains("mpegurl")&&!mime.contains("m3u")&&!mime.contains("playlist");
              }
              private static Charset detectEncoding(byte[] b,int n,String mime){
                  if(n>=2&&(b[0]&255)==255&&(b[1]&255)==254)return StandardCharsets.UTF_16LE;
                  if(n>=2&&(b[0]&255)==254&&(b[1]&255)==255)return StandardCharsets.UTF_16BE;
                  if(n>=4){
                      int even=0,odd=0,total=0;
                      for(int i=0;i<Math.min(n,300);i++){if(b[i]==0){if(i%2==0)even++;else odd++;}total++;}
                      if(odd>total/5&&odd>even*3)return StandardCharsets.UTF_16LE;
                      if(even>total/5&&even>odd*3)return StandardCharsets.UTF_16BE;
                  }
                  if(mime!=null){
                      Matcher m=Pattern.compile("charset\\s*=\\s*[\"']?([A-Za-z0-9._-]+)",Pattern.CASE_INSENSITIVE).matcher(mime);
                      if(m.find())try {return Charset.forName(m.group(1));}catch(Exception ignored){}
                  }
                  return StandardCharsets.UTF_8;
              }
              private static boolean looksBinary(byte[] data,int n){
                  int control=0;
                  for(int i=0;i<n;i++){
                      int b=data[i]&255;
                      if(b==0||(b<32&&b!=9&&b!=10&&b!=13))control++;
                  }
                  return control>Math.max(1,n/100);
              }
              /** Mantém os nomes, categorias, logos e cada URL de canal. */
              static Result parse(BufferedReader reader,String base) throws IOException {
                  ArrayList<Channel> channels=new ArrayList<>();
                  String pendingName="",group="",logo="",line;
                  boolean sawExtinf=false;
                  while((line=reader.readLine())!=null){
                      line=line.trim();
                      if(line.startsWith("\uFEFF"))line=line.substring(1);
                      if(line.isEmpty())continue;
                      if(line.regionMatches(true,0,"#EXT-X-",0,7))return new Result(new ArrayList<>(),false,true);
                      if(line.regionMatches(true,0,"#EXTINF",0,7)){
                          sawExtinf=true;
                          String meta=line.substring(7);
                          int comma=commaOutsideQuotes(meta);
                          String attrs=comma<0?meta:meta.substring(0,comma);
                          pendingName=comma<0?"":meta.substring(comma+1).trim();
                          if(pendingName.isEmpty())pendingName=attribute(attrs,"tvg-name");
                          group=attribute(attrs,"group-title");
                          logo=attribute(attrs,"tvg-logo");
                      }else if(line.regionMatches(true,0,"#EXTGRP:",0,8)){
                          group=line.substring(8).trim();
                      }else if(!line.startsWith("#")){
                          String url=normalizeLink(line,base);
                          if(url!=null){
                              String title=pendingName.isEmpty()?"Canal "+(channels.size()+1):pendingName;
                              channels.add(new Channel(title,url,group,logo));
                              if(channels.size()>=MAX_CHANNELS)return new Result(channels,true,false);
                          }
                          pendingName="";group="";logo="";
                      }
                  }
                  return new Result(channels,false,false);
              }
              private static int commaOutsideQuotes(String s){
                  char quote=0;
                  for(int i=0;i<s.length();i++){
                      char c=s.charAt(i);
                      if(quote==0&&(c=='\''||c=='"'))quote=c;
                      else if(quote==c)quote=0;
                      else if(c==','&&quote==0)return i;
                  }
                  return -1;
              }
              private static String attribute(String attrs,String key){
                  Matcher m=Pattern.compile("(?:^|\\s)"+Pattern.quote(key)+"\\s*=\\s*([\"'])(.*?)\\1",Pattern.CASE_INSENSITIVE).matcher(attrs);
                  if(m.find())return m.group(2).trim();
                  // Alguns provedores usam atributos sem aspas.
                  m=Pattern.compile("(?:^|\\s)"+Pattern.quote(key)+"\\s*=\\s*([^\\s,]+)",Pattern.CASE_INSENSITIVE).matcher(attrs);
                  return m.find()?m.group(1).trim():"";
              }
              private static String normalizeLink(String value,String base){
                  try{
                      if(value.contains(" "))value=value.replace(" ","%20");
                      URI uri=new URI(value);
                      if(!uri.isAbsolute())uri=new URI(base).resolve(uri);
                      String scheme=uri.getScheme();
                      if(scheme==null||scheme.isEmpty())return null;
                      if(!ACCEPTED.matcher(uri.toString()).find())return null;
                      if((scheme.equalsIgnoreCase("http")||scheme.equalsIgnoreCase("https"))&&uri.getHost()==null)return null;
                      return uri.toString();
                  }catch(Exception e){return null;}
              }
              private static final class LimitedInputStream extends FilterInputStream {
                  long consumed=0;final long max;
                  LimitedInputStream(InputStream stream,long max){super(stream);this.max=max;}
                  @Override public int read() throws IOException {
                      int n=in.read();if(n>=0&&++consumed>max)throw new IOException("Lista ultrapassa 256 MB.");return n;
                  }
                  @Override public int read(byte[] buf,int off,int len) throws IOException {
                      int n=in.read(buf,off,len);if(n>0&&(consumed+=n)>max)throw new IOException("Lista ultrapassa 256 MB.");return n;
                  }
              }
          }
