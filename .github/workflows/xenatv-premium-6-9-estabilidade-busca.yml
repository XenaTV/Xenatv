          /**
           * Logos e capas obtidos SOMENTE dos metadados da playlist do usuário.
           * Memória limitada, fila de trabalho curta, downloads duplicados agrupados.
           */
          public final class ChannelArtwork {
              private static final int MAX_IMAGE_BYTES=6*1024*1024;
              private static final ThreadPoolExecutor POOL=new ThreadPoolExecutor(
                  2,2,30,TimeUnit.SECONDS,new ArrayBlockingQueue<Runnable>(90),
                  new ThreadPoolExecutor.AbortPolicy());
              private static final LruCache<String,Bitmap> CACHE=new LruCache<String,Bitmap>(24*1024){
                  @Override protected int sizeOf(String key,Bitmap bitmap){return Math.max(1,bitmap.getByteCount()/1024);}
              };
              private static final Map<String,ArrayList<WeakReference<ImageView>>> PENDING=new HashMap<>();
              private static final Map<String,Long> NEGATIVE=new HashMap<>();
              private ChannelArtwork(){}

              /** Capa leve e local: nunca deixa um retângulo vazio quando a origem falha. */
              private static final class CosmicCover extends Drawable {
                  private final Paint paint=new Paint(Paint.ANTI_ALIAS_FLAG);
                  @Override public void draw(Canvas canvas){
                      android.graphics.Rect b=getBounds();
                      float w=b.width(),h=b.height();if(w<1||h<1)return;
                      paint.setShader(new LinearGradient(b.left,b.top,b.right,b.bottom,
                          new int[]{0xff251849,0xff112a38,0xff123829},null,Shader.TileMode.CLAMP));
                      canvas.drawRect(b,paint);paint.setShader(null);
                      for(int i=0;i<22;i++){
                          float x=b.left+((i*37+13)%101)/101f*w;
                          float y=b.top+((i*53+11)%103)/103f*h;
                          paint.setColor(i%3==0?0x9989ebc0:0x77b8a6f7);
                          canvas.drawCircle(x,y,Math.max(.6f,w*.004f),paint);
                      }
                      paint.setTypeface(Typeface.create("sans-serif-medium",Typeface.BOLD));
                      paint.setColor(0xffebe3ff);paint.setTextAlign(Paint.Align.CENTER);
                      paint.setTextSize(Math.max(12f,Math.min(w*.17f,27f)));
                      canvas.drawText("XenaTV",b.centerX(),b.top+h*.52f,paint);
                      paint.setTypeface(Typeface.DEFAULT);
                      paint.setTextSize(Math.max(7f,Math.min(w*.075f,13f)));
                      paint.setColor(0xff9fe8c9);
                      canvas.drawText("CAPA INDISPONÍVEL",b.centerX(),b.top+h*.60f,paint);
                  }
                  @Override public void setAlpha(int alpha){}
                  @Override public void setColorFilter(ColorFilter colorFilter){}
                  @Override public int getOpacity(){return PixelFormat.OPAQUE;}
              }
              private static String cleanImageUrl(String address){
                  if(address==null)return "";
                  String url=address.trim().replace("&amp;","&").replace(" ","%20");
                  if(url.startsWith("//"))url="https:"+url;
                  return url;
              }
              public static void bind(ImageView view,String address,boolean poster){
                  final String url=cleanImageUrl(address);
                  view.setTag(url);
                  view.setImageDrawable(poster?new CosmicCover():null);
                  view.setVisibility(poster?View.VISIBLE:View.INVISIBLE);
                  view.setScaleType(poster?ImageView.ScaleType.CENTER_CROP:ImageView.ScaleType.FIT_CENTER);
                  if(!(url.startsWith("https://")||url.startsWith("http://")))return;
                  Bitmap bitmap;
                  synchronized(CACHE){bitmap=CACHE.get(url);}
                  if(bitmap!=null){view.setImageBitmap(bitmap);view.setVisibility(View.VISIBLE);return;}
                  synchronized(PENDING){
                      Long failedAt=NEGATIVE.get(url);
                      if(failedAt!=null){
                          if(System.currentTimeMillis()-failedAt<120000L)return;
                          NEGATIVE.remove(url);
                      }
                      ArrayList<WeakReference<ImageView>> waiters=PENDING.get(url);
                      if(waiters!=null){waiters.add(new WeakReference<>(view));return;}
                      waiters=new ArrayList<>();waiters.add(new WeakReference<>(view));PENDING.put(url,waiters);
                  }
                  // O download nunca ocorre na thread principal e não altera reprodução/decodificação VLC.
                  try{POOL.execute(()->{
                      Bitmap decoded=download(url);
                      if(decoded!=null){synchronized(CACHE){CACHE.put(url,decoded);}}
                      ArrayList<WeakReference<ImageView>> listeners;
                      synchronized(PENDING){
                          listeners=PENDING.remove(url);
                          if(decoded==null){
                              // Evita repetir centenas de solicitações de logos indisponíveis.
                              if(NEGATIVE.size()>300)NEGATIVE.clear();
                              NEGATIVE.put(url,System.currentTimeMillis());
                          }
                      }
                      if(decoded!=null&&listeners!=null){
                          final Bitmap ready=decoded;
                          for(WeakReference<ImageView> ref:listeners){
                              ImageView target=ref.get();if(target==null)continue;
                              target.post(()->{
                                  if(!url.equals(target.getTag()))return;
                                  target.setImageBitmap(ready);target.setVisibility(View.VISIBLE);
                                  target.setAlpha(0f);target.animate().alpha(1f).setDuration(160).start();
                              });
                          }
                      }
                  });}catch(java.util.concurrent.RejectedExecutionException rejected){
                      synchronized(PENDING){PENDING.remove(url);}
                  }
              }
              private static Bitmap download(String address){
                  HttpURLConnection connection=null;
                  try{
                      connection=(HttpURLConnection)new URL(address).openConnection();
                      connection.setConnectTimeout(5500);connection.setReadTimeout(7500);
                      connection.setInstanceFollowRedirects(true);
                      connection.setRequestProperty("User-Agent","XenaTV/6.0");
                      int status=connection.getResponseCode();if(status<200||status>=300)return null;
                      if(connection.getContentLength()>MAX_IMAGE_BYTES)return null;
                      String mime=connection.getContentType();
                      if(mime!=null&&!mime.startsWith("image/")&&!mime.startsWith("application/octet-stream"))return null;
                      byte[] data;
                      try(InputStream in=connection.getInputStream();ByteArrayOutputStream bytes=new ByteArrayOutputStream()){
                          byte[] part=new byte[8192];int n,total=0;
                          while((n=in.read(part))!=-1){total+=n;if(total>MAX_IMAGE_BYTES)return null;bytes.write(part,0,n);}
                          data=bytes.toByteArray();
                      }
                      BitmapFactory.Options dimensions=new BitmapFactory.Options();dimensions.inJustDecodeBounds=true;
                      BitmapFactory.decodeByteArray(data,0,data.length,dimensions);
                      if(dimensions.outWidth<1||dimensions.outHeight<1)return null;
                      int scale=1;
                      while(dimensions.outWidth/scale>500||dimensions.outHeight/scale>760)scale*=2;
                      BitmapFactory.Options options=new BitmapFactory.Options();options.inSampleSize=scale;
                      return BitmapFactory.decodeByteArray(data,0,data.length,options);
                  }catch(Exception ignored){return null;}
                  finally{if(connection!=null)connection.disconnect();}
              }
          }
