              @Override protected void onRestart(){super.onRestart();if(current!=null&&videoSurface!=null)start(current);}
              @Override protected void onDestroy(){if(screen!=null)screen.removeCallbacks(hideChrome);stopVideo();if(engine!=null){engine.release();engine=null;}
