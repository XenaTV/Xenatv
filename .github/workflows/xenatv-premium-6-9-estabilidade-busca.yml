               * O jogador LibVLC sempre começa imediatamente pela fonte principal.
               */
              private void appendOtherLists(ChannelStore.Channel item){
                  if(!"TV".equals(item.type))return;
                  final String ownSource=getIntent().getStringExtra("source_id");
                  new Thread(()->{
                      ArrayList<ChannelStore.Variant> extra=new ArrayList<>();
                      String target=normalName(item.name);
                      try{
                          SourceRegistry registry=new SourceRegistry(this);
                          for(SourceRegistry.SourceEntry source:registry.all()){
                              if(!source.enabled||source.id.equals(ownSource))continue;
                              ChannelStore other=null;
                              try{
                                  other=new ChannelStore(this,source.id);
                                  for(ChannelStore.Channel candidate:other.query("Todos","TV",item.name,35,0)){
                                      if(!target.equals(normalName(candidate.name)))continue;
                                      ArrayList<ChannelStore.Variant> variants=other.variants(candidate.url);
                                      if(variants.isEmpty())variants.add(new ChannelStore.Variant(candidate.url,source.name,"","","",false));
                                      for(ChannelStore.Variant variant:variants){
                                          if(!variant.drm)extra.add(new ChannelStore.Variant(variant.url,source.name+" • "+variant.label,
                                              variant.quality,variant.referer,variant.agent,false));
                                      }
                                      if(extra.size()>=35)break;
                                  }
                              }catch(Exception ignored){
                                  // Fonte com problema não pode derrubar outras fontes ou o player.
                              }finally{if(other!=null)other.close();}
                              if(extra.size()>=35)break;
                          }
                      }catch(Exception ignored){}
                      runOnUiThread(()->{
                          if(isFinishing()||current!=item)return;
                          int next=available.size();
                          for(ChannelStore.Variant variant:extra){
                              boolean duplicate=false;
                              for(ChannelStore.Variant old:available)if(old.url.equals(variant.url)){duplicate=true;break;}
                              if(!duplicate)available.add(variant);
                          }
                          if(exhaustedSources){
                              exhaustedSources=false;
                              if(available.size()>next)startVariant(next);
                              else message("Sem sinal nas fontes disponíveis. Tente novamente.");
                          }
                      });
                  },"xena-tv-alternativas").start();
              }
              private String normalName(String s){
                  return java.text.Normalizer.normalize(s,java.text.Normalizer.Form.NFD).replaceAll("[\u0300-\u036f]","")
                      .toLowerCase(Locale.ROOT).replaceAll("(?i)\s+(fhd|hd|sd|uhd|4k)$","")
                      .replaceAll("[^a-z0-9]","");
              }
