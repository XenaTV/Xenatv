                      for(SourceEntry e:entries)if(e.enabled){selected=e.id;break;}
                  }
                  save();
              }
              public synchronized void updateStatus(String id,String status){
                  SourceEntry source=find(id);if(source==null)return;
                  source.status=status;save();
              }
              private synchronized void save(){
                  JSONArray a=new JSONArray();
                  try{
                      for(SourceEntry s:entries){
                          JSONObject j=new JSONObject();j.put("id",s.id);j.put("name",s.name);
                          j.put("url",s.url);j.put("enabled",s.enabled);j.put("status",s.status);j.put("kind",s.kind);
                          a.put(j);
                      }
                  }catch(Exception ignored){}
