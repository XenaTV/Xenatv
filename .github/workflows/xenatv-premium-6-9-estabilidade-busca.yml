              private String favoriteFilter="Todos";
              private int favoritesRevision=0;
              private boolean favoriteMatches(ChannelStore.Channel ch,String folder){
                  if("Todos".equals(folder))return true;
                  if("Canais".equals(folder))return "TV".equals(ch.type);
                  if("Filmes".equals(folder)||"Séries".equals(folder))return folder.equals(ch.type);
                  String info=(ch.name+" "+ch.category).toLowerCase(Locale.ROOT);
                  if("Esportes".equals(folder))return info.contains("esport")||info.contains("sportv")
                      ||info.contains("espn")||info.contains("futebol")||info.contains("premiere")
                      ||info.contains("nba")||info.contains("ufc");
                  if("Realities".equals(folder))return info.contains("fazenda")||info.contains("reality")
                      ||info.contains("big brother")||info.contains("bbb")||info.contains("masterchef");
                  return false;
              }
              private void showFavorites(){
                  sectionTitle(body,"Meus favoritos","Organizados sem alterar as suas listas ou favoritos já salvos");
