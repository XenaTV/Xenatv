              private void renderSearchRows(){
                  if(rows==null||!SEARCH.equals(tab))return;
                  if(pendingSearch!=null)searchHandler.removeCallbacks(pendingSearch);
                  final int token=++searchRevision;
                  final LinearLayout target=rows;
                  final String term=search.trim();
                  target.removeAllViews();
                  if(term.isEmpty()){
                      showEmpty(target,"Digite um título, canal ou categoria para pesquisar em todas as fontes.");return;
                  }
                  TextView progress=text("Pesquisando nas suas listas...",12,MUTED,false);
                  target.addView(progress);
                  pendingSearch=()->new Thread(()->{
                      ArrayList<PlatformResult> found=new ArrayList<>();
                      int checked=0;
                      for(SourceRegistry.SourceEntry source:new SourceRegistry(this).all()){
                          if(!source.enabled)continue;
                          checked++;
                          ChannelStore db=null;
                          try{
                              db=new ChannelStore(this,source.id);
                              for(ChannelStore.Channel ch:db.query("Todos","Todos",term,30,0)){
                                  if(found.size()>=120)break;
                                  found.add(new PlatformResult(source.id,source.name,ch));
                              }
                          }catch(Exception ignored){}finally{if(db!=null)db.close();}
                          if(found.size()>=120)break;
                      }
                      final int checkedSources=checked;
                      runOnUiThread(()->{
                          if(isFinishing()||isDestroyed()||token!=searchRevision||rows!=target||!SEARCH.equals(tab))return;
                          target.removeAllViews();
                          if(found.isEmpty()){
