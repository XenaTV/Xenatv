          /** Normaliza rótulos de IPTV sem renomeá-los. Zero chamadas à rede ou ao Android. */
          public final class CategoryIconRules {
              private CategoryIconRules() {}
              private static String normalized(String raw) {
                  if (raw == null) return "";
                  return Normalizer.normalize(raw, Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+", "")
                      .toLowerCase(Locale.ROOT).replaceAll("[_|#✓✔✅]", " ").trim();
              }
              private static boolean has(String s, String... words) {
