              private Entry chooseStartupChannel(){
                  if(channels.isEmpty())return null;
                  android.content.SharedPreferences prefs=getSharedPreferences("xena_tv_start_v1",MODE_PRIVATE);
                  String savedAddress=prefs.getString("address","");
                  String savedSource=prefs.getString("source","");
                  if(!savedAddress.isEmpty()){
                      for(Entry entry:channels){
                          if(entry.sourceId.equals(savedSource)&&entry.address.equals(savedAddress))return entry;
                      }
                  }
                  // Prefere a Fazenda/câmera principal das listas habilitadas.
                  Entry best=null;int bestScore=Integer.MIN_VALUE;
                  for(Entry entry:channels){
                      int score=FazendaStartRules.score(entry.title,entry.group);
                      if(score>bestScore){bestScore=score;best=entry;}
                  }
                  // Se não houver Fazenda, inicia a primeira TV válida em vez de uma tela vazia.
                  return bestScore==Integer.MIN_VALUE?channels.get(0):best;
              }
              private void renderGroups(){
