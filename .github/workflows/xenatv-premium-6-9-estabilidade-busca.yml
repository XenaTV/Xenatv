              /** Ícones empacotados no APK: nítidos, offline e sem carregar Google Favicons na tela. */
              private int localBrandIcon(String group){
                  String brand=CategoryIconRules.brand(group);
                  if(brand.isEmpty())return 0;
                  return getResources().getIdentifier("xena_brand_"+brand,"drawable",getPackageName());
              }
              private String categoryMonogram(String group){
                  return CategoryIconRules.emoji(group);
              }
              private int categoryColor(String group){
                  String k=group.toLowerCase(Locale.ROOT);
                  if(k.contains("netflix"))return 0xff9d1827;
                  if(k.contains("prime")||k.contains("amazon"))return 0xff115eaa;
                  if(k.contains("disney"))return 0xff193e9a;
                  if(k.contains("hbo")||k.contains("max"))return 0xff6422a5;
                  if(k.contains("globoplay"))return 0xffaa2848;
                  if(k.contains("apple"))return 0xff555969;
                  if(k.contains("paramount"))return 0xff1f5eac;
                  if(k.contains("crunchyroll"))return 0xffd2731a;
                  if(k.contains("youtube"))return 0xffc32338;
                  if(k.contains("espn"))return 0xffa72025;
                  int[] colors={0xff3c6079,0xff46678a,0xff315b69,0xff624b82,0xff695078,0xff526c4d,0xff6c5a3d};
                  return colors[(group.hashCode()&0x7fffffff)%colors.length];
              }
              private void addGroup(String group,String type){
                  boolean selected=group.equals(selectedGroup);
                  Button button=button(group,false); // Nomes e ordem das categorias preservados.
                  if(selected){button.setTextColor(MINT);button.setBackground(shape(0xff26384a,0xff566e81,12));}
                  button.setTextSize(12);button.setSingleLine(false);button.setMinHeight(dp(52));
                  LinearLayout.LayoutParams p=lp(groups.getOrientation()==LinearLayout.VERTICAL?-1:-2,-2);
                  if(groups.getOrientation()==LinearLayout.VERTICAL)p.bottomMargin=dp(6);else p.rightMargin=dp(7);
                  Runnable select=()->{selectedGroup=group;visibleCount=PAGE;fillGroups(type);
                      if(rows!=null)renderTvRows();else renderMediaGrid();};
                  LinearLayout line=row();line.setMinimumHeight(dp(54));line.setBackground(shape(selected?0xff26384a:PANEL,selected?0xff566e81:BORDER,12));
                  FrameLayout mark=new FrameLayout(this);
                  boolean branded=!CategoryIconRules.brand(group).isEmpty();
                  if(branded){
                      GradientDrawable halo=new GradientDrawable();
                      halo.setShape(GradientDrawable.OVAL);
                      halo.setColors(new int[]{0x228f66db,0x1279e6bb,0x00000000});
                      halo.setGradientType(GradientDrawable.RADIAL_GRADIENT);
                      halo.setGradientRadius(dp(27));
                      mark.setBackground(halo);
                  }else mark.setBackground(shape(categoryColor(group),0,8));
                  int local=localBrandIcon(group);
                  if(local!=0){
                      ImageView image=new ImageView(this);
                      image.setImageResource(local);
                      image.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      image.setPadding(dp(3),dp(3),dp(3),dp(3));
                      mark.addView(image,new FrameLayout.LayoutParams(-1,-1));
                  }else{
                      TextView symbol=text(categoryMonogram(group),21,WHITE,false);
                      symbol.setGravity(Gravity.CENTER);
                      symbol.setIncludeFontPadding(false);
                      mark.addView(symbol,new FrameLayout.LayoutParams(-1,-1));
                  }
                  LinearLayout.LayoutParams ip=lp(38,38);ip.leftMargin=dp(9);ip.rightMargin=dp(8);
                  line.addView(mark,ip);
                  button.setBackground(shape(Color.TRANSPARENT,0,12));
                  line.addView(button,new LinearLayout.LayoutParams(groups.getOrientation()==LinearLayout.VERTICAL?0:-2,-2,groups.getOrientation()==LinearLayout.VERTICAL?1:0));
                  line.setOnClickListener(v->select.run());button.setOnClickListener(v->select.run());
                  groups.addView(line,p);
              }
