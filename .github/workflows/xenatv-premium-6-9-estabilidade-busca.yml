          cat > xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/GameScoreRules.java <<'XENATV_V67_GAMESCORERULES'
          package br.com.xenatv.app;

          import java.text.Normalizer;
          import java.util.Locale;

          /** Regras pequenas e testáveis da agenda esportiva; não dependem de Android. */
          public final class GameScoreRules {
              private GameScoreRules(){}
              public static String normalized(String s){
                  return Normalizer.normalize(s==null?"":s,Normalizer.Form.NFD)
                      .replaceAll("\\p{M}+","").toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]","");
              }
              public static String normalizedChannel(String s){
                  String text=normalized(s);
                  return text.replaceAll("(?:fhd|uhd|hd|sd|4k)$","");
              }
              public static int rank(String status,long start,long now){
                  if("in".equals(status))return 0;
                  if("pre".equals(status)&&start<=now+86400000L)return 1;
                  if("post".equals(status))return 2;
                  return 3;
              }
          }
          XENATV_V67_GAMESCORERULES
          cat > xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/CosmicPlayerEdge.java <<'XENATV_V67_COSMICPLAYEREDGE'
          package br.com.xenatv.app;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.view.View;
          import java.util.Random;

          /**
           * Detalhe espacial somente nas bordas do player, por CIMA da superficie VLC.
           * O centro do video fica livre: nada de filtros ou estrelas sobre as cenas.
           * Desenha uma unica vez quando o Android invalida a View (sem animacao/timer).
           */
          public final class CosmicPlayerEdge extends View {
              private final Paint glow=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint star=new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float density;
              private final float[] positions=new float[48];
              private final float[] radii=new float[48];
              private LinearGradient topGradient,bottomGradient,leftGradient,rightGradient;
              private float edgeH,edgeV;

              public CosmicPlayerEdge(Context context){
                  super(context);
                  density=context.getResources().getDisplayMetrics().density;
                  setWillNotDraw(false);
                  Random random=new Random(0x58454E415456L);
                  for(int i=0;i<positions.length;i++){
                      positions[i]=0.015f+random.nextFloat()*0.97f;
                      radii[i]=(0.3f+random.nextFloat()*0.65f)*density;
                  }
              }

              /** Verificacao util para testes: nenhum ponto decorativo no miolo do video. */
              static boolean isEdge(float x,float y,float width,float height,float borderH,float borderV){
                  return x<=borderV || x>=width-borderV || y<=borderH || y>=height-borderH;
              }

              @Override protected void onSizeChanged(int w,int h,int oldw,int oldh){
                  super.onSizeChanged(w,h,oldw,oldh);
                  edgeH=Math.min(h*0.085f,26f*density);
                  edgeV=Math.min(w*0.050f,12f*density);
                  if(w<1||h<1)return;
                  topGradient=new LinearGradient(0,0,0,edgeH,new int[]{0x351d1653,0x18184152,0x001d1653},null,Shader.TileMode.CLAMP);
                  bottomGradient=new LinearGradient(0,h,0,h-edgeH,new int[]{0x3511303e,0x18213a65,0x0011303e},null,Shader.TileMode.CLAMP);
                  leftGradient=new LinearGradient(0,0,edgeV,0,new int[]{0x211c1a54,0x000e1e38},null,Shader.TileMode.CLAMP);
                  rightGradient=new LinearGradient(w,0,w-edgeV,0,new int[]{0x23103a37,0x00103a37},null,Shader.TileMode.CLAMP);
              }

              @Override protected void onDraw(Canvas canvas){
                  super.onDraw(canvas);
                  final float w=getWidth(),h=getHeight();
                  if(w<=0||h<=0)return;
                  if(topGradient!=null){glow.setShader(topGradient);canvas.drawRect(0,0,w,edgeH,glow);}
                  if(bottomGradient!=null){glow.setShader(bottomGradient);canvas.drawRect(0,h-edgeH,w,h,glow);}
                  if(leftGradient!=null){glow.setShader(leftGradient);canvas.drawRect(0,0,edgeV,h,glow);}
                  if(rightGradient!=null){glow.setShader(rightGradient);canvas.drawRect(w-edgeV,0,w,h,glow);}
                  glow.setShader(null);
                  // 48 pontos pequenos apenas nas bordas, com opacidade baixa.
                  for(int i=0;i<positions.length;i++){
                      float x,y;
                      if(i%4==0){x=positions[i]*w;y=edgeH*0.20f;}
                      else if(i%4==1){x=positions[i]*w;y=h-edgeH*0.20f;}
                      else if(i%4==2){x=edgeV*0.22f;y=positions[i]*h;}
                      else {x=w-edgeV*0.22f;y=positions[i]*h;}
                      if(!isEdge(x,y,w,h,edgeH,edgeV))continue;
                      star.setColor(i%9==0?0x8c9be7cb:(i%7==0?0x80c4a8f4:0x65d9defb));
                      canvas.drawCircle(x,y,radii[i],star);
                  }
              }
          }
          XENATV_V67_COSMICPLAYEREDGE
          cat > xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/PlatformShortcutRules.java <<'XENATV_V67_PLATFORMSHORTCUTRULES'
          package br.com.xenatv.app;

          import java.util.ArrayList;
          import java.util.Locale;

          /** Atalhos de plataformas são filtros locais por categoria da IPTV do usuário.
           * Não representam conexão, assinatura ou catálogo oficial dessas empresas.
           * Não inferir plataforma a partir do título de um filme.
           */
          public final class PlatformShortcutRules {
              public static final class Platform {
                  public final String id, title;
                  public Platform(String id, String title){this.id=id;this.title=title;}
              }
              private PlatformShortcutRules(){}
              private static final Platform[] ALL={
                  new Platform("netflix","Netflix"),
                  new Platform("primevideo","Prime Video"),
                  new Platform("disneyplus","Disney+"),
                  new Platform("hbomax","HBO Max"),
                  new Platform("max","Max"),
                  new Platform("appletv","Apple TV+"),
                  new Platform("paramountplus","Paramount+"),
                  new Platform("globoplay","Globoplay"),
                  new Platform("crunchyroll","Crunchyroll"),
                  new Platform("telecine","Telecine"),
                  new Platform("discoveryplus","Discovery+"),
                  new Platform("plutotv","Pluto TV"),
                  new Platform("mgm","MGM+"),
                  new Platform("looke","Looke"),
                  new Platform("youtube","YouTube"),
                  new Platform("netmovies","NetMovies"),
                  new Platform("rakuten","Rakuten TV"),
                  new Platform("vix","ViX"),
                  new Platform("tubi","Tubi"),
                  new Platform("peacock","Peacock"),
                  new Platform("hulu","Hulu"),
                  new Platform("warnerbros","Warner"),
                  new Platform("universal","Universal+"),
                  new Platform("sony","Sony"),
                  new Platform("starz","Starz / Star+"),
                  new Platform("samsung","Samsung TV"),
                  new Platform("espn","ESPN")
              };
              public static Platform[] all(){return ALL.clone();}
              public static String displayName(String id){
                  for(Platform p:ALL)if(p.id.equals(id))return p.title;
                  return id==null?"Plataforma":id;
              }
              public static String canonical(String id){
                  if(id==null)return "";
                  if("amazon".equals(id))return "primevideo";
                  if("max".equals(id))return "hbomax";
                  return id;
              }
              /** Categoria devolvida pelo provedor, nunca o nome isolado do filme. */
              public static boolean matches(String platform,String category){
                  if(category==null||category.isEmpty())return false;
                  String detected=canonical(CategoryIconRules.brand(category));
                  String target=canonical(platform);
                  return !target.isEmpty()&&target.equals(detected);
              }
              public static ArrayList<String> matchingGroups(String platform,Iterable<String> groups){
                  ArrayList<String> matches=new ArrayList<>();
                  for(String group:groups)if(matches(platform,group))matches.add(group);
                  return matches;
              }
          }
