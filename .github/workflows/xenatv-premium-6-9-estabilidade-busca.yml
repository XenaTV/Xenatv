          /** Catálogo privado do aparelho. A lista continua visível mesmo se o servidor ficar temporariamente fora. */
          public final class ChannelStore extends SQLiteOpenHelper {
              public static final class Channel {
                  public final long id;
                  public final String name,url,category,logo,type;
                  public final boolean favorite;
                  Channel(long i,String n,String u,String c,String l,String t,boolean f){
                      id=i;name=n;url=u;category=c;logo=l;type=t;favorite=f;
                  }
              }
              public static final class Variant {
                  public String url,label,quality,referer,agent;public boolean drm;
                  public Variant(String u,String l,String q,String r,String a,boolean d){url=u;label=l;quality=q;referer=r;agent=a;drm=d;}
              }
              public static final class Group {
                  public final String title;
                  public final int count;
                  Group(String name,int n){title=name;count=n;}
              }
              public ChannelStore(Context context){this(context,"principal");}
              public ChannelStore(Context context,String sourceId){
                  super(context, "principal".equals(sourceId)?"xena_my_catalog_v1.db":
                      "xena_my_catalog_"+sourceId.replaceAll("[^A-Za-z0-9_-]","")+".db", null,4);
              }
              @Override public void onCreate(SQLiteDatabase db){
                  db.execSQL("CREATE TABLE channels (_id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, address TEXT NOT NULL, category TEXT NOT NULL, logo TEXT NOT NULL, kind TEXT NOT NULL)");
                  db.execSQL("CREATE INDEX idx_category ON channels(category)");
                  db.execSQL("CREATE INDEX idx_kind ON channels(kind)");
                  db.execSQL("CREATE TABLE favorites (address TEXT PRIMARY KEY)");
                  db.execSQL("CREATE TABLE recents (address TEXT PRIMARY KEY, seen INTEGER NOT NULL)");
                  db.execSQL("CREATE TABLE variants (address TEXT NOT NULL, url TEXT NOT NULL, label TEXT, quality TEXT, referer TEXT, agent TEXT, drm INTEGER NOT NULL DEFAULT 0, PRIMARY KEY(address,url))");
              }
              /**
               * Atualiza a classificação dos canais JÁ IMPORTADOS, sem baixar a lista outra vez.
               * Não apaga canais, favoritos, históricos, capas ou credenciais locais.
               */
              @Override public void onUpgrade(SQLiteDatabase db,int oldVersion,int newVersion){
                  if(oldVersion<2){
                      SQLiteStatement update=db.compileStatement("UPDATE channels SET kind=? WHERE _id=?");
                      try(Cursor c=db.rawQuery("SELECT _id,category,address,kind FROM channels",null)){
                          while(c.moveToNext()){
                              String newKind=classify(c.getString(1),c.getString(2));
                              if(!newKind.equals(c.getString(3))){
                                  update.clearBindings();
                                  update.bindString(1,newKind);
                                  update.bindLong(2,c.getLong(0));
                                  update.executeUpdateDelete();
                              }
                          }
                      }finally{update.close();}
                  }
                  if(oldVersion<3)db.execSQL("CREATE TABLE IF NOT EXISTS variants (address TEXT NOT NULL, url TEXT NOT NULL, label TEXT, quality TEXT, referer TEXT, agent TEXT, drm INTEGER NOT NULL DEFAULT 0, PRIMARY KEY(address,url))");
                  // 6.9: conserta filmes de playlists rotulados como Netflix/Prime/etc
                  // que chegaram com arquivo VOD .mp4/.mkv, mas foram importados como TV.
                  // Nunca refaz download nem exclui canais, favoritos, filmes ou históricos.
                  if(oldVersion<4){
                      ArrayList<Long> ids=new ArrayList<>();
                      ArrayList<String> types=new ArrayList<>();
                      try(Cursor cursor=db.rawQuery(
                          "SELECT _id,category,address FROM channels WHERE kind='TV' AND ("+
                          "lower(address) LIKE '%.mp4%' OR lower(address) LIKE '%.mkv%' OR " +
                          "lower(address) LIKE '%.avi%' OR lower(address) LIKE '%.webm%' OR " +
                          "lower(address) LIKE '%.m4v%' OR lower(address) LIKE '%.mov%')",null)){
                          while(cursor.moveToNext()){
                              String type=MediaKindRules.classify(cursor.getString(1),cursor.getString(2));
                              if(!"TV".equals(type)){
                                  ids.add(cursor.getLong(0));types.add(type);
                              }
                          }
                      }
                      if(!ids.isEmpty()){
                          SQLiteStatement st=db.compileStatement("UPDATE channels SET kind=? WHERE _id=?");
                          try{
                              for(int i=0;i<ids.size();i++){
                                  st.clearBindings();st.bindString(1,types.get(i));st.bindLong(2,ids.get(i));
                                  st.executeUpdateDelete();
                              }
                          }finally{st.close();}
                      }
                  }
              }

              /**
               * A categoria pode chamar-se "Filmes" mesmo quando contém CANAIS de TV,
               * como A&E e AMC. A natureza da URL ganha prioridade sobre o nome do grupo.
               * Filmes e séries sob demanda continuam em suas áreas específicas.
               */
              static String classify(String category,String address){
                  return MediaKindRules.classify(category,address);
