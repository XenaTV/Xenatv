      - name: Incorporar logos vetoriais offline no APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xena-premium/XenaTV_Android/scripts
          cat > xena-premium/XenaTV_Android/scripts/criar_icones.py <<'XENA_V66_ICON_SCRIPT'
          #!/usr/bin/env python3
          """Incorpora logos de marcas ao APK durante o build; sem consultas de rede em tempo de uso.

          Usa desenhos vetoriais (Simple Icons) quando disponíveis e o favicon oficial do
          próprio domínio como alternativa. Se nenhum carregar, o Java já tem um emoji local.
          Os nomes das marcas não são usados como fonte automática do conteúdo de filmes.
          """
          import concurrent.futures
          import re
          import struct
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ANDROID="http://schemas.android.com/apk/res/android"
          ET.register_namespace('android',ANDROID)
          COMMIT="cd796c98565fc466923fc1128b962e133fa3c612"
          BASE=f"https://raw.githubusercontent.com/simple-icons/simple-icons/{COMMIT}/icons"
          # slug do app -> nome Simple Icons -> site do logo -> cor oficial aproximada
          BRANDS={
           'netflix':('netflix','netflix.com','#E50914'),
           'primevideo':('amazonprimevideo','primevideo.com','#00A8E1'),
           'disneyplus':('disneyplus','disneyplus.com','#FFFFFF'),
           'hbomax':('hbomax','hbomax.com','#B983FF'),
           'max':('max','max.com','#FFFFFF'),
           'globoplay':('globoplay','globoplay.globo.com','#FFFFFF'),
           'appletv':('appletv','tv.apple.com','#FFFFFF'),
           'paramountplus':('paramountplus','paramountplus.com','#FFFFFF'),
           'crunchyroll':('crunchyroll','crunchyroll.com','#F47521'),
           'telecine':('telecine','telecine.com.br','#FFFFFF'),
           'discoveryplus':('discoveryplus','discoveryplus.com','#FFFFFF'),
           'youtube':('youtube','youtube.com','#FF0033'),
           'plutotv':('plutotv','pluto.tv','#FFFFFF'),
           'universal':('universalpictures','universalplus.com','#FFFFFF'),
           'mgm':('mgm','mgmplus.com','#FFFFFF'),
           'looke':('looke','looke.com.br','#FFFFFF'),
           'netmovies':('netmovies','netmovies.com.br','#FFFFFF'),
           'rakuten':('rakuten','rakuten.tv','#BF0000'),
           'vix':('vix','vix.com','#FF8033'),
           'tubi':('tubi','tubitv.com','#F9D651'),
           'sony':('sony','sony.com','#FFFFFF'),
           'warnerbros':('warnerbros','warnerbros.com','#FFFFFF'),
           'peacock':('peacock','peacocktv.com','#FFFFFF'),
           'hulu':('hulu','hulu.com','#1CE783'),
           'espn':('espn','espn.com','#FF0033'),
           'sportv':('sportv','sportv.globo.com','#FFFFFF'),
           'samsung':('samsung','samsung.com','#FFFFFF'),
           'starz':('starz','starz.com','#FFFFFF'),
           'amazon':('amazon','amazon.com','#FF9900'),
          }

          def request(url):
              req=urllib.request.Request(url,headers={'User-Agent':'XenaTV-Brand-Icons/1.0'})
              with urllib.request.urlopen(req,timeout=8) as handle:
                  data=handle.read(140000)
              if len(data)>139999:raise ValueError('arquivo grande')
              return data

          def vector(data,color):
              root=ET.fromstring(data)
              vb=(root.get('viewBox','0 0 24 24').split())
              if len(vb)!=4:raise ValueError('viewBox invalido')
              v=ET.Element('vector',{f'{{{ANDROID}}}width':'32dp',f'{{{ANDROID}}}height':'32dp',
                  f'{{{ANDROID}}}viewportWidth':str(vb[2]),f'{{{ANDROID}}}viewportHeight':str(vb[3])})
              paths=[]
              for path in root.iter():
                  if path.tag.endswith('path') and path.get('d'):
                      d=path.get('d');
                      if len(d)>18000:raise ValueError('vetor excessivo')
                      paths.append(d)
              if not paths:raise ValueError('sem path')
              for d in paths:
                  ET.SubElement(v,'path',{f'{{{ANDROID}}}fillColor':color,f'{{{ANDROID}}}pathData':d})
              return ET.tostring(v,encoding='utf-8',xml_declaration=True)

          # Backup offline de marca já verificada: garante pelo menos Netflix nítido.
          OFFLINE_NETFLIX=b'<svg viewBox="0 0 24 24"><path d="m5.398 0 8.348 23.602c2.346.059 4.856.398 4.856.398L10.113 0H5.398zm8.489 0v9.172l4.715 13.33V0h-4.715zM5.398 1.5V24c1.873-.225 2.81-.312 4.715-.398V14.83L5.398 1.5z"/></svg>'

          def make(args):
              slug,(svg_name,domain,color),xml_dir,png_dir=args
              try:
                  data=request(f'{BASE}/{svg_name}.svg')
                  rendered=vector(data,color)
                  path=xml_dir/f'xena_brand_{slug}.xml';path.write_bytes(rendered)
                  return slug,'vetorial'
              except Exception:
                  if slug=='netflix':
                      (xml_dir/f'xena_brand_{slug}.xml').write_bytes(vector(OFFLINE_NETFLIX,color))
                      return slug,'vetorial offline'
              try:
                  # Favicon de alta resolução do domínio da própria marca, sem rede no dispositivo.
                  data=request(f'https://www.google.com/s2/favicons?domain={domain}&sz=256')
                  if data[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('nao PNG')
                  width,height=struct.unpack('>II',data[16:24])
                  if min(width,height)<48:raise ValueError('resolucao baixa')
                  (png_dir/f'xena_brand_{slug}.png').write_bytes(data)
                  return slug,f'favicon {width}x{height}'
              except Exception:
                  return slug,'emoji local'

          def main():
              resource=Path(sys.argv[1]) if len(sys.argv)>1 else Path('/tmp/xena-icons-test')
              xml_dir=resource/'drawable';png_dir=resource/'drawable-nodpi'
              xml_dir.mkdir(parents=True,exist_ok=True);png_dir.mkdir(parents=True,exist_ok=True)
              todo=[(slug,info,xml_dir,png_dir) for slug,info in BRANDS.items()]
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  results=list(pool.map(make,todo))
              for name,outcome in results:print(f'{name}: {outcome}')
              total=sum(outcome!='emoji local' for _,outcome in results)
              print('XenaTV ícones empacotados:',total,'de',len(results))
              if total<1:raise RuntimeError('O logo Netflix offline deveria estar presente')

          if __name__=='__main__':main()
          XENA_V66_ICON_SCRIPT
