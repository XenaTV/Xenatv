                  HashMap<String,String> logos=covers(address,parsed.folder);
                  String raw=read(parsed.folder+"busca.txt");Result out=new Result();HashSet<String> seen=new HashSet<>();
                  for(String row:raw.split("\\r?\\n")){
                      String[] c=row.split("\\t");if(c.length<3)continue;
                      String kind=c[1].equals("f")?"movie":c[1].equals("s")?"series":"";
                      if(kind.isEmpty())continue;
                      String name=clean(c[0]),letter=clean(c[2]);
                      if(name.isEmpty()||letter.isEmpty()||!seen.add(kind+":"+norm(name)))continue;
                      String year=c.length>3?clean(c[3]):"";
                      String ref="xena-saimo://"+kind+"/"+Uri.encode(letter)+"/"+Uri.encode(name)+"?year="+Uri.encode(year);
                      out.channels.add(new M3UStreamParser.Channel(name,ref,kind.equals("movie")?"Filmes sob demanda":"Séries sob demanda",logos.getOrDefault(norm(name),"")));
                  }
                  if(out.channels.isEmpty())throw new IOException("busca.txt não tem títulos reconhecíveis");
                  return out;
              }
              public static ArrayList<ChannelStore.Variant> movieSources(String base,String ref)throws IOException{
                  Uri u=Uri.parse(ref);String[] segments=u.getPathSegments().toArray(new String[0]);
                  if(segments.length<2)throw new IOException("Filme sem identificação válida");
                  String letter=segments[0],wanted=segments[1];VodIndex index=index(base);
                  for(String row:read(index.folder+"filmes-"+Uri.encode(letter)+".txt").split("\\r?\\n")){
                      String[] cols=row.split("\\t");if(cols.length<2||!norm(cols[0]).equals(norm(wanted)))continue;
                      ArrayList<ChannelStore.Variant> found=parseVariants(cols,1,index);
                      if(!found.isEmpty())return found;
                  }
                  throw new IOException("Sem fontes de reprodução para este filme");
              }
