              private void pickFile(){
                  Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(intent,SELECT_FILE);
              }
              @Override protected void onActivityResult(int request,int result,Intent intent){
                  super.onActivityResult(request,result,intent);
                  if(request!=SELECT_FILE||result!=RESULT_OK||intent==null||intent.getData()==null)return;
                  Uri selected=intent.getData();
                  try{getContentResolver().takePersistableUriPermission(selected,Intent.FLAG_GRANT_READ_URI_PERMISSION);}catch(Exception ignored){}
                  SourceRegistry.SourceEntry file=sourceRegistry.add("Arquivo M3U local",selected.toString());
                  sourceRegistry.select(file.id);
                  switchSourceIfNeeded();
              }
              private void updateList(){
                  final String source=prefs.getString("url","");
                  if(source.isEmpty()){showAddDialog();return;}
                  if(loading){Toast.makeText(this,"Aguarde esta importação terminar.",Toast.LENGTH_SHORT).show();return;}
                  final int request=++loadVersion;
                  loading=true;renderAll();
                  new Thread(()->{
                      ArrayList<M3UStreamParser.Channel> channels=null;
                      String method="",error="";
                      try {
                          if(source.startsWith("content://")){
                              try(java.io.InputStream input=getContentResolver().openInputStream(Uri.parse(source))){
                                  if(input==null)throw new IOException("Arquivo local indisponível.");
                                  M3UStreamParser.Result parsed=M3UStreamParser.importStream("Minha IPTV",source,input);
                                  if(parsed.direct)throw new IOException("O arquivo é um stream HLS, não uma lista de canais.");
                                  channels=parsed.channels;method="arquivo M3U";
                              }
                          }else{
                              try {
                                  M3UStreamParser.Result parsed=M3UStreamParser.importUrl("Minha IPTV",source,true);
                                  if(!parsed.direct&&parsed.channels.size()>0){channels=parsed.channels;method="lista M3U";}
                                  else error="O endereço devolveu um único stream HLS, não um catálogo.";
                              }catch(Exception e){error=safeError(e);}
                              if((channels==null||channels.isEmpty())&&XtreamCatalog.supports(source)){
                                  try {
                                      XtreamCatalog.Result result=XtreamCatalog.load(source);
                                      channels=result.entries;method="API Xtream ("+result.liveCount+" TV / "+result.moviesCount+" filmes)";
                                  } catch(Exception e){error="M3U: "+error+" | API Xtream: "+safeError(e);}
                              }
                          }
                          if(channels==null||channels.isEmpty())throw new IOException("Não foi possível obter os canais. "+error);
                          // Substituição transacional: se a nova importação falhar, o catálogo anterior é preservado.
                          store.replace(channels);
                          String finalStatus="Importados "+store.count()+" itens usando "+method+".";
                          sourceRegistry.updateStatus(currentSourceId,finalStatus);
                          prefs.edit().putString("status",finalStatus).apply();
                          runOnUiThread(()->{
                              if(request!=loadVersion||isFinishing()||isDestroyed())return;
                              loading=false;selectedGroup="Todos";visibleCount=PAGE;renderAll();
                          });
                      } catch(Exception ex){
                          final String finalStatus="Importação não concluída: "+safeError(ex)+". Os canais anteriores foram preservados.";
                          prefs.edit().putString("status",finalStatus).apply();
                          sourceRegistry.updateStatus(currentSourceId,finalStatus);
                          runOnUiThread(()->{
                              if(request!=loadVersion||isFinishing()||isDestroyed())return;
                              loading=false;renderAll();
                              new AlertDialog.Builder(this).setTitle("Não foi possível carregar sua lista")
                                  .setMessage(finalStatus).setPositiveButton("OK",null).show();
                          });
                      }
                  },"XenaTV-Importador").start();
              }
              private static String safeError(Exception e){
                  String s=e.getMessage()==null?e.getClass().getSimpleName():e.getMessage();
                  // Nunca mostrar credenciais ou URLs completas em alertas/diagnósticos.
                  if(s.contains("http://")||s.contains("https://")||s.contains("password="))return "servidor rejeitou ou não retornou o catálogo esperado";
                  return s.length()>300?s.substring(0,300):s;
              }
              @Override public void onConfigurationChanged(Configuration change){
                  super.onConfigurationChanged(change);drawApp();
              }
              @Override public void onBackPressed(){
                  if(!tab.equals(HOME)){navigate(HOME);return;}super.onBackPressed();
              }
              private void switchSourceIfNeeded(){
                  if(sourceRegistry==null)return;
                  sourceRegistry.reload();
                  String wanted=sourceRegistry.activeId();
                  String pageId=preferredIdFor(tab);
                  wanted=pageId;
                  if(wanted.equals(currentSourceId)){
                      if(store!=null&&body!=null)renderBody();
                      return;
                  }
                  loadVersion++; // stale UI results must not overwrite an unrelated source
                  if(store!=null)store.close();
                  currentSourceId=wanted;
                  store=new ChannelStore(this,wanted);
                  selectedGroup="Todos";search="";visibleCount=PAGE;
                  drawApp();
                  if(store.count()==0&&!prefs.getString("url","").isEmpty())updateList();
              }
              @Override protected void onResume(){
                  super.onResume();
                  if(sourceRegistry!=null&&store!=null&&body!=null&&!firstPaint){
                      if(loading||syncingSeries)return; // source switching is blocked during a local import
                      switchSourceIfNeeded();
                  }
              }
              @Override protected void onDestroy(){loadVersion++;if(store!=null)store.close();super.onDestroy();}
          }
