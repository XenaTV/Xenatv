name: XenaTV Premium 6.9 - Estabilidade e Busca Universal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xenatv-premium-6-9-estabilidade-busca.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar Xena TV Premium a partir da versao funcional
        shell: bash
        run: |
          set -euo pipefail
          test -f XenaTV_Android_LibVLC_Teste1.zip
          mkdir -p xena-premium
          unzip -q XenaTV_Android_LibVLC_Teste1.zip -d xena-premium
          test -f xena-premium/XenaTV_Android/app/build.gradle
          mkdir -p xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app
          cat > xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java <<'XENA_PREMIUM_MAINACTIVITY_JAVA'
          package br.com.xenatv.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.DecelerateInterpolator;
          import android.view.animation.PathInterpolator;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          /**
           * Xena TV • interface premium, biblioteca pessoal e navegação leve.
           * Importação/credenciais/SQLite permanecem locais, herdados da versão funcional.
           */
          public class MainActivity extends Activity {
              private static final int BACK=0xff0b0b1c, SURFACE=0xff18192f, PANEL=0xff222743;
              private static final int WHITE=0xfff7f8fc, MUTED=0xffa9b4c8, SOFT=0xff738299;
              private static final int ACCENT=0xffc1a3ff, MINT=0xffa8e6d0, BORDER=0xff4b4a71;
              private static final int PAGE=56, SELECT_FILE=441;
              private static final String HOME="Início", TV="TV ao vivo", MOVIES="Filmes", SERIES="Séries", FAV="Favoritos", SEARCH="Buscar", LIST="Minha lista", GAMES="Jogos de hoje";
              private ChannelStore store;
              private SharedPreferences prefs;
              private SourceRegistry sourceRegistry;
              private String currentSourceId="principal";

              private LinearLayout root, body, dock, sidebar, rows, groups;
              private ScrollView scrolling;
              private TextView brandStatus, countText;
              private String tab=HOME, selectedGroup="Todos", search="";
              private int visibleCount=PAGE, loadVersion=0;
              private boolean loading=false, syncingSeries=false;
              private boolean firstPaint=true;
              // Navegação por plataforma sem misturar filmes com séries nem alterar as listas salvas.
              private String platformBrand="",platformKind=MOVIES;
              private int platformRevision=0,platformShown=42;
              private int searchRevision=0;
              private final android.os.Handler searchHandler=new android.os.Handler(android.os.Looper.getMainLooper());
              private Runnable pendingSearch;
              private final DecelerateInterpolator ease=new DecelerateInterpolator(1.6f);

              @Override public void onCreate(Bundle state){
                  super.onCreate(state);
                  getWindow().setStatusBarColor(BACK);
                  getWindow().setNavigationBarColor(BACK);
                  prefs=getSharedPreferences("xena_minha_lista_v1",Context.MODE_PRIVATE);
                  if(prefs.getString("url","").isEmpty())migrateOldUrl();
                  sourceRegistry=new SourceRegistry(this);
                  currentSourceId=sourceRegistry.activeId();
                  store=new ChannelStore(this,currentSourceId);
                  drawApp();
                  if(state==null)XenaIntroSplash.show(this);
                  if(store.count()==0&&!prefs.getString("url","").isEmpty())updateList();
              }
              private void migrateOldUrl(){
                  try{
                      JSONArray saved=new JSONArray(getSharedPreferences("xena_iptv_private_v1",Context.MODE_PRIVATE).getString("sources","[]"));
                      for(int i=0;i<saved.length();i++){
                          JSONObject item=saved.optJSONObject(i);if(item==null)continue;
                          String url=item.optString("url","");
                          if((url.startsWith("https://")||url.startsWith("http://"))&&!"direto".equals(item.optString("mode","lista"))){
                              prefs.edit().putString("url",url).putString("name",item.optString("name","Minha IPTV")).apply();break;
                          }
                      }
                  }catch(Exception ignored){}
              }
              private int dp(float amount){return (int)(getResources().getDisplayMetrics().density*amount+.5f);}
              private int widthDp(){return (int)(getResources().getDisplayMetrics().widthPixels/getResources().getDisplayMetrics().density);}
              private LinearLayout col(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);return l;}
              private LinearLayout row(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.HORIZONTAL);l.setGravity(Gravity.CENTER_VERTICAL);return l;}
              private LinearLayout.LayoutParams lp(int width,int height){return new LinearLayout.LayoutParams(width<0?width:dp(width),height<0?height:dp(height));}
              private void gap(LinearLayout l,int value){l.addView(new View(this),lp(1,value));}
              private GradientDrawable shape(int color,int stroke,int radius){
                  GradientDrawable d=new GradientDrawable();d.setColor(color);d.setCornerRadius(dp(radius));
                  if(stroke!=0)d.setStroke(dp(1),stroke);return d;
              }
              private GradientDrawable gradient(int start,int end,int radius){
                  GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{start,end});d.setCornerRadius(dp(radius));d.setStroke(dp(1),BORDER);return d;
              }
              private TextView text(String value,int size,int color,boolean bold){
                  TextView t=new TextView(this);t.setText(value);t.setTextSize(size);t.setTextColor(color);
                  if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;
              }
              private boolean animateEnabled(){return Build.VERSION.SDK_INT<26||ValueAnimator.areAnimatorsEnabled();}
              private void tapMotion(View v){
                  v.setOnTouchListener((view,event)->{
                      if(!animateEnabled())return false;
                      if(event.getActionMasked()==MotionEvent.ACTION_DOWN) view.animate().scaleX(.975f).scaleY(.975f).setDuration(110).setInterpolator(ease).start();
                      else if(event.getActionMasked()==MotionEvent.ACTION_UP||event.getActionMasked()==MotionEvent.ACTION_CANCEL)
                          view.animate().scaleX(1f).scaleY(1f).setDuration(175).setInterpolator(ease).start();
                      return false;
                  });
              }
              private Button button(String label,boolean highlight){
                  Button b=new Button(this);b.setAllCaps(false);b.setText(label);b.setTextSize(12);
                  b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);b.setTextColor(highlight?BACK:WHITE);
                  b.setPadding(dp(10),0,dp(10),0);b.setBackground(shape(highlight?0xffdbe4f3:PANEL,highlight?0:BORDER,13));
                  tapMotion(b);return b;
              }
              private void fadeIn(View v){
                  if(!animateEnabled())return;
                  v.setAlpha(0f);v.setTranslationY(dp(10));
                  v.animate().alpha(1f).translationY(0f).setDuration(260).setInterpolator(new PathInterpolator(.2f,0f,.05f,1f)).start();
              }
              private void drawApp(){
                  root=col();root.setBackground(new GalaxyBackground(this,BACK));
                  if(Build.VERSION.SDK_INT>=35){
                      root.setOnApplyWindowInsetsListener((view,insets)->{
                          // Android 15/16 edge-to-edge: mantém logo e dock fora da barra do sistema.
                          root.setPadding(0,insets.getSystemWindowInsetTop(),0,insets.getSystemWindowInsetBottom());
                          return insets;
                      });
                  }
                  setContentView(root);
                  LinearLayout header=row();header.setPadding(dp(17),dp(9),dp(16),dp(9));
                  header.setBackground(new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                          new int[]{0xff1d1437,0xff12253a,0xff102b2a}));
                  // O ícone é o logotipo original Xena TV já incluído no projeto-base.
                  ImageView icon=new ImageView(this);icon.setImageResource(R.drawable.xena_icon);
                  icon.setScaleType(ImageView.ScaleType.FIT_CENTER);header.addView(icon,lp(48,48));
                  LinearLayout identity=col();identity.setPadding(dp(10),0,0,0);
                  identity.addView(text("XenaTV",23,WHITE,true));
                  brandStatus=text("SEU ENTRETENIMENTO, DO SEU JEITO",9,MINT,true);
                  identity.addView(brandStatus);header.addView(identity,new LinearLayout.LayoutParams(0,-2,1));
                  Button find=button("⌕",false);header.addView(find,lp(46,44));find.setContentDescription("Pesquisar na biblioteca");
                  find.setOnClickListener(v->navigate(SEARCH));
                  Button settings=button("☰",false);LinearLayout.LayoutParams mp=lp(46,44);mp.leftMargin=dp(7);
                  header.addView(settings,mp);settings.setContentDescription("Minha lista e configurações");settings.setOnClickListener(v->navigate(LIST));
                  root.addView(header,lp(-1,-2));
                  View divider=new View(this);divider.setBackgroundColor(0xff4b6a75);root.addView(divider,lp(-1,1));
                  LinearLayout contentArea=row();contentArea.setGravity(Gravity.TOP);
                  root.addView(contentArea,new LinearLayout.LayoutParams(-1,0,1));
                  sidebar=null;dock=null;
                  if(widthDp()>=720){
                      sidebar=col();sidebar.setPadding(dp(14),dp(23),dp(13),dp(18));
                      sidebar.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xff1d1737,0xff13263b,0xff10302c}));contentArea.addView(sidebar,lp(184,-1));
                      View sideDivider=new View(this);sideDivider.setBackgroundColor(BORDER);
                      contentArea.addView(sideDivider,lp(1,-1));refreshSidebar();
                  }
                  scrolling=new ScrollView(this);scrolling.setFillViewport(true);scrolling.setVerticalScrollBarEnabled(false);
                  body=col();body.setPadding(dp(16),dp(17),dp(16),dp(24));scrolling.addView(body);
                  contentArea.addView(scrolling,new LinearLayout.LayoutParams(0,-1,1));
                  if(sidebar==null)buildDock();renderBody();
              }
              private void buildDock(){
                  HorizontalScrollView holder=new HorizontalScrollView(this);
                  holder.setHorizontalScrollBarEnabled(false);holder.setFillViewport(true);
                  holder.setBackground(gradient(0xff241b40,0xff113130,24));
                  dock=row();dock.setPadding(dp(5),dp(4),dp(5),dp(5));dock.setGravity(Gravity.CENTER);
                  holder.addView(dock);
                  LinearLayout.LayoutParams hp=lp(-1,64);hp.leftMargin=dp(9);hp.rightMargin=dp(9);hp.bottomMargin=dp(9);
                  root.addView(holder,hp);refreshDock();
              }
              private void refreshDock(){
                  if(dock==null)return;
                  dock.removeAllViews();
                  String[] screens={HOME,TV,MOVIES,SERIES,FAV,LIST};
                  String[] icons={"⌂","▣","▤","▦","♡","☰"};
                  boolean compact=widthDp()<440;
                  for(int i=0;i<screens.length;i++){
                      String dest=screens[i];boolean selected=tab.equals(dest);
                      LinearLayout cell=col();cell.setGravity(Gravity.CENTER);
                      cell.setPadding(dp(compact?10:13),dp(2),dp(compact?10:13),dp(2));
                      cell.setBackground(shape(selected?0xff36305d:Color.TRANSPARENT,selected?0xff5a9388:0,19));
                      TextView mark=text(icons[i],22,selected?MINT:MUTED,true);mark.setGravity(Gravity.CENTER);cell.addView(mark);
                      TextView cap=text(compact?dest.equals("TV ao vivo")?"TV":dest.equals("Minha lista")?"Lista":dest:dest,10,selected?WHITE:MUTED,selected);
                      cap.setSingleLine(true);cap.setGravity(Gravity.CENTER);cell.addView(cap);
                      LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(0,dp(53),1);
                      if(!compact)cp=lp(-2,53);
                      dock.addView(cell,cp);tapMotion(cell);
                      cell.setContentDescription("Abrir "+dest);
                      cell.setOnClickListener(v->navigate(dest));
                  }
              }
              private void refreshSidebar(){
                  if(sidebar==null)return;sidebar.removeAllViews();
                  sidebar.addView(text("EXPLORAR",10,MUTED,true));gap(sidebar,15);
                  String[] screens={HOME,TV,MOVIES,SERIES,FAV,LIST};
                  String[] icons={"⌂  ","▣  ","▤  ","▦  ","♡  ","☰  "};
                  for(int i=0;i<screens.length;i++){
                      String dest=screens[i];boolean selected=tab.equals(dest);
                      TextView item=text(icons[i]+dest,13,selected?WHITE:MUTED,selected);
                      item.setGravity(Gravity.CENTER_VERTICAL);item.setPadding(dp(12),0,dp(6),0);
                      item.setBackground(shape(selected?0xff342b58:Color.TRANSPARENT,selected?0xff52917d:0,13));
                      LinearLayout.LayoutParams p=lp(-1,49);p.bottomMargin=dp(8);sidebar.addView(item,p);
                      tapMotion(item);item.setOnClickListener(v->navigate(dest));
                  }
                  gap(sidebar,24);sidebar.addView(text("SEU ENTRETENIMENTO,\nDO SEU JEITO.",11,SOFT,false));
              }
              private void navigate(String newTab){
                  // A aba TV usa leitor independente de TODAS as listas locais.
                  // A seleção anterior não pode esconder milhares de canais já importados.
                  if(TV.equals(newTab)){
                      startActivity(new Intent(this,LiveTvActivity.class));
                      return;
                  }
                  if(tab.equals(newTab)&&platformBrand.isEmpty()&&!newTab.equals(SEARCH))return;
                  platformBrand="";++platformRevision;
                  if(GAMES.equals(newTab)){
                      Intent games=new Intent(this,EventsActivity.class);
                      games.putExtra("source_id",preferredIdFor(TV));startActivity(games);return;
                  }
                  tab=newTab;selectedGroup="Todos";visibleCount=PAGE;search="";
                  activateMediaSource(newTab);
                  refreshDock();refreshSidebar();renderBody();scrolling.smoothScrollTo(0,0);
              }
              /**
               * Corrige a aba TV vazia quando o usuário importou mais de uma fonte.
               * Prioriza a fonte escolhida somente se ela realmente contiver esse tipo
               * e examina os bancos locais das outras fontes sem baixar nem apagar nada.
               */
              private String preferredIdFor(String page){
                  String selected=sourceRegistry.activeId();
                  SourceRegistry.SourceEntry active=sourceRegistry.find(selected);
                  if(active!=null&&active.enabled&&containsMedia(active,page))return selected;
                  ArrayList<SourceRegistry.SourceEntry> all=sourceRegistry.all();
                  if(page.equals(TV)){
                      // Priorizar TV legítima em fontes IPTV e no catálogo Saimo.
                      for(SourceRegistry.SourceEntry source:all){
                          if(!source.enabled||"saimo_vod".equals(source.kind))continue;
                          if(containsMedia(source,TV))return source.id;
                      }
                  }else if(page.equals(MOVIES)||page.equals(SERIES)){
                      for(SourceRegistry.SourceEntry source:all){
                          if(!source.enabled||"saimo_channels".equals(source.kind))continue;
                          if(containsMedia(source,page))return source.id;
                      }
                  }
                  return selected;
              }
              private boolean containsMedia(SourceRegistry.SourceEntry source,String page){
                  if(page.equals(TV)&&"saimo_vod".equals(source.kind))return false;
                  if((page.equals(MOVIES)||page.equals(SERIES))&&"saimo_channels".equals(source.kind))return false;
                  ChannelStore candidate=new ChannelStore(this,source.id);
                  try{
                      // Reclassifica bancos Saimo 6.3 no local, preservando URLs e logos.
                      if(page.equals(TV)&&"saimo_channels".equals(source.kind))candidate.forceLiveCatalogue();
                      return candidate.typeCount(page)>0;
                  }finally{candidate.close();}
              }
              private void activateMediaSource(String page){
                  if(!page.equals(TV)&&!page.equals(MOVIES)&&!page.equals(SERIES))return;
                  String desired=preferredIdFor(page);
                  if(desired.equals(currentSourceId))return;
                  if(store!=null)store.close();currentSourceId=desired;store=new ChannelStore(this,currentSourceId);
              }
              private void renderAll(){renderBody();}
              private void renderBody(){
                  if(body==null)return;
                  body.removeAllViews();groups=null;rows=null;
                  if(!platformBrand.isEmpty())showPlatformCatalog();
                  else if(tab.equals(HOME))showHome();
                  else if(tab.equals(TV))showTv();
                  else if(tab.equals(MOVIES)||tab.equals(SERIES))showLibrary();
                  else if(tab.equals(FAV))showFavorites();
                  else if(tab.equals(SEARCH))showSearch();
                  else showListSettings();
                  if(!firstPaint)fadeIn(body);firstPaint=false;
              }
              private void sectionTitle(LinearLayout host,String heading,String description){
                  TextView title=text(heading,22,WHITE,true);host.addView(title);gap(host,4);
                  if(description!=null&&!description.isEmpty())host.addView(text(description,12,MUTED,false));gap(host,14);
              }
              private void showHome(){
                  String status=prefs.getString("status","");
                  List<ChannelStore.Channel> featured=store.query("Todos",MOVIES,"",1,0);
                  ChannelStore.Channel spotlight=featured.isEmpty()?null:featured.get(0);
                  FrameLayout hero=new FrameLayout(this);hero.setBackground(gradient(0xff202c43,0xff111c2b,22));
                  hero.setClipToOutline(true);
                  if(spotlight!=null){
                      FrameLayout.LayoutParams posterP=new FrameLayout.LayoutParams(dp(widthDp()>650?310:185),-1,Gravity.RIGHT|Gravity.TOP);
                      ImageView poster=new ImageView(this);poster.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      ChannelArtwork.bind(poster,spotlight.logo,true);poster.setAlpha(.78f);hero.addView(poster,posterP);
                      View shade=new View(this);shade.setBackground(new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,new int[]{0xff202c43,0xf5202c43,0x00202c43}));
                      hero.addView(shade,new FrameLayout.LayoutParams(-1,-1));
                  }
                  LinearLayout intro=col();intro.setPadding(dp(20),dp(17),dp(15),dp(19));
                  intro.addView(text("XenaTV  •  EXPERIÊNCIA PREMIUM",10,MINT,true));gap(intro,14);
                  intro.addView(text(spotlight==null?"Seu cinema. Sua TV.":spotlight.name,24,WHITE,true));gap(intro,8);
                  intro.addView(text(spotlight==null?"Adicione sua lista IPTV para começar a explorar seus canais, filmes e séries.":"Um destaque da sua biblioteca pessoal.",12,0xffd4dce8,false));
                  gap(intro,17);
                  LinearLayout action=row();Button watch=button(spotlight==null?"+ Adicionar lista":"▶ Assistir",true);
                  action.addView(watch,lp(-2,45));watch.setOnClickListener(v->{if(spotlight==null)showAddDialog();else showDetails(spotlight);});
                  if(spotlight!=null){Button details=button("Informações",false);LinearLayout.LayoutParams p=lp(-2,45);p.leftMargin=dp(8);action.addView(details,p);details.setOnClickListener(v->showDetails(spotlight));}
                  intro.addView(action);
                  hero.addView(intro,new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM));
                  body.addView(hero,lp(-1,220));gap(body,19);
                  // Área de atalhos aprovada pelo usuário: logos de streaming dentro do catálogo.
                  // São atalhos para categorias que existirem nas listas adicionadas pelo usuário;
                  // não há links de streaming nem acesso oficial pré-instalado.
                  addPlatformShortcuts();gap(body,16);
                  // Navegação original preservada, em uma faixa compacta abaixo dos logos.
                  HorizontalScrollView quickScroll=new HorizontalScrollView(this);quickScroll.setHorizontalScrollBarEnabled(false);
                  LinearLayout quick=row();
                  addQuick(quick,"▣","TV ao vivo",TV);
                  addQuick(quick,"▤","Filmes",MOVIES);
                  addQuick(quick,"▦","Séries",SERIES);
                  addQuick(quick,"♡","Favoritos",FAV);
                  addQuick(quick,"⚽","Jogos hoje",GAMES);
                  quickScroll.addView(quick);body.addView(quickScroll);gap(body,22);
                  if(store.count()==0){
                      sectionTitle(body,"A sua biblioteca começa aqui","A Xena TV não inclui conteúdo de exemplo.");
                      Button add=button("Adicionar minha lista IPTV",true);body.addView(add,lp(-1,49));add.setOnClickListener(v->showAddDialog());
                      return;
                  }
                  addRail("Filmes da sua lista",MOVIES);
                  addRail("Séries da sua lista",SERIES);
                  addRail("Canais recentes",TV);
                  if(loading||!status.isEmpty()){
                      TextView note=text(loading?"Atualizando sua lista...":status,11,MUTED,false);
                      note.setPadding(dp(12),dp(12),dp(12),dp(12));note.setBackground(shape(SURFACE,BORDER,13));
                      body.addView(note);
                  }
              }
              /** Botões com logotipos locais; a lista de plataformas aparece mesmo antes da IPTV. */
              private void addPlatformShortcuts(){
                  TextView heading=text("PLATAFORMAS",12,MINT,true);
                  body.addView(heading);gap(body,5);
                  body.addView(text("Selecione um logo para explorar os títulos da sua lista.",11,MUTED,false));gap(body,9);
                  HorizontalScrollView scroll=new HorizontalScrollView(this);
                  scroll.setHorizontalScrollBarEnabled(false);
                  LinearLayout strip=row();strip.setGravity(Gravity.CENTER_VERTICAL);
                  for(PlatformShortcutRules.Platform platform:PlatformShortcutRules.all()){
                      // Logos suspensos no universo XenaTV: sem caixas, bordas ou
                      // blocos de cor por trás das marcas que já estão corretas.
                      LinearLayout tile=col();tile.setGravity(Gravity.CENTER);
                      tile.setPadding(dp(5),dp(5),dp(5),dp(5));
                      tile.setBackgroundColor(android.graphics.Color.TRANSPARENT);
                      FrameLayout mark=new FrameLayout(this);
                      // Halo redondo e translúcido, nunca um quadrado cinza.
                      GradientDrawable aura=new GradientDrawable();
                      aura.setShape(GradientDrawable.OVAL);
                      aura.setColors(new int[]{0x33a486ff,0x1189e9c6,0x00000000});
                      aura.setGradientType(GradientDrawable.RADIAL_GRADIENT);
                      aura.setGradientRadius(dp(35));
                      View glow=new View(this);glow.setBackground(aura);
                      mark.addView(glow,new FrameLayout.LayoutParams(dp(69),dp(69),Gravity.CENTER));
                      int resource=localBrandIcon(platform.title);
                      if(resource!=0){
                          ImageView image=new ImageView(this);image.setImageResource(resource);
                          image.setScaleType(ImageView.ScaleType.FIT_CENTER);
                          image.setPadding(dp(3),dp(3),dp(3),dp(3));
                          mark.addView(image,new FrameLayout.LayoutParams(dp(59),dp(59),Gravity.CENTER));
                      }else{
                          TextView icon=text(CategoryIconRules.emoji(platform.title),29,WHITE,false);
                          icon.setGravity(Gravity.CENTER);
                          mark.addView(icon,new FrameLayout.LayoutParams(dp(59),dp(59),Gravity.CENTER));
                      }
                      tile.addView(mark,lp(75,75));gap(tile,2);
                      TextView name=text(platform.title,11,WHITE,true);name.setSingleLine(true);
                      name.setGravity(Gravity.CENTER);tile.addView(name);
                      LinearLayout.LayoutParams pos=lp(106,105);pos.rightMargin=dp(9);strip.addView(tile,pos);
                      tile.setContentDescription("Explorar "+platform.title+" nas minhas listas");
                      tapMotion(tile);tile.setOnClickListener(v->openPlatform(platform.id));
                  }
                  scroll.addView(strip);body.addView(scroll);
              }
              /** O catálogo filtrado é uma tela local, com Filmes e Séries sempre separados. */
              private static final class PlatformResult {
                  final String sourceId,sourceName;
                  final ChannelStore.Channel channel;
                  PlatformResult(String id,String source,ChannelStore.Channel c){sourceId=id;sourceName=source;channel=c;}
              }
              private void openPlatform(String brand){
                  platformBrand=brand;
                  platformKind=MOVIES;
                  platformShown=42;
                  tab=HOME;refreshDock();refreshSidebar();renderBody();
                  if(scrolling!=null)scrolling.smoothScrollTo(0,0);
              }
              private void switchPlatformKind(String kind){
