          package br.com.xenatv.app;

          import java.text.Normalizer;
          import java.util.Locale;
          import java.util.regex.Pattern;

          /** Regras puras para encontrar a câmera da Fazenda sem adivinhar URLs ou fontes. */
          public final class FazendaStartRules {
              private static final Pattern FIRST=Pattern.compile("\\b(?:cam|camera)\\s*0?1\\b");
              private FazendaStartRules(){}
              public static String key(String input){
                  return Normalizer.normalize(input==null?"":input,Normalizer.Form.NFD)
                      .replaceAll("[\\u0300-\\u036f]","").toLowerCase(Locale.ROOT);
              }
              public static boolean isFazenda(String name,String group){
                  return key(name).contains("fazenda")||key(group).contains("fazenda");
              }
              public static int score(String name,String group){
                  if(!isFazenda(name,group))return Integer.MIN_VALUE;
                  String n=key(name);int score=100;
                  if(n.contains("fazenda"))score+=20;
                  if(n.contains("principal"))score+=90;
                  if(FIRST.matcher(n).find())score+=75;
                  if(n.contains("24h")||n.contains("24 horas")||n.contains("24hs"))score+=45;
                  if(n.contains("ao vivo"))score+=12;
                  if(n.contains("reprise")||n.contains("replay")||n.contains("gravado"))score-=150;
                  return score;
              }
          }
