                      SQLiteStatement st=db.compileStatement("INSERT OR REPLACE INTO variants(address,url,label,quality,referer,agent,drm) VALUES(?,?,?,?,?,?,?)");
                      for(Map.Entry<String,ArrayList<Variant>> entry:values.entrySet()){
