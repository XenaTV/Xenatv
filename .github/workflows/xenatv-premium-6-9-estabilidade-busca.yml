          package br.com.xenatv.app;

          import java.util.Locale;

          /** Regra de exibição de TV, independente da seleção atual de fonte e de rótulos de filmes. */
          public final class LiveTvRules {
              private LiveTvRules() {}

              public static boolean isLive(String sourceKind, String savedKind, String address) {
                  if ("saimo_vod".equals(sourceKind)) return false;
                  if ("saimo_channels".equals(sourceKind)) return true;
                  String url = address == null ? "" : address.toLowerCase(Locale.ROOT);
                  if (url.startsWith("xena-series://") || url.startsWith("xena-saimo://movie/")
                          || url.startsWith("xena-saimo://series/")) return false;
                  if (url.contains("/live/") || url.startsWith("rtsp://") || url.startsWith("rtmp://")
                          || url.startsWith("udp://") || url.startsWith("rtp://")) return true;
                  if (url.contains("/movie/") || url.contains("/vod/") || url.contains("/series/")) return false;
                  if ("TV".equalsIgnoreCase(savedKind)) return true;
                  int query = url.indexOf('?');
                  String path = query >= 0 ? url.substring(0, query) : url;
                  return path.endsWith(".m3u8") || path.endsWith(".ts") || path.endsWith(".m3u");
              }
          }
