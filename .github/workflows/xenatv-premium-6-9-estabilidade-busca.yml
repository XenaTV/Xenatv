              public static Result load(String source) throws IOException {
                  Account a=account(source);
                  try {
                      JSONObject auth=new JSONObject(request(api(a,"")));
                      JSONObject user=auth.optJSONObject("user_info");
                      if(user==null||"0".equals(user.optString("auth","1")))
                          throw new IOException("A conta foi recusada pelo painel IPTV. Confira usuário e senha.");
                      String status=user.optString("status","");
                      if(status.equalsIgnoreCase("Expired")||status.equalsIgnoreCase("Disabled")||status.equalsIgnoreCase("Banned"))
                          throw new IOException("O painel IPTV informou status da conta: "+status+".");
                  }catch(IOException e){throw e;}
                  catch(Exception e){throw new IOException("A API IPTV não retornou uma resposta de autenticação válida.");}
                  Map<String,String> liveCategories=categories(a,"get_live_categories");
                  JSONArray live=array(a,"get_live_streams");
                  ArrayList<M3UStreamParser.Channel> entries=new ArrayList<>();
                  String user=URLEncoder.encode(a.user,"UTF-8"),pass=URLEncoder.encode(a.password,"UTF-8");
                  int countLive=0,countMovies=0;
                  for(int i=0;i<live.length()&&entries.size()<M3UStreamParser.MAX_CHANNELS;i++){
                      JSONObject item=live.optJSONObject(i);if(item==null)continue;
                      String id=item.optString("stream_id","");if(!id.matches("[0-9]+"))continue;
                      String title=item.optString("name","Canal "+id);
                      String group=liveCategories.getOrDefault(item.optString("category_id",""),"TV ao vivo");
                      String logo=item.optString("stream_icon","");
                      String url=a.base+"live/"+user+"/"+pass+"/"+id+".ts";
                      entries.add(new M3UStreamParser.Channel(title,url,group,logo));countLive++;
                  }
                  // Algumas contas não oferecem VOD pela API. Isso não deve invalidar os canais ao vivo.
                  try {
                      Map<String,String> movieCategories=categories(a,"get_vod_categories");
                      JSONArray movies=array(a,"get_vod_streams");
                      for(int i=0;i<movies.length()&&entries.size()<M3UStreamParser.MAX_CHANNELS;i++){
                          JSONObject item=movies.optJSONObject(i);if(item==null)continue;
                          String id=item.optString("stream_id","");if(!id.matches("[0-9]+"))continue;
                          String ext=safeExt(item.optString("container_extension","mp4"));
                          String title=item.optString("name","Filme "+id);
                          String group="Filmes • "+movieCategories.getOrDefault(item.optString("category_id",""),"Sem categoria");
                          String logo=item.optString("stream_icon","");
                          String url=a.base+"movie/"+user+"/"+pass+"/"+id+"."+ext;
                          entries.add(new M3UStreamParser.Channel(title,url,group,logo));countMovies++;
                      }
                  } catch(Exception ignored){}
                  // Séries: entradas de catálogo (não sinal de vídeo). Episódios são consultados sob demanda.
                  // A URL interna contém somente ID, nunca usuário ou senha. Conta permanece nas prefs locais.
                  try {
                      Map<String,String> seriesCategories=categories(a,"get_series_categories");
                      JSONArray shows=array(a,"get_series");
                      for(int i=0;i<shows.length()&&entries.size()<M3UStreamParser.MAX_CHANNELS;i++){
                          JSONObject show=shows.optJSONObject(i);if(show==null)continue;
                          String id=show.optString("series_id","");if(!id.matches("[0-9]+"))continue;
                          String title=show.optString("name","Série "+id);
                          String group="Séries • "+seriesCategories.getOrDefault(show.optString("category_id",""),"Sem categoria");
                          String cover=show.optString("cover","");
                          entries.add(new M3UStreamParser.Channel(title,"xena-series://"+id,group,cover));
                      }
                  }catch(Exception ignored){}
                  if(entries.isEmpty())throw new IOException("A API respondeu, mas não retornou canais disponíveis para esta conta.");
                  return new Result(entries,countLive,countMovies);
              }
              /** Consulta apenas séries. Não depende de importar nem sobrescreve os canais ao vivo. */
              public static ArrayList<M3UStreamParser.Channel> seriesOnly(String source) throws IOException {
                  Account a=account(source);
                  Map<String,String> cats=categories(a,"get_series_categories");
                  JSONArray shows=array(a,"get_series");
                  ArrayList<M3UStreamParser.Channel> result=new ArrayList<>();
                  for(int i=0;i<shows.length()&&result.size()<M3UStreamParser.MAX_CHANNELS;i++){
                      JSONObject show=shows.optJSONObject(i);if(show==null)continue;
                      String id=show.optString("series_id","");if(!id.matches("[0-9]+"))continue;
                      String name=show.optString("name","Série "+id);
                      String category="Séries • "+cats.getOrDefault(show.optString("category_id",""),"Sem categoria");
                      result.add(new M3UStreamParser.Channel(name,"xena-series://"+id,category,show.optString("cover","")));
                  }
                  return result;
              }
              /** Busca episódios de uma série Xtream sem alterar o catálogo nem os canais existentes. */
              public static ArrayList<M3UStreamParser.Channel> episodes(String source,String seriesId) throws IOException {
                  if(seriesId==null||!seriesId.matches("[0-9]+"))throw new IOException("ID da série inválido.");
                  Account a=account(source);
                  JSONObject info;
                  try {info=new JSONObject(request(api(a,"get_series_info")+"&series_id="+seriesId));}
                  catch(Exception e){throw new IOException("Servidor não forneceu episódios desta série.");}
                  JSONObject seasons=info.optJSONObject("episodes");
                  if(seasons==null)throw new IOException("Nenhuma temporada disponível no catálogo.");
                  String user=URLEncoder.encode(a.user,"UTF-8"),pass=URLEncoder.encode(a.password,"UTF-8");
                  ArrayList<M3UStreamParser.Channel> result=new ArrayList<>();
                  ArrayList<String> keys=new ArrayList<>();
                  java.util.Iterator<String> it=seasons.keys();
                  while(it.hasNext())keys.add(it.next());
                  keys.sort((x,y)->{
                      try{return Integer.compare(Integer.parseInt(x),Integer.parseInt(y));}
                      catch(Exception e){return x.compareTo(y);}
                  });
                  for(String season:keys){
                      JSONArray episodes=seasons.optJSONArray(season);if(episodes==null)continue;
                      for(int i=0;i<episodes.length()&&result.size()<1000;i++){
                          JSONObject ep=episodes.optJSONObject(i);if(ep==null)continue;
                          String id=ep.optString("id","");
                          if(!id.matches("[0-9]+"))continue;
                          String ext=safeExt(ep.optString("container_extension","mp4"));
                          String name="T"+season+" • E"+ep.optString("episode_num",String.valueOf(i+1))+" — "+ep.optString("title","Episódio");
                          String url=a.base+"series/"+user+"/"+pass+"/"+id+"."+ext;
                          JSONObject meta=ep.optJSONObject("info");
                          String image=meta==null?"":meta.optString("movie_image","");
                          result.add(new M3UStreamParser.Channel(name,url,"Séries • Temporada "+season,image));
                      }
                  }
                  return result;
              }
          }
