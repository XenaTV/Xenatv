              private List<Game> fetchLeague(String league,String dateRange)throws Exception{
                  String url="https://site.api.espn.com/apis/site/v2/sports/"+league+"/scoreboard?dates="+dateRange+"&limit=100";
                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();
                  c.setConnectTimeout(5500);c.setReadTimeout(6500);
                  c.setRequestProperty("Accept","application/json");
                  c.setRequestProperty("User-Agent","XenaTV/6.7 (Android; SportsScores)");
                  try{
                      if(c.getResponseCode()!=200)throw new IllegalStateException("placar indisponível");
                      StringBuilder json=new StringBuilder();
                      try(BufferedReader br=new BufferedReader(new InputStreamReader(c.getInputStream(),StandardCharsets.UTF_8))){
                          char[] buffer=new char[4096];int n;
                          while((n=br.read(buffer))!=-1){json.append(buffer,0,n);
                              if(json.length()>2_000_000)throw new IllegalStateException("resposta muito grande");}
                      }
                      JSONObject root=new JSONObject(json.toString());
                      JSONArray events=root.optJSONArray("events");ArrayList<Game> games=new ArrayList<>();
                      if(events==null)return games;
                      JSONObject leagueData=root.optJSONArray("leagues")==null?null:root.optJSONArray("leagues").optJSONObject(0);
                      String leagueName=leagueData==null?league:leagueData.optString("name",league);
                      for(int i=0;i<events.length()&&i<120;i++){
                          JSONObject event=events.optJSONObject(i);if(event==null)continue;
                          JSONArray competitionArray=event.optJSONArray("competitions");
                          JSONObject comp=competitionArray==null?null:competitionArray.optJSONObject(0);
                          if(comp==null)continue;
                          JSONArray competitors=comp.optJSONArray("competitors");
                          if(competitors==null||competitors.length()<2)continue;
                          JSONObject home=null,away=null;
                          for(int k=0;k<competitors.length();k++){
                              JSONObject cpt=competitors.optJSONObject(k);if(cpt==null)continue;
                              if("home".equals(cpt.optString("homeAway")))home=cpt;
                              else if("away".equals(cpt.optString("homeAway")))away=cpt;
                          }
                          if(home==null||away==null)continue;
                          Game g=new Game();g.id=league+":"+event.optString("id",String.valueOf(i));g.league=leagueName;
                          JSONObject h=home.optJSONObject("team"),a=away.optJSONObject("team");
                          g.home=teamName(h,"Mandante");g.away=teamName(a,"Visitante");
                          g.homeLogo=teamLogo(h);g.awayLogo=teamLogo(a);
                          g.scoreHome=home.optString("score","");g.scoreAway=away.optString("score","");
                          JSONObject status=event.optJSONObject("status");
                          JSONObject type=status==null?null:status.optJSONObject("type");
                          g.state=type==null?"pre":type.optString("state","pre");
                          g.minute=type==null?"":type.optString("shortDetail","");
                          try{g.start=Instant.parse(event.optString("date","")).toEpochMilli();}
                          catch(Exception ex){continue;}
                          JSONArray broadcasts=comp.optJSONArray("broadcasts");
                          if(broadcasts!=null)for(int k=0;k<broadcasts.length();k++){
                              JSONObject broad=broadcasts.optJSONObject(k);if(broad==null)continue;
                              JSONArray names=broad.optJSONArray("names");
                              if(names!=null)for(int n=0;n<names.length();n++){
                                  String name=names.optString(n,"").trim();
                                  if(!name.isEmpty()&&!g.broadcasts.contains(name))g.broadcasts.add(name);
                              }
                          }
                          if(g.broadcasts.isEmpty()){
                              JSONArray geo=comp.optJSONArray("geoBroadcasts");
                              if(geo!=null)for(int k=0;k<geo.length();k++){
                                  JSONObject item=geo.optJSONObject(k),media=item==null?null:item.optJSONObject("media");
                                  String name=media==null?"":media.optString("shortName","").trim();
                                  if(!name.isEmpty()&&!g.broadcasts.contains(name))g.broadcasts.add(name);
                              }
                          }
                          games.add(g);
                      }
                      return games;
                  }finally{c.disconnect();}
              }
              private static String teamName(JSONObject team,String fallback){
                  if(team==null)return fallback;
                  String name=team.optString("displayName","");
                  if(name.isEmpty())name=team.optString("name",fallback);
                  return name;
              }
              private static String teamLogo(JSONObject team){
                  if(team==null)return"";
                  String url=team.optString("logo","");
                  if(!url.isEmpty())return url;
                  JSONArray logos=team.optJSONArray("logos");
                  if(logos!=null&&logos.length()>0){JSONObject first=logos.optJSONObject(0);
                      if(first!=null)return first.optString("href","");}
                  return"";
              }
              private Map<String,ChannelPick> loadChannels(){
                  Map<String,ChannelPick> index=new HashMap<>();
                  SourceRegistry source=new SourceRegistry(this);
                  ArrayList<SourceRegistry.SourceEntry> all=source.all();
                  String selected=source.activeId();
                  Collections.sort(all,(a,b)->Boolean.compare(!a.id.equals(selected),!b.id.equals(selected)));
                  for(SourceRegistry.SourceEntry s:all){
                      if(!s.enabled||"saimo_vod".equals(s.kind))continue;
                      ChannelStore db=null;
                      try{
                          db=new ChannelStore(this,s.id);
                          List<ChannelStore.Channel> channels=db.query("Todos","TV","",5000,0);
                          for(ChannelStore.Channel channel:channels){
                              String k=GameScoreRules.normalizedChannel(channel.name);
                              if(!k.isEmpty()&&!index.containsKey(k))index.put(k,new ChannelPick(s.id,channel));
                          }
                      }catch(Exception ignored){}finally{if(db!=null)db.close();}
                  }
                  return index;
              }
              private ChannelPick compatible(Game g,Map<String,ChannelPick> channels){
                  for(String broadcast:g.broadcasts){
                      if(broadcast.contains("+")||broadcast.toLowerCase(Locale.ROOT).contains("plus"))continue;
                      ChannelPick match=channels.get(GameScoreRules.normalizedChannel(broadcast));
                      if(match!=null)return match;
                  }
                  return null;
              }
