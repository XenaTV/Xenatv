                  }, 1050);
                  // Pulso de brilho discreto: não aplica blur pesado nem toca vídeo.
                  halo.animate().alpha(.48f).setDuration(800).withEndAction(() -> {
                      if (!ending.get()) halo.animate().alpha(.88f).setDuration(500).start();
                  }).start();
              }

              private static final class Aurora extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Aurora(Context context) { super(context); }
                  @Override protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth(), h = getHeight();
                      float radius = Math.max(w, h) * .70f;
                      paint.setShader(new RadialGradient(w * .22f, h * .32f, radius,
                              new int[] { 0xff173a68, 0xff101d44, 0xff070c20 },
                              new float[] { 0f, .43f, 1f }, Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, paint);
                      paint.setShader(new RadialGradient(w * .85f, h * .83f, radius * .64f,
                              new int[] { 0x772f1761, 0x002f1761 }, null, Shader.TileMode.CLAMP));
                      canvas.drawCircle(w * .85f, h * .83f, radius * .64f, paint);
                      paint.setShader(null);
                  }
              }
          }
