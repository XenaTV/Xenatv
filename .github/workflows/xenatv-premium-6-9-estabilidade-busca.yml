                              st.bindString(3,v.label==null?"":v.label);st.bindString(4,v.quality==null?"":v.quality);
                              st.bindString(5,v.referer==null?"":v.referer);st.bindString(6,v.agent==null?"":v.agent);
                              st.bindLong(7,v.drm?1:0);st.executeInsert();
