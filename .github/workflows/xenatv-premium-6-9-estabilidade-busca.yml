              private void reload(){
                  final int request=++revision;
                  status.setText("Lendo canais salvos de todas as fontes ativas...");
                  new Thread(()->{
                      ArrayList<Entry> loaded=new ArrayList<>();
                      int activeLists=0,knownRows=0;
                      ArrayList<SourceRegistry.SourceEntry> sources=new SourceRegistry(this).all();
                      String selected=new SourceRegistry(this).activeId();
                      Collections.sort(sources,(a,b)->Boolean.compare(!a.id.equals(selected),!b.id.equals(selected)));
                      for(SourceRegistry.SourceEntry s:sources){
                          if(!s.enabled||"saimo_vod".equals(s.kind)||s.url==null||s.url.trim().isEmpty())continue;
                          activeLists++;
                          ChannelStore store=null;
                          try{
                              store=new ChannelStore(this,s.id);
                              SQLiteDatabase db=store.getReadableDatabase();
                              // Uma consulta por fonte, sem consulta SQLite extra para cada canal.
                              HashSet<String> favoriteAddresses=new HashSet<>();
                              try(Cursor fav=db.rawQuery("SELECT address FROM favorites",null)){
                                  while(fav.moveToNext())favoriteAddresses.add(fav.getString(0));
                              }
                              // Varredura local, inclusive itens TV classificados incorretamente em versões antigas.
                              // Não usa LIMIT nos 40 mil filmes antes de procurar canais.
                              try(Cursor c=db.rawQuery("SELECT title,address,category,logo,kind FROM channels",null)){
                                  int count=0;
                                  while(c.moveToNext()){
                                      knownRows++;
                                      String url=c.getString(1),kind=c.getString(4);
                                      if(!LiveTvRules.isLive(s.kind,kind,url))continue;
                                      String name=c.getString(0);
                                      if(name==null||name.trim().isEmpty()||url==null||url.trim().isEmpty())continue;
                                      String group=c.getString(2),logo=c.getString(3);
                                      loaded.add(new Entry(s.id,s.name,name,url,
                                              group==null||group.trim().isEmpty()?"Sem categoria":group,logo,
                                              favoriteAddresses.contains(url)));
                                      if(++count>=MAX_FROM_ONE_SOURCE)break;
                                  }
                              }
                          }catch(Exception ex){
                              // Uma lista corrompida não impede a leitura das demais.
                          }finally{if(store!=null)store.close();}
                      }
                      final int scanned=knownRows,totalSources=activeLists;
                      runOnUiThread(()->{
                          if(isFinishing()||request!=revision)return;
                          channels.clear();channels.addAll(loaded);selectedGroup="Todos";shown=PAGE;
                          status.setText(channels.size()+" canais de TV encontrados • "+totalSources+" fontes ativas"+
                                  (channels.isEmpty()?" • "+scanned+" itens examinados":""));
                          renderGroups();renderRows();
                          if(initialPlayPending){
                              initialPlayPending=false;
                              Entry first=chooseStartupChannel();
                              if(first!=null)play(first);
                          }
                      });
                  },"xena-tv-local-scan").start();
