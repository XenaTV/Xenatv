              private void addCardFavorite(FrameLayout cover,ChannelStore.Channel ch,String sourceId){
                  final boolean[] state={ch.favorite};
                  TextView star=text(ch.favorite?"★":"☆",26,ch.favorite?MINT:WHITE,true);
                  star.setGravity(Gravity.CENTER);
                  star.setBackground(shape(0xdd1a1a30,0xff6c658c,24));
                  FrameLayout.LayoutParams pos=new FrameLayout.LayoutParams(dp(46),dp(46),Gravity.TOP|Gravity.RIGHT);
                  pos.rightMargin=dp(5);pos.topMargin=dp(5);
                  cover.addView(star,pos);
                  star.setContentDescription(ch.favorite?"Remover dos favoritos":"Adicionar aos favoritos");
                  star.setOnClickListener(v->{
                      final boolean wanted=!state[0];
                      star.setEnabled(false);
                      ChannelStore.Channel item=ch;
                      new Thread(()->{
                          boolean success=true;
                          ChannelStore db=null;
                          try{
                              db=new ChannelStore(getApplicationContext(),sourceId);
                              db.favorite(item.url,wanted);
                          }catch(Exception err){success=false;}
                          finally{if(db!=null)db.close();}
                          final boolean saved=success;
                          runOnUiThread(()->{
                              if(isFinishing()||isDestroyed())return;
                              if(saved){state[0]=wanted;star.setText(wanted?"★":"☆");
                                  star.setTextColor(wanted?MINT:WHITE);
                                  star.setContentDescription(wanted?"Remover dos favoritos":"Adicionar aos favoritos");}
                              else Toast.makeText(this,"Não foi possível salvar favorito",Toast.LENGTH_SHORT).show();
                              star.setEnabled(true);
                          });
                      },"XenaTV-SalvarFavorito").start();
                  });
              }
