                  final String dateRange=today+"-"+tomorrow;
                  try{
                      for(String league:LEAGUES){
                          tasks.add(pool.submit((Callable<List<Game>>)()->fetchLeague(league,dateRange)));
                      }
                      Set<String> unique=new HashSet<>();
                      for(Future<List<Game>> future:tasks){
                          try{
                              List<Game> data=future.get(16,TimeUnit.SECONDS);
                              result.successful++;
                              for(Game game:data){
                                  String key=GameScoreRules.normalized(game.home)+"-"+GameScoreRules.normalized(game.away)+"-"+game.start;
                                  if(unique.add(key))result.games.add(game);
                              }
                          }catch(Exception ignored){future.cancel(true);}
                      }
                  }finally{pool.shutdownNow();}
                  Collections.sort(result.games,(a,b)->{
                      int pa=GameScoreRules.rank(a.state,a.start,System.currentTimeMillis());
                      int pb=GameScoreRules.rank(b.state,b.start,System.currentTimeMillis());
                      if(pa!=pb)return Integer.compare(pa,pb);
                      return Long.compare(a.start,b.start);
                  });
