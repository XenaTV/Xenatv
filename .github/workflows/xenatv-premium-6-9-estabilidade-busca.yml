                  HashMap<String,Integer> map=new HashMap<>();
                  for(Entry c:channels)map.put(c.group,map.getOrDefault(c.group,0)+1);
                  ArrayList<Map.Entry<String,Integer>> sorted=new ArrayList<>(map.entrySet());
                  Collections.sort(sorted,(a,b)->Integer.compare(b.getValue(),a.getValue()));
                  addChip("Todos",channels.size());
