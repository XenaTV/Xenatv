                  title.setPadding(dp(10),0,0,0);heading.addView(title);
                  body.addView(heading);gap(body,6);
                  body.addView(text("Títulos organizados pelas categorias fornecidas pela sua lista IPTV.",12,MUTED,false));gap(body,14);
                  LinearLayout tabs=row();
                  Button movies=button("🎬 Filmes",MOVIES.equals(kind));
                  Button series=button("📺 Séries",SERIES.equals(kind));
                  LinearLayout.LayoutParams a=new LinearLayout.LayoutParams(0,dp(47),1);
                  LinearLayout.LayoutParams b=new LinearLayout.LayoutParams(0,dp(47),1);b.leftMargin=dp(8);
                  tabs.addView(movies,a);tabs.addView(series,b);
                  movies.setOnClickListener(v->switchPlatformKind(MOVIES));
                  series.setOnClickListener(v->switchPlatformKind(SERIES));
                  body.addView(tabs);gap(body,15);
                  TextView status=text("Procurando "+kind.toLowerCase(Locale.ROOT)+" nas fontes ativas...",12,MUTED,false);
                  body.addView(status);gap(body,10);
                  LinearLayout container=col();body.addView(container);
                  final int token=++platformRevision;
                  new Thread(()->{
                      ArrayList<PlatformResult> result=new ArrayList<>();
                      int sources=0;
                      for(SourceRegistry.SourceEntry src:new SourceRegistry(this).all()){
                          if(!src.enabled||"saimo_channels".equals(src.kind))continue;
                          sources++;
                          ChannelStore db=null;
                          try{
                              db=new ChannelStore(this,src.id);
                              // Apenas metadados reais das categorias: não classificar por título ou poster.
                              for(ChannelStore.Group group:db.platformCategories(kind,brand)){
                                  int cap=Math.min(group.count,210);
                                  if(cap<1)continue;
                                  for(ChannelStore.Channel c:db.query(group.title,kind,"",cap,0)){
                                      result.add(new PlatformResult(src.id,src.name,c));
                                  }
                                  if(result.size()>800)break;
                              }
                          }catch(Exception ignored){}finally{if(db!=null)db.close();}
                          if(result.size()>800)break;
                      }
                      final int countSources=sources;
                      runOnUiThread(()->{
                          if(isFinishing()||isDestroyed()||token!=platformRevision||!brand.equals(platformBrand)||!kind.equals(platformKind))return;
                          status.setText(result.isEmpty()
                              ?"Nenhum "+kind.toLowerCase(Locale.ROOT)+" identificado como "+PlatformShortcutRules.displayName(brand)+" nas suas listas."
                              :result.size()+" títulos encontrados • "+countSources+" fontes verificadas");
                          if(result.isEmpty()){
                              showEmpty(container,"Você pode adicionar uma lista com categorias da plataforma. Sem metadados de origem, a XenaTV não adivinha a plataforma de um filme.");
                          }else renderPlatformResults(container,result,42);
                      });
                  },"XenaTV-PlatformCatalog").start();
              }
              private void renderPlatformResults(LinearLayout area,ArrayList<PlatformResult> results,int amount){
                  area.removeAllViews();
                  int count=Math.min(amount,results.size());
                  int usable=Math.max(290,widthDp()-(sidebar==null?0:185)-32);
                  int cols=Math.max(2,Math.min(6,usable/155));
                  int width=Math.max(110,(usable-(cols-1)*10)/cols);
                  LinearLayout line=null;
                  for(int i=0;i<count;i++){
                      if(i%cols==0){line=row();line.setGravity(Gravity.TOP);area.addView(line,lp(-1,-2));gap(area,10);}
                      PlatformResult item=results.get(i);
                      LinearLayout card=posterCard(item.channel,width,item.sourceId);
                      // O card pertence à sua própria fonte, mesmo quando a fonte principal é outra.
                      card.setOnClickListener(v->openPlatformItem(item));
                      LinearLayout.LayoutParams pos=new LinearLayout.LayoutParams(0,-2,1);
                      if(i%cols!=cols-1)pos.rightMargin=dp(9);
                      line.addView(card,pos);
                  }
                  if(count<results.size()){
                      Button more=button("Mostrar mais títulos",false);area.addView(more,lp(-1,50));
                      more.setOnClickListener(v->renderPlatformResults(area,results,amount+42));
                  }
              }
              private void openPlatformItem(PlatformResult item){
