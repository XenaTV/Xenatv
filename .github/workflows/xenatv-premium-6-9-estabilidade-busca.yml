              public void replaceLiveCatalogue(ArrayList<M3UStreamParser.Channel> items){
                  SQLiteDatabase db=getWritableDatabase();db.beginTransaction();
                  try{
                      db.delete("channels",null,null);
                      db.delete("variants",null,null);
                      SQLiteStatement st=db.compileStatement("INSERT INTO channels(title,address,category,logo,kind) VALUES(?,?,?,?,?)");
                      for(M3UStreamParser.Channel c:items){
                          if(c.url==null||c.url.isEmpty())continue;
                          st.clearBindings();st.bindString(1,c.name==null||c.name.isEmpty()?"Canal sem nome":c.name);
                          st.bindString(2,c.url);st.bindString(3,c.category==null||c.category.trim().isEmpty()?"TV ao vivo":c.category);
                          st.bindString(4,c.logo==null?"":c.logo);st.bindString(5,"TV");st.executeInsert();
