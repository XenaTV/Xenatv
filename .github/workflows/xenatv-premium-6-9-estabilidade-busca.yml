                  }finally{c.disconnect();}
              }
              private static String maybe(String s){return valid(s)?s:"";}
              private static void save(Result result,String name,String category,String logo,ArrayList<ChannelStore.Variant> alternatives){
                  if(clean(name).isEmpty()||alternatives.isEmpty())return;
                  for(M3UStreamParser.Channel old:result.channels){
                      if(norm(old.name).equals(norm(name))){
                          ArrayList<ChannelStore.Variant> prior=result.variants.get(old.url);
                          if(prior==null)prior=new ArrayList<>();
                          for(ChannelStore.Variant v:alternatives){boolean found=false;for(ChannelStore.Variant u:prior)if(u.url.equals(v.url))found=true;if(!found)prior.add(v);}
                          result.variants.put(old.url,prior);return;
                      }
                  }
                  String primary=alternatives.get(0).url;
                  result.channels.add(new M3UStreamParser.Channel(name,primary,category,logo));
                  result.variants.put(primary,new ArrayList<>(alternatives));
              }
              public static Result parseChannels(String text){
                  Result out=new Result();String name="",cat="TV ao vivo",logo="";
                  ArrayList<ChannelStore.Variant> choices=new ArrayList<>();
                  for(String raw:text.split("\\r?\\n")){
                      String line=clean(raw);if(line.isEmpty()||line.startsWith("#"))continue;
                      int pos=line.indexOf(':');if(pos<1)continue;
                      String key=clean(line.substring(0,pos)).toLowerCase(Locale.ROOT),v=clean(line.substring(pos+1));
                      if(key.equals("canal")){
                          save(out,name,cat,logo,choices);name=v;cat="TV ao vivo";logo="";choices=new ArrayList<>();
                      }else if(key.equals("logo"))logo=maybe(v);
                      else if(key.equals("categoria"))cat=v.isEmpty()?"TV ao vivo":v;
                      else if(key.equals("fonte")&&valid(v))choices.add(new ChannelStore.Variant(v,"Fonte "+(choices.size()+1),"","","",false));
                      else if(!choices.isEmpty()){
                          ChannelStore.Variant old=choices.get(choices.size()-1);
                          if(key.equals("nome"))old.label=v;
                          else if(key.equals("qualidade"))old.quality=v;
                          else if(key.equals("referer"))old.referer=v;
                          else if(key.equals("agente"))old.agent=v;
                          else if(key.equals("chave"))old.drm=true; // LibVLC não suporta licença ClearKey configurada desta forma
                      }
