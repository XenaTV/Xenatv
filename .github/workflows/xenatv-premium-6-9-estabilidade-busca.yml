              private static String expand(String token,VodIndex index){
                  token=clean(token);if(valid(token))return token;
                  int pos=token.indexOf(':');if(pos<1)return "";
                  try{
                      String b=index.bases.get(Integer.parseInt(token.substring(0,pos)));
                      if(b==null||!valid(b))return "";
                      String rest=token.substring(pos+1);
                      if(!rest.matches("(?is).*\\.[a-z0-9]{2,5}([?#].*)?$"))rest+=".mp4";
                      return b+rest;
                  }catch(Exception e){return "";}
              }
              private static ArrayList<ChannelStore.Variant> parseVariants(String[] cols,int offset,VodIndex index){
                  ArrayList<ChannelStore.Variant> choices=new ArrayList<>();
                  for(int i=offset;i<cols.length;i++){
