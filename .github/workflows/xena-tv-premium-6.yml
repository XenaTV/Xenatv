                  Button retry=button("↻");retry.setOnClickListener(v->start(current));
                  LinearLayout.LayoutParams rp=lp(44,41);rp.leftMargin=dp(5);controls.addView(retry,rp);
                  Button external=button("VLC");external.setOnClickListener(v->external());
                  LinearLayout.LayoutParams ep=lp(50,41);ep.leftMargin=dp(5);controls.addView(external,ep);
                  screen.addView(controls,atTopRight(202,51,8,8));
          
                  state=text("Conectando...",12,WHITE,false);state.setPadding(dp(12),dp(8),dp(12),dp(8));
                  state.setBackground(shape(0xce150f23,8));
                  FrameLayout.LayoutParams sp=new FrameLayout.LayoutParams(-2,-2,Gravity.BOTTOM|Gravity.RIGHT);
                  sp.bottomMargin=dp(14);sp.rightMargin=dp(12);screen.addView(state,sp);
          
                  showGuide=button("☰ Canais");showGuide.setBackground(shape(0xdf1d2b3e,14));
                  FrameLayout.LayoutParams gp=new FrameLayout.LayoutParams(dp(110),dp(49),Gravity.TOP|Gravity.LEFT);
                  gp.leftMargin=dp(10);gp.topMargin=dp(10);screen.addView(showGuide,gp);
                  showGuide.setOnClickListener(v->setGuide(true));
          
                  side=col();side.setPadding(dp(12),dp(12),dp(12),dp(12));
                  side.setBackground(shape(PANEL,18));side.setElevation(dp(12));
                  FrameLayout.LayoutParams sideParams=new FrameLayout.LayoutParams(guideWidth(),-1,Gravity.TOP|Gravity.LEFT);
                  screen.addView(side,sideParams);
                  LinearLayout bar=row();
                  Button close=button("✕");close.setOnClickListener(v->setGuide(false));bar.addView(close,lp(43,42));
                  TextView h=text("  "+("TV".equals(kind)?"GUIA DE CANAIS":kind.toUpperCase(Locale.ROOT)),16,WHITE,true);
                  h.setSingleLine(true);bar.addView(h,new LinearLayout.LayoutParams(0,-2,1));side.addView(bar);
          
                  LinearLayout onNow=row();onNow.setPadding(dp(4),dp(8),dp(4),dp(8));
                  currentLogo=new ImageView(this);onNow.addView(currentLogo,lp(43,42));
                  currentTitle=text("",14,GREEN,true);currentTitle.setMaxLines(2);currentTitle.setPadding(dp(9),0,0,0);
                  onNow.addView(currentTitle,new LinearLayout.LayoutParams(0,-2,1));
                  side.addView(onNow);
          
                  EditText search=new EditText(this);search.setSingleLine(true);search.setTextColor(WHITE);
                  search.setTextSize(13);search.setHintTextColor(SECONDARY);search.setHint("⌕  Pesquisar canais");
                  search.setPadding(dp(10),dp(5),dp(10),dp(5));search.setBackground(shape(PANEL2,10));
                  side.addView(search,lp(-1,42));
                  search.addTextChangedListener(new TextWatcher(){
                      public void beforeTextChanged(CharSequence s,int a,int c,int f){}
                      public void onTextChanged(CharSequence s,int st,int before,int count){filter=s.toString();showCount=BATCH;renderChannels();}
                      public void afterTextChanged(Editable e){}
                  });
                  HorizontalScrollView slider=new HorizontalScrollView(this);slider.setHorizontalScrollBarEnabled(false);
                  categories=row();slider.addView(categories);side.addView(slider,lp(-1,44));
                  ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);
                  channelRows=col();scroll.addView(channelRows);side.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                  if("TV".equals(kind)){
                      renderCategories();renderChannels();setGuide(true);
                  }else{
                      // Filmes e episódios usam o vídeo inteiro; o guia lateral é exclusivo da TV ao vivo.
                      open=false;side.setVisibility(View.GONE);showGuide.setVisibility(View.GONE);
                  }
              }
              private int guideWidth(){
                  int screenW=getResources().getDisplayMetrics().widthPixels;
                  return Math.min(dp(390),Math.max(dp(228),Math.round(screenW*.38f)));
              }
              private void resizeGuide(){if(side!=null){FrameLayout.LayoutParams p=(FrameLayout.LayoutParams)side.getLayoutParams();p.width=guideWidth();side.setLayoutParams(p);}}
              private void setGuide(boolean visible){
                  open=visible;
                  if(side==null)return;
                  side.animate().cancel();
                  if(visible){
                      side.setVisibility(View.VISIBLE);
                      side.setAlpha(0f);side.setTranslationX(-guideWidth()*0.35f);
                      side.animate().alpha(1f).translationX(0f).setDuration(240)
                          .setInterpolator(new android.view.animation.DecelerateInterpolator(1.5f)).start();
                      if(showGuide!=null)showGuide.setVisibility(View.GONE);
                  }else{
                      side.animate().alpha(0f).translationX(-guideWidth()*0.30f).setDuration(185)
                          .withEndAction(()->{if(!open){side.setVisibility(View.GONE);side.setTranslationX(0f);}}).start();
                      if(showGuide!=null){showGuide.setVisibility(View.VISIBLE);showGuide.setAlpha(0f);
                          showGuide.animate().alpha(1f).setDuration(190).start();}
                  }
              }
              private void renderCategories(){
                  if(categories==null)return;categories.removeAllViews();
                  addCategory("Todos");addCategory("Recentes");addCategory("Favoritos");
                  for(ChannelStore.Group g:store.categories(kind))addCategory(g.title);
              }
              private void addCategory(String label){
                  Button b=button(label);if(label.equals(group))b.setTextColor(GREEN);
                  LinearLayout.LayoutParams p=lp(-2,36);p.rightMargin=dp(5);categories.addView(b,p);
                  b.setOnClickListener(v->{group=label;showCount=BATCH;renderCategories();renderChannels();});
              }
              private void renderChannels(){
                  if(channelRows==null||store==null)return;channelRows.removeAllViews();
                  List<ChannelStore.Channel> rows=store.query(group,kind,filter,showCount+1,0);
                  int count=Math.min(showCount,rows.size());
                  for(int i=0;i<count;i++){
                      ChannelStore.Channel item=rows.get(i);
                      LinearLayout line=row();line.setPadding(dp(5),dp(7),dp(5),dp(7));
                      if(current!=null&&item.url.equals(current.url))line.setBackground(shape(HIGHLIGHT,9));
                      TextView number=text(String.valueOf(i+1),11,SECONDARY,false);
                      number.setGravity(Gravity.CENTER);line.addView(number,lp(24,42));
                      FrameLayout logo=new FrameLayout(this);logo.setBackground(shape(PANEL2,7));
                      TextView fallback=text("▣",19,GREEN,true);fallback.setGravity(Gravity.CENTER);
                      logo.addView(fallback,new FrameLayout.LayoutParams(-1,-1));
                      ImageView image=new ImageView(this);logo.addView(image,new FrameLayout.LayoutParams(-1,-1));
                      ChannelArtwork.bind(image,item.logo,!"TV".equals(item.type));
                      line.addView(logo,lp(45,46));
                      LinearLayout names=col();names.setPadding(dp(9),0,0,0);
                      TextView label=text(item.name,13,WHITE,true);label.setMaxLines(2);names.addView(label);
                      TextView cat=text(item.category,10,SECONDARY,false);cat.setMaxLines(1);names.addView(cat);
                      line.addView(names,new LinearLayout.LayoutParams(0,-2,1));
                      line.setOnClickListener(v->{start(item);setGuide(false);});
                      LinearLayout.LayoutParams p=lp(-1,-2);p.bottomMargin=dp(4);channelRows.addView(line,p);
                  }
                  if(rows.size()>count){Button more=button("Mostrar mais canais");
                      more.setOnClickListener(v->{showCount+=BATCH;renderChannels();});channelRows.addView(more,lp(-1,44));}
                  if(count==0){TextView empty=text("Nenhum item nesta categoria.",12,SECONDARY,false);channelRows.addView(empty);}
              }
              private void start(ChannelStore.Channel item){
                  if(item==null)return;
                  current=item;store.seen(item.url);
                  if(currentTitle!=null)currentTitle.setText(item.name);
                  if(currentLogo!=null)ChannelArtwork.bind(currentLogo,item.logo,!"TV".equals(item.type));
                  if(state!=null){state.setVisibility(View.VISIBLE);state.setText("Conectando: "+item.name);}
                  if(channelRows!=null)renderChannels();
                  try{
                      stopVideo();
                      if(engine==null){ArrayList<String> opts=new ArrayList<>();opts.add("--network-caching=2000");
                          opts.add("--http-reconnect");engine=new LibVLC(this,opts);}
                      player=new MediaPlayer(engine);player.attachViews(videoSurface,null,false,false);
                      final MediaPlayer currentPlayer=player;
                      currentPlayer.setEventListener(event->runOnUiThread(()->{
                          if(player!=currentPlayer||isFinishing())return;
                          if(event.type==MediaPlayer.Event.Opening)message("Abrindo transmissão...");
                          else if(event.type==MediaPlayer.Event.Buffering)message("Carregando sinal...");
                          else if(event.type==MediaPlayer.Event.Playing)message("● Reproduzindo: "+item.name);
                          else if(event.type==MediaPlayer.Event.EncounteredError)message("Falha no sinal. Use ↻ ou VLC.");
                          else if(event.type==MediaPlayer.Event.EndReached)message("Transmissão encerrada.");
                      }));
                      Media m=new Media(engine,Uri.parse(item.url));
                      m.addOption(":network-caching=2000");m.addOption(":http-reconnect=true");
                      m.addOption(":http-user-agent=VLC/3.0.21 LibVLC/3.0.21");
                      if(item.url.startsWith("rtsp://"))m.addOption(":rtsp-tcp");
                      currentPlayer.setMedia(m);m.release();currentPlayer.play();
                  }catch(Exception e){message("Não foi possível iniciar o player. Tente novamente.");}
              }
              private void message(String text){if(state!=null){state.setText(text);state.setVisibility(View.VISIBLE);}}
              private void external(){
                  try{Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(Uri.parse(current.url),"video/*");
                      i.setPackage("org.videolan.vlc");startActivity(i);
                  }catch(Exception e){Toast.makeText(this,"VLC não encontrado no aparelho.",Toast.LENGTH_SHORT).show();}
              }
              private void stopVideo(){
                  if(player!=null){try{player.stop();if(player.getVLCVout().areViewsAttached())player.detachViews();}
                      catch(Exception ignored){}player.release();player=null;}
              }
              @Override public void onBackPressed(){if(open){setGuide(false);return;}finish();}
              @Override protected void onStop(){super.onStop();stopVideo();}
              @Override protected void onRestart(){super.onRestart();if(current!=null&&videoSurface!=null)start(current);}
              @Override protected void onDestroy(){stopVideo();if(engine!=null){engine.release();engine=null;}
                  if(store!=null)store.close();super.onDestroy();}
          }
