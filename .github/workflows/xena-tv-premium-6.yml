          /** Catálogo privado do aparelho. A lista continua visível mesmo se o servidor ficar temporariamente fora. */
          public final class ChannelStore extends SQLiteOpenHelper {
              public static final class Channel {
                  public final long id;
                  public final String name,url,category,logo,type;
                  public final boolean favorite;
                  Channel(long i,String n,String u,String c,String l,String t,boolean f){
                      id=i;name=n;url=u;category=c;logo=l;type=t;favorite=f;
                  }
              }
              public static final class Group {
                  public final String title;
                  public final int count;
                  Group(String name,int n){title=name;count=n;}
              }
              public ChannelStore(Context context){super(context,"xena_my_catalog_v1.db",null,1);}
              @Override public void onCreate(SQLiteDatabase db){
                  db.execSQL("CREATE TABLE channels (_id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, address TEXT NOT NULL, category TEXT NOT NULL, logo TEXT NOT NULL, kind TEXT NOT NULL)");
                  db.execSQL("CREATE INDEX idx_category ON channels(category)");
                  db.execSQL("CREATE INDEX idx_kind ON channels(kind)");
                  db.execSQL("CREATE TABLE favorites (address TEXT PRIMARY KEY)");
                  db.execSQL("CREATE TABLE recents (address TEXT PRIMARY KEY, seen INTEGER NOT NULL)");
              }
              @Override public void onUpgrade(SQLiteDatabase db,int oldVersion,int newVersion){}
              public void replace(ArrayList<M3UStreamParser.Channel> items){
                  SQLiteDatabase db=getWritableDatabase();
                  db.beginTransaction();
                  try {
                      db.delete("channels",null,null);
                      SQLiteStatement st=db.compileStatement("INSERT INTO channels(title,address,category,logo,kind) VALUES(?,?,?,?,?)");
                      for(M3UStreamParser.Channel c:items){
                          if(c.url==null||c.url.isEmpty())continue;
                          st.clearBindings();
                          String cat=c.category==null||c.category.trim().isEmpty()?"Sem categoria":c.category.trim();
                          String kind=(cat.toLowerCase(Locale.ROOT).contains("filme")||cat.toLowerCase(Locale.ROOT).contains("movie")||c.url.contains("/movie/"))?"Filmes":
                              (cat.toLowerCase(Locale.ROOT).contains("série")||cat.toLowerCase(Locale.ROOT).contains("serie")||c.url.contains("/series/"))?"Séries":"TV";
                          st.bindString(1,c.name==null||c.name.isEmpty()?"Canal sem nome":c.name);
                          st.bindString(2,c.url);st.bindString(3,cat);
                          st.bindString(4,c.logo==null?"":c.logo);st.bindString(5,kind);
                          st.executeInsert();
                      }
                      st.close();db.setTransactionSuccessful();
                  } finally {db.endTransaction();}
              }
              /** Atualiza SOMENTE as capas/entradas de séries Xtream; não modifica TV e filmes. */
              public void mergeSeries(ArrayList<M3UStreamParser.Channel> list){
                  SQLiteDatabase db=getWritableDatabase();db.beginTransaction();
                  try{
                      db.delete("channels","address LIKE ?",new String[]{"xena-series://%"});
                      SQLiteStatement st=db.compileStatement("INSERT INTO channels(title,address,category,logo,kind) VALUES(?,?,?,?,?)");
                      for(M3UStreamParser.Channel c:list){
                          if(c.url==null||!c.url.startsWith("xena-series://"))continue;
                          st.clearBindings();st.bindString(1,c.name);st.bindString(2,c.url);
                          st.bindString(3,c.category);st.bindString(4,c.logo==null?"":c.logo);
                          st.bindString(5,"Séries");st.executeInsert();
                      }
                      st.close();db.setTransactionSuccessful();
                  }finally{db.endTransaction();}
              }
              public int count(){try(Cursor c=getReadableDatabase().rawQuery("SELECT count(*) FROM channels",null)){return c.moveToFirst()?c.getInt(0):0;}}
              public int typeCount(String type){
                  if(type.equals("Todos"))return count();
                  try(Cursor c=getReadableDatabase().rawQuery("SELECT count(*) FROM channels WHERE kind=?",new String[]{type})){
                      return c.moveToFirst()?c.getInt(0):0;
                  }
              }
              public List<Group> categories(String type){
                  ArrayList<Group> result=new ArrayList<>();
                  String sql="SELECT category,count(*) FROM channels"+(type.equals("Todos")?"":" WHERE kind=?")+" GROUP BY category ORDER BY count(*) DESC, category LIMIT 250";
                  try(Cursor c=getReadableDatabase().rawQuery(sql,type.equals("Todos")?null:new String[]{type})){
                      while(c.moveToNext())result.add(new Group(c.getString(0),c.getInt(1)));
                  }
                  return result;
              }
              public List<Channel> query(String group,String kind,String search,int limit,int offset){
                  ArrayList<String> values=new ArrayList<>();
                  StringBuilder where=new StringBuilder(" WHERE 1=1");
                  if(kind!=null&&!kind.equals("Todos")){where.append(" AND kind=?");values.add(kind);}
                  if(group!=null&&group.equals("Favoritos"))where.append(" AND EXISTS (SELECT 1 FROM favorites f WHERE f.address=c.address)");
                  else if(group!=null&&group.equals("Recentes"))where.append(" AND EXISTS (SELECT 1 FROM recents r WHERE r.address=c.address)");
                  else if(group!=null&&!group.equals("Todos")){where.append(" AND category=?");values.add(group);}
                  if(search!=null&&!search.trim().isEmpty()){
                      where.append(" AND (title LIKE ? ESCAPE '!' OR category LIKE ? ESCAPE '!')");
                      String term="%"+search.trim().replace("!","!!").replace("%","!%").replace("_","!_")+"%";
                      values.add(term);values.add(term);
                  }
                  values.add(String.valueOf(limit));values.add(String.valueOf(offset));
                  String sort=group!=null&&group.equals("Recentes")?" ORDER BY (SELECT seen FROM recents WHERE address=c.address) DESC, c._id":" ORDER BY c._id";
                  String sql="SELECT c._id,c.title,c.address,c.category,c.logo,c.kind,"+
                      "EXISTS(SELECT 1 FROM favorites f WHERE f.address=c.address) FROM channels c"+
                      where+sort+" LIMIT ? OFFSET ?";
                  ArrayList<Channel> items=new ArrayList<>();
                  try(Cursor c=getReadableDatabase().rawQuery(sql,values.toArray(new String[0]))){
                      while(c.moveToNext())items.add(new Channel(c.getLong(0),c.getString(1),c.getString(2),c.getString(3),c.getString(4),c.getString(5),c.getInt(6)!=0));
                  }
                  return items;
              }
              public void favorite(String address,boolean enabled){
                  SQLiteDatabase db=getWritableDatabase();
                  if(enabled){SQLiteStatement st=db.compileStatement("INSERT OR IGNORE INTO favorites(address) VALUES(?)");st.bindString(1,address);st.executeInsert();st.close();}
                  else db.delete("favorites","address=?",new String[]{address});
              }
