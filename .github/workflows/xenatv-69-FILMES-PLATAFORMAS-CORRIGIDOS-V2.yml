          base=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app')
          live=(base/'LiveTvActivity.java').read_text()
          main=(base/'MainActivity.java').read_text()
          assert 'star.setRotation(180f)' in live and 'star.setRotation(180f)' in main
          assert '0xffb91635' in live and '0xffb91635' in main
          assert 'STROKE=0xffb641f5' in live
          print('VALIDADO: favoritos invertidos e vermelho-sangue, neon na TV')
          PYCHECK

      - name: Corrigir barras, fundo e troca de canal em tela dividida
        shell: bash
        run: |
          set -euo pipefail
          cat > patch_controles_precisos.py <<'XENA_CONTROLES_PATCH'
          #!/usr/bin/env python3
          """XenaTV 6.9: toque fora do video alterna barras; dentro seleciona audio;
          ' Canais' substitui apenas video ativo. Aplicar depois de gestos + favoritos.
          """
          from pathlib import Path
          p=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/FullScreenPlayerActivity.java')
          s=p.read_text(encoding='utf-8')
          def replace_one(old,new,label):
           global s
           n=s.count(old)
           if n!=1: raise RuntimeError(f'{label}: esperado 1 trecho, encontrei {n}')
           s=s.replace(old,new,1)
          replace_one('''    private void showChrome(){''','''    private void toggleChrome(){
                  if(open)return; // Guia aberto: nenhum toque deve fechar os controles inesperadamente.
                  boolean showing=(controls!=null&&controls.getVisibility()==View.VISIBLE&&controls.getAlpha()>0.5f)
                      ||(playerBar!=null&&playerBar.getVisibility()==View.VISIBLE&&playerBar.getAlpha()>0.5f);
                  screen.removeCallbacks(hideChrome);
                  if(showing)hideChrome.run();else showChrome();
              }
              private void showChrome(){''','alternar controles')
          replace_one('''                if(splitEnabled){
                              // Tela global sobre o LibVLC recebe o toque: escolhe áudio IMEDIATAMENTE.
                              selectAudioPane(x<v.getWidth()*0.5f?1:2);
                              lastTapAt=0;return true;
                          }''','''                if(splitEnabled){
                              // Imagem central: audio/tela ativa. Fundo galactico: exibir/ocultar barras.
                              // Dois videos 16:9 lado a lado; nao confundir o fundo com video.
                              float videoBand=Math.min(v.getHeight(),v.getWidth()*9f/32f);
                              float top=(v.getHeight()-videoBand)*0.5f;
                              float margin=dp(12);
                              if(event.getY()<top-margin || event.getY()>top+videoBand+margin){
                                  toggleChrome();
                              }else{
                                  selectAudioPane(x<v.getWidth()*0.5f?1:2);
                              }
                              lastTapAt=0;return true;
                          }''','distinguindo video e fundo')
          replace_one('''                }else{lastTapAt=now;lastTapX=x;showChrome();}''','''                }else{lastTapAt=now;lastTapX=x;toggleChrome();}''','alternar toque simples')
          replace_one('''        if(selectingSecond){selectingSecond=false;playSecond(item);setGuide(false);return;}
                  current=item;''','''        if(selectingSecond){selectingSecond=false;playSecond(item);setGuide(false);return;}
                  // Na Tela Dividida, a escolha do guia muda SOMENTE a tela selecionada.
                  if(splitEnabled && audiblePane==2){
                      playSecond(item);
                      setGuide(false);
                      return;
                  }
                  current=item;''','troca de canal na tela ativa')
          # prevent phantom overlays of gesture hints and excessive bars on player start
          p.write_text(s,encoding='utf-8')
          for key in ('toggleChrome()', 'if(splitEnabled && audiblePane==2)', 'float videoBand=', 'selectAudioPane(x<v.getWidth()*0.5f?1:2)'):
           assert key in s,key
          print('OK: fundo alterna TODAS as barras; toque no video seleciona audio; lista troca tela ativa; gestos preservados.')
          XENA_CONTROLES_PATCH
          python3 -m py_compile patch_controles_precisos.py
          python3 patch_controles_precisos.py
          python3 - <<'PYVERIFY'
          from pathlib import Path
          s=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/FullScreenPlayerActivity.java').read_text()
          for key in ('private void toggleChrome()', 'float videoBand=', 'if(splitEnabled && audiblePane==2)', 'rightAudioBadge.setVisibility(View.GONE)', 'leftAudioBadge.setVisibility(View.GONE)', 'attrs.screenBrightness=brightness', 'showGesture("♫ Volume'):
              assert key in s, f'Recurso não aplicado: {key}'
          assert s.count('{')==s.count('}'), 'Java com chaves desbalanceadas'
          print('CONTROLES: toque em fundo alterna barras; video seleciona audio; canal troca apenas na metade ativa')
          PYVERIFY

