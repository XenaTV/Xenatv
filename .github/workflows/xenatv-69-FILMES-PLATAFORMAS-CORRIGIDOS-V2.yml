      - name: Aplicar nosso brilho e favoritos invertidos vermelho-sangue
        shell: bash
        run: |
          set -euo pipefail
          cat > patch_xena_neon_favoritos.py <<'XENA_NEON_FAV_PATCH'
          #!/usr/bin/env python3
          """Tema XenaTV neon para TV ao Vivo e estrela invertida vermelho-sangue."""
          from pathlib import Path
          base=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app')
          def exact(s,old,new,tag):
           n=s.count(old)
           if n!=1:raise RuntimeError(f'{tag}: esperado 1, encontrou {n}')
           return s.replace(old,new,1)
          
          p=base/'LiveTvActivity.java';s=p.read_text()
          s=exact(s,'private static final int BG=0xff0b0b1c, PANEL=0xff1a2038, WHITE=0xfff3f6fb,','private static final int BG=0xff0b061a, PANEL=0xff170e30, WHITE=0xfff3f6fb,','cores TV')
          s=exact(s,'MUTED=0xffa9b4c8, MINT=0xffa8e6d0, STROKE=0xff4b5474;','MUTED=0xffc8bbdb, MINT=0xff49ff91, STROKE=0xffb641f5;\n    private static final int BLOOD=0xffb91635;','cores neon TV')
          s=exact(s,'private GradientDrawable panel(int color,int radius){GradientDrawable d=new GradientDrawable();d.setColor(color);d.setCornerRadius(dp(radius));d.setStroke(dp(1),STROKE);return d;}','''private GradientDrawable panel(int color,int radius){
                  GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{color,0xff241046,0xff091d2a});
                  d.setCornerRadius(dp(radius));d.setStroke(dp(1),STROKE);return d;
              }
              private void neon(android.view.View v,boolean selected){
                  v.setElevation(dp(selected?9:4));
              }
              private void favoriteAppearance(Button star,boolean saved){
                  star.setRotation(180f); // Sempre de ponta-cabeça, inclusive desligada.
                  star.setTextColor(saved?BLOOD:WHITE);
                  GradientDrawable glow=new GradientDrawable();
                  glow.setColor(saved?0xff390918:0xff190d32);
                  glow.setCornerRadius(dp(14));
                  glow.setStroke(dp(saved?2:1),saved?0xffe22d4a:0xffa243e3);
                  star.setBackground(glow);
                  star.setElevation(dp(saved?10:4));
              }''','tema e helper TV')
          s=exact(s,'if(group.equals(selectedGroup)){b.setBackground(panel(0xff352d5a,12));b.setTextColor(MINT);}','if(group.equals(selectedGroup)){b.setBackground(panel(0xff132d24,12));b.setTextColor(MINT);neon(b,true);}else neon(b,false);','chip TV')
          s=exact(s,'line.setMinimumHeight(dp(78));line.setBackground(panel(PANEL,13));','line.setMinimumHeight(dp(78));line.setBackground(panel(PANEL,13));neon(line,false);','linhas TV')
          s=exact(s,'star.setTextSize(25);star.setTextColor(c.favorite?MINT:WHITE);','star.setTextSize(25);favoriteAppearance(star,c.favorite);','favoritos TV init')
          s=exact(s,'star.setTextColor(wanted?MINT:WHITE);','favoriteAppearance(star,wanted);','favoritos TV toggle')
          p.write_text(s)
          
          p=base/'MainActivity.java';s=p.read_text()
          s=exact(s,'TextView star=text(ch.favorite?"★":"☆",26,ch.favorite?MINT:WHITE,true);','TextView star=text(ch.favorite?"★":"☆",26,ch.favorite?0xffb91635:WHITE,true);\n        star.setRotation(180f);','main estrela invertida')
          s=exact(s,'star.setBackground(shape(0xdd1a1a30,0xff6c658c,24));','star.setBackground(shape(ch.favorite?0xff390918:0xdd1a1a30,ch.favorite?0xffe22d4a:0xffa243e3,24));','main fundo estrela')
          s=exact(s,'star.setTextColor(wanted?MINT:WHITE);','star.setTextColor(wanted?0xffb91635:WHITE);\n                        star.setBackground(shape(wanted?0xff390918:0xdd1a1a30,wanted?0xffe22d4a:0xffa243e3,24));','main toggle estrela')
          p.write_text(s)
          print('OK: estrela invertida e vermelho-sangue em TV ao Vivo, cartões e favoritos principais; brilho TV')
          XENA_NEON_FAV_PATCH
          python3 -m py_compile patch_xena_neon_favoritos.py
          python3 patch_xena_neon_favoritos.py
          python3 - <<'PYCHECK'
