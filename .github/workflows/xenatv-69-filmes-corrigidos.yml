name: XenaTV 6.9 - Filmes por Plataforma Corrigidos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xenatv-69-filmes-corrigidos.yml'
      - 'patch_filmes_69.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restaurar projeto cosmico 6.9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRESTORE'
          import base64,lzma,pathlib,re
          content=pathlib.Path('.github/workflows/xenatv-premium-6-9-revisao-cosmica-pipoou-compacta.yml').read_text()
          m=re.search(r'payload = """\s*(.*?)\s*"""',content,re.S)
          if not m: raise RuntimeError('Payload nao encontrado')
          pathlib.Path('xena-build-step.sh').write_bytes(lzma.decompress(base64.b85decode(''.join(m.group(1).split()))))
          PYRESTORE
          python3 patch_filmes_69.py
          bash xena-build-step.sh
      - name: Compilar APK
        working-directory: xena-premium/XenaTV_Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: XenaTV-6-9-FILMES-PLATAFORMAS-APK
          path: xena-premium/XenaTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
