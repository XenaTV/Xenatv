              private static Account account(String source) throws IOException {
                  try {
                      URI uri=new URI(source);
                      if(!"http".equalsIgnoreCase(uri.getScheme())&&!"https".equalsIgnoreCase(uri.getScheme())) throw new IOException("Link HTTP(S) necessário.");
                      String path=uri.getPath()==null?"":uri.getPath();
                      // A credencial deve vir do link informado pelo usuário, nunca do código/servidor GitHub.
                      if(!path.toLowerCase(Locale.ROOT).endsWith("get.php"))throw new IOException("Endereço não é do tipo get.php com usuário e senha.");
                      Account a=new Account();
                      String folder=path.substring(0,path.lastIndexOf('/')+1);
                      a.base=uri.getScheme()+"://"+uri.getRawAuthority()+folder;
                      Map<String,String> query=new HashMap<>();
                      if(uri.getRawQuery()!=null)for(String field:uri.getRawQuery().split("&")){
                          String[] part=field.split("=",2);
                          if(part.length==2)query.put(URLDecoder.decode(part[0],"UTF-8").toLowerCase(Locale.ROOT),URLDecoder.decode(part[1],"UTF-8"));
                      }
                      a.user=query.get("username");a.password=query.get("password");
                      if(a.user==null||a.password==null||a.user.isEmpty()||a.password.isEmpty())throw new IOException("O link não contém username e password.");
                      a.params="username="+URLEncoder.encode(a.user,"UTF-8")+"&password="+URLEncoder.encode(a.password,"UTF-8");
                      return a;
                  } catch(IOException ex){throw ex;}catch(Exception ex){throw new IOException("O endereço da conta IPTV é inválido.");}
              }
              private static String api(Account a,String action){return a.base+"player_api.php?"+a.params+(action.isEmpty()?"":"&action="+action);}
              private static String request(String target) throws IOException {
                  HttpURLConnection connection=null;
                  try {
                      connection=(HttpURLConnection)new URL(target).openConnection();
                      connection.setInstanceFollowRedirects(true);
                      connection.setConnectTimeout(15000);connection.setReadTimeout(35000);
                      connection.setRequestProperty("User-Agent","VLC/3.0.21 LibVLC/3.0.21");
                      connection.setRequestProperty("Accept","application/json, */*");
                      connection.setRequestProperty("Accept-Encoding","gzip");
                      int code=connection.getResponseCode();
                      if(code<200||code>=300)throw new IOException("API IPTV: servidor respondeu HTTP "+code);
                      try(InputStream raw=connection.getInputStream()) {
                          InputStream in=raw;
                          String enc=connection.getContentEncoding();
                          if(enc!=null&&enc.toLowerCase(Locale.ROOT).contains("gzip"))in=new GZIPInputStream(raw);
                          try(BufferedInputStream input=new BufferedInputStream(in,32768);
                              ByteArrayOutputStream data=new ByteArrayOutputStream()) {
                              byte[] chunk=new byte[16384];int n,bytes=0;
                              while((n=input.read(chunk))!=-1) {
                                  bytes+=n;if(bytes>50*1024*1024)throw new IOException("Catálogo JSON acima de 50 MB.");
                                  data.write(chunk,0,n);
