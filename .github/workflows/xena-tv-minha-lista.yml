name: Xena TV - Minha Lista IPTV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xena-tv-minha-lista.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar codigo Xena TV Minha Lista
        shell: bash
        run: |
          set -euo pipefail
          test -f XenaTV_Android_LibVLC_Teste1.zip
          mkdir -p build-xena
          unzip -q XenaTV_Android_LibVLC_Teste1.zip -d build-xena
          test -f build-xena/XenaTV_Android/app/build.gradle
          mkdir -p build-xena/XenaTV_Android/app/src/main/java/br/com/xenatv/app
          cat > build-xena/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java <<'XENA_MAINACTIVITY_JAVA'
          package br.com.xenatv.app;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;
          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          
          /** Xena TV — apenas fontes próprias: importar, listar, categorizar e reproduzir no LibVLC. */
          public class MainActivity extends Activity {
              private static final int BG=0xff0e0a17, PANEL=0xff1d152c, PANEL2=0xff2b2040;
              private static final int WHITE=0xfff7f4ff, GRAY=0xffb6abc8, PURPLE=0xffb17eff, GREEN=0xff40ffaa;
              private static final int PAGE=65, SELECT_FILE=441;
              private ChannelStore store;
              private SharedPreferences prefs;
              private LinearLayout categoryList, channelList, base;
              private TextView totalText, statusText, listTitle;
              private EditText searchInput;
              private String selectedGroup="Todos", selectedType="Todos", search="";
              private int displayed=PAGE, loadVersion=0;
              private boolean loading=false, playerVisible=false;
              private LibVLC libVlc;
              private MediaPlayer player;
              private ChannelStore.Channel watching;
          
              @Override public void onCreate(Bundle saved){
                  super.onCreate(saved);
                  getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);
                  store=new ChannelStore(this);
                  prefs=getSharedPreferences("xena_minha_lista_v1",Context.MODE_PRIVATE);
                  if(prefs.getString("url","").isEmpty()) migrateOldUrl();
                  drawHome();
                  if(store.count()==0&&!prefs.getString("url","").isEmpty())updateList();
              }
              private void migrateOldUrl(){
                  try{
                      JSONArray saved=new JSONArray(getSharedPreferences("xena_iptv_private_v1",Context.MODE_PRIVATE).getString("sources","[]"));
                      for(int i=0;i<saved.length();i++){
                          JSONObject item=saved.optJSONObject(i);if(item==null)continue;
                          String url=item.optString("url","");
                          if((url.startsWith("https://")||url.startsWith("http://"))&&!"direto".equals(item.optString("mode","lista"))){
                              prefs.edit().putString("url",url).putString("name",item.optString("name","Minha IPTV")).apply();break;
                          }
                      }
                  }catch(Exception ignored){}
              }
              private int dp(float n){return (int)(n*getResources().getDisplayMetrics().density+0.5f);}
              private LinearLayout col(){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);return c;}
              private LinearLayout row(){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.HORIZONTAL);c.setGravity(Gravity.CENTER_VERTICAL);return c;}
              private LinearLayout.LayoutParams lp(int w,int h){return new LinearLayout.LayoutParams(w<0?w:dp(w),h<0?h:dp(h));}
              private void gap(LinearLayout l,int h){l.addView(new View(this),lp(1,h));}
              private GradientDrawable shape(int color,int border,int radius){
                  GradientDrawable d=new GradientDrawable();d.setColor(color);d.setCornerRadius(dp(radius));
                  if(border!=0)d.setStroke(dp(1),border);return d;
              }
              private TextView text(String str,int size,int color,boolean bold){
                  TextView v=new TextView(this);v.setText(str);v.setTextSize(size);v.setTextColor(color);
                  if(bold)v.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return v;
              }
              private Button button(String title,boolean primary){
                  Button b=new Button(this);b.setAllCaps(false);b.setText(title);b.setTextSize(13);
                  b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);b.setTextColor(primary?BG:WHITE);
                  b.setPadding(dp(8),0,dp(8),0);b.setBackground(shape(primary?GREEN:PANEL2,primary?0:0xff523577,12));return b;
              }
              private boolean landscape(){
                  int dpWidth=(int)(getResources().getDisplayMetrics().widthPixels/getResources().getDisplayMetrics().density);
                  return dpWidth>=560; // Telas estreitas usam categorias horizontais; evita esmagar nomes no Fold fechado.
              }
              private void drawHome(){
                  playerVisible=false;
                  ScrollView page=new ScrollView(this);page.setFillViewport(true);page.setBackgroundColor(BG);
                  base=col();base.setPadding(dp(12),dp(15),dp(12),dp(16));page.addView(base);
                  if(android.os.Build.VERSION.SDK_INT>=35){
                      page.setOnApplyWindowInsetsListener((view,insets)->{
                          base.setPadding(dp(12),insets.getSystemWindowInsetTop()+dp(15),dp(12),insets.getSystemWindowInsetBottom()+dp(16));
                          return insets;
                      });
                  }
                  setContentView(page);
                  LinearLayout header=row();
                  TextView brand=text("XENA TV",25,WHITE,true);header.addView(brand,new LinearLayout.LayoutParams(0,-2,1));
                  TextView indicator=text("● MINHA LISTA",11,GREEN,true);header.addView(indicator);base.addView(header);gap(base,6);
                  listTitle=text(prefs.getString("name","Minha IPTV"),16,PURPLE,true);base.addView(listTitle);gap(base,9);
                  LinearLayout buttons=row();
                  Button link=button("✎ Adicionar / editar lista",true),refresh=button("↻ Atualizar",false);
                  LinearLayout.LayoutParams left=new LinearLayout.LayoutParams(0,dp(49),2);left.rightMargin=dp(7);
                  buttons.addView(link,left);buttons.addView(refresh,new LinearLayout.LayoutParams(0,dp(49),1));
                  base.addView(buttons);gap(base,8);
                  link.setOnClickListener(v->showAddDialog());refresh.setOnClickListener(v->updateList());
                  statusText=text("",12,GRAY,false);base.addView(statusText);gap(base,8);
                  totalText=text("",15,GREEN,true);base.addView(totalText);gap(base,10);
                  searchInput=new EditText(this);searchInput.setSingleLine(true);searchInput.setTextColor(WHITE);
                  searchInput.setHintTextColor(GRAY);searchInput.setTextSize(15);
                  searchInput.setHint("⌕  Pesquisar canais pelo nome");searchInput.setPadding(dp(15),dp(8),dp(15),dp(8));
                  searchInput.setBackground(shape(PANEL,0xff594176,13));searchInput.setText(search);
                  base.addView(searchInput,lp(-1,49));
                  searchInput.addTextChangedListener(new TextWatcher(){
                      public void beforeTextChanged(CharSequence s,int st,int c,int af){}
                      public void onTextChanged(CharSequence s,int st,int before,int count){search=s.toString();displayed=PAGE;renderChannels();}
                      public void afterTextChanged(Editable e){}
                  });
                  gap(base,9);
                  HorizontalScrollView kinds=new HorizontalScrollView(this);kinds.setHorizontalScrollBarEnabled(false);
                  LinearLayout krow=row();
                  for(String label:new String[]{"Todos","TV","Filmes","Séries"}){
                      Button b=button(label,label.equals(selectedType));
                      LinearLayout.LayoutParams p=lp(-2,39);p.rightMargin=dp(7);krow.addView(b,p);
                      b.setOnClickListener(v->{selectedType=label;selectedGroup="Todos";displayed=PAGE;drawHome();});
                  }
                  kinds.addView(krow);base.addView(kinds);gap(base,10);
                  LinearLayout content=row();content.setGravity(Gravity.TOP);base.addView(content,lp(-1,-2));
                  if(landscape()){
                      categoryList=col();categoryList.setPadding(dp(2),dp(3),dp(7),dp(10));
                      content.addView(categoryList,lp(205,-2));
                      View divider=new View(this);divider.setBackgroundColor(0xff3b2a54);content.addView(divider,lp(1,-1));
                      channelList=col();channelList.setPadding(dp(9),dp(1),dp(3),dp(10));
                      content.addView(channelList,new LinearLayout.LayoutParams(0,-2,1));
                  }else{
                      LinearLayout stack=col();content.addView(stack,lp(-1,-2));
                      HorizontalScrollView categoryScroll=new HorizontalScrollView(this);categoryScroll.setHorizontalScrollBarEnabled(false);
                      categoryList=row();categoryScroll.addView(categoryList);stack.addView(categoryScroll,lp(-1,52));gap(stack,7);
                      channelList=col();stack.addView(channelList);
                  }
                  TextView safety=text("Suas listas ficam somente neste aparelho. A Xena TV não fornece canais; a reprodução depende do servidor e dos direitos de acesso.",11,GRAY,false);
                  gap(base,18);base.addView(safety);
                  renderAll();
              }
              private void renderAll(){
                  if(channelList==null||categoryList==null)return;
                  int count=store.count();
                  totalText.setText(count+" itens na sua lista");
                  String status=prefs.getString("status","");
                  statusText.setText(loading?"Lendo sua lista IPTV...":status.isEmpty()?(count==0?"Adicione seu link M3U ou Xtream para começar.":"Pronto para assistir."):status);
                  renderCategories();renderChannels();
              }
              private void addCategoryButton(String name,int count){
                  boolean selected=name.equals(selectedGroup);
                  Button b=button(name+(count>=0?"  "+count:""),selected);
                  if(landscape()){
                      LinearLayout.LayoutParams p=lp(-1,48);p.bottomMargin=dp(4);categoryList.addView(b,p);
                  }else{
                      LinearLayout.LayoutParams p=lp(-2,42);p.rightMargin=dp(6);categoryList.addView(b,p);
                  }
                  b.setOnClickListener(v->{selectedGroup=name;displayed=PAGE;renderCategories();renderChannels();});
              }
              private void renderCategories(){
                  if(categoryList==null)return;
                  categoryList.removeAllViews();
                  addCategoryButton("Todos",store.typeCount(selectedType));
                  addCategoryButton("Recentes",-1);addCategoryButton("Favoritos",-1);
                  for(ChannelStore.Group group:store.categories(selectedType))addCategoryButton(group.title,group.count);
              }
              private void renderChannels(){
                  if(channelList==null)return;
                  channelList.removeAllViews();
                  List<ChannelStore.Channel> rows=store.query(selectedGroup,selectedType,search,displayed+1,0);
                  int shown=Math.min(displayed,rows.size());
                  for(int i=0;i<shown;i++){
                      ChannelStore.Channel ch=rows.get(i);
                      LinearLayout item=row();item.setPadding(dp(11),dp(9),dp(7),dp(9));
                      item.setBackground(shape(PANEL,0xff342549,12));
                      TextView icon=text(ch.type.equals("TV")?"▣":ch.type.equals("Filmes")?"▶":"▤",20,GREEN,true);
                      icon.setGravity(Gravity.CENTER);icon.setBackground(shape(PANEL2,0,10));item.addView(icon,lp(42,46));
                      LinearLayout desc=col();desc.setPadding(dp(10),0,0,0);
                      TextView title=text(ch.name,15,WHITE,true);title.setMaxLines(2);desc.addView(title);
                      TextView label=text(ch.category,11,GRAY,false);label.setMaxLines(1);desc.addView(label);
                      item.addView(desc,new LinearLayout.LayoutParams(0,-2,1));
                      Button favorite=button(ch.favorite?"★":"☆",false);item.addView(favorite,lp(43,44));
                      favorite.setOnClickListener(v->{store.favorite(ch.url,!ch.favorite);renderChannels();});
                      item.setOnClickListener(v->play(ch));
                      LinearLayout.LayoutParams p=lp(-1,-2);p.bottomMargin=dp(7);channelList.addView(item,p);
                  }
                  if(rows.size()>shown){
                      Button more=button("Mostrar mais canais",true);
                      more.setOnClickListener(v->{displayed+=PAGE;renderChannels();});
                      channelList.addView(more,lp(-1,48));
                  }
                  if(shown==0){
                      TextView empty=text(loading?"Carregando canais...":store.count()==0?"Nenhuma lista importada ainda.":"Nenhum canal encontrado nesta categoria.",14,GRAY,false);
                      empty.setPadding(dp(10),dp(19),dp(10),dp(19));channelList.addView(empty);
                  }
              }
              private void showAddDialog(){
                  LinearLayout form=col();form.setPadding(dp(20),dp(2),dp(20),0);
                  TextView instructions=text("Cole o endereço completo da sua lista M3U. Se for get.php, também tentaremos a API IPTV automaticamente.",13,GRAY,false);
                  form.addView(instructions);gap(form,9);
                  EditText name=new EditText(this);name.setSingleLine(true);name.setHint("Nome: Minha IPTV");
                  name.setText(prefs.getString("name","Minha IPTV"));form.addView(name);
                  EditText url=new EditText(this);url.setSingleLine(false);url.setMinLines(2);url.setMaxLines(4);
                  url.setInputType(android.text.InputType.TYPE_CLASS_TEXT|android.text.InputType.TYPE_TEXT_VARIATION_URI|android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  url.setHint("Cole seu link https://.../get.php?...");
                  url.setText(prefs.getString("url",""));form.addView(url);
                  AlertDialog dialog=new AlertDialog.Builder(this).setTitle("Minha lista IPTV")
                      .setView(form).setNegativeButton("Cancelar",null)
                      .setNeutralButton("Abrir arquivo M3U",(d,w)->pickFile())
                      .setPositiveButton("Salvar e carregar",null).create();
                  dialog.setOnShowListener(d->dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{
                      String link=url.getText().toString().trim(),title=name.getText().toString().trim();
                      if(!link.startsWith("https://")&&!link.startsWith("http://")){
                          Toast.makeText(this,"Insira um link HTTP ou HTTPS válido.",Toast.LENGTH_LONG).show();return;
                      }
                      prefs.edit().putString("url",link).putString("name",title.isEmpty()?"Minha IPTV":title).apply();
                      dialog.dismiss();listTitle.setText(prefs.getString("name","Minha IPTV"));updateList();
                  }));
                  dialog.show();
              }
              private void pickFile(){
                  Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(intent,SELECT_FILE);
              }
              @Override protected void onActivityResult(int request,int result,Intent intent){
                  super.onActivityResult(request,result,intent);
                  if(request!=SELECT_FILE||result!=RESULT_OK||intent==null||intent.getData()==null)return;
                  Uri selected=intent.getData();
                  try{getContentResolver().takePersistableUriPermission(selected,Intent.FLAG_GRANT_READ_URI_PERMISSION);}catch(Exception ignored){}
                  prefs.edit().putString("url",selected.toString()).putString("name","Arquivo M3U local").apply();
                  listTitle.setText("Arquivo M3U local");updateList();
              }
              private void updateList(){
                  final String source=prefs.getString("url","");
                  if(source.isEmpty()){showAddDialog();return;}
                  if(loading){Toast.makeText(this,"Aguarde esta importação terminar.",Toast.LENGTH_SHORT).show();return;}
                  final int request=++loadVersion;
                  loading=true;renderAll();
                  new Thread(()->{
                      ArrayList<M3UStreamParser.Channel> channels=null;
                      String method="",error="";
                      try {
                          if(source.startsWith("content://")){
                              try(java.io.InputStream input=getContentResolver().openInputStream(Uri.parse(source))){
                                  if(input==null)throw new IOException("Arquivo local indisponível.");
                                  M3UStreamParser.Result parsed=M3UStreamParser.importStream("Minha IPTV",source,input);
                                  if(parsed.direct)throw new IOException("O arquivo é um stream HLS, não uma lista de canais.");
                                  channels=parsed.channels;method="arquivo M3U";
                              }
                          }else{
                              try {
                                  M3UStreamParser.Result parsed=M3UStreamParser.importUrl("Minha IPTV",source,true);
                                  if(!parsed.direct&&parsed.channels.size()>0){channels=parsed.channels;method="lista M3U";}
                                  else error="O endereço devolveu um único stream HLS, não um catálogo.";
                              }catch(Exception e){error=safeError(e);}
                              if((channels==null||channels.isEmpty())&&XtreamCatalog.supports(source)){
                                  try {
                                      XtreamCatalog.Result result=XtreamCatalog.load(source);
                                      channels=result.entries;method="API Xtream ("+result.liveCount+" TV / "+result.moviesCount+" filmes)";
                                  } catch(Exception e){error="M3U: "+error+" | API Xtream: "+safeError(e);}
                              }
                          }
                          if(channels==null||channels.isEmpty())throw new IOException("Não foi possível obter os canais. "+error);
                          // Substituição transacional: se a nova importação falhar, o catálogo anterior é preservado.
                          store.replace(channels);
                          String finalStatus="Importados "+store.count()+" itens usando "+method+".";
                          prefs.edit().putString("status",finalStatus).apply();
                          runOnUiThread(()->{
                              if(request!=loadVersion||isFinishing()||isDestroyed())return;
                              loading=false;selectedGroup="Todos";displayed=PAGE;renderAll();
                          });
                      } catch(Exception ex){
                          final String finalStatus="Importação não concluída: "+safeError(ex)+". Os canais anteriores foram preservados.";
                          prefs.edit().putString("status",finalStatus).apply();
                          runOnUiThread(()->{
                              if(request!=loadVersion||isFinishing()||isDestroyed())return;
                              loading=false;renderAll();
                              new AlertDialog.Builder(this).setTitle("Não foi possível carregar sua lista")
                                  .setMessage(finalStatus).setPositiveButton("OK",null).show();
                          });
                      }
                  },"XenaTV-Importador").start();
              }
              private static String safeError(Exception e){
                  String s=e.getMessage()==null?e.getClass().getSimpleName():e.getMessage();
                  // Nunca mostrar credenciais ou URLs completas em alertas/diagnósticos.
                  if(s.contains("http://")||s.contains("https://")||s.contains("password="))return "servidor rejeitou ou não retornou o catálogo esperado";
                  return s.length()>300?s.substring(0,300):s;
              }
              private void play(ChannelStore.Channel item){
                  watching=item;playerVisible=true;store.seen(item.url);
                  LinearLayout page=col();page.setBackgroundColor(Color.BLACK);setContentView(page);
                  LinearLayout heading=row();heading.setPadding(dp(8),dp(9),dp(8),dp(9));
                  Button back=button("‹ Canais",false);heading.addView(back,lp(105,45));back.setOnClickListener(v->closePlayer());
                  TextView title=text(item.name,16,WHITE,true);title.setPadding(dp(10),0,0,0);heading.addView(title,new LinearLayout.LayoutParams(0,-2,1));
                  page.addView(heading);
                  if(android.os.Build.VERSION.SDK_INT>=35){
                      page.setOnApplyWindowInsetsListener((view,insets)->{
                          heading.setPadding(dp(8),insets.getSystemWindowInsetTop()+dp(9),dp(8),dp(9));
                          return insets;
                      });
                  }
                  FrameLayout video=new FrameLayout(this);video.setBackgroundColor(Color.BLACK);
                  page.addView(video,new LinearLayout.LayoutParams(-1,0,1));
                  VLCVideoLayout videoSurface=new VLCVideoLayout(this);
                  video.addView(videoSurface,new FrameLayout.LayoutParams(-1,-1));
                  TextView state=text("Conectando à transmissão...",13,GREEN,false);
                  state.setGravity(Gravity.CENTER);page.addView(state,lp(-1,45));
                  LinearLayout actions=row();actions.setPadding(dp(8),0,dp(8),dp(10));
                  Button retry=button("↻ Reconectar",true),external=button("Abrir no VLC",false);
                  LinearLayout.LayoutParams w1=new LinearLayout.LayoutParams(0,dp(48),1);w1.rightMargin=dp(6);
                  actions.addView(retry,w1);actions.addView(external,new LinearLayout.LayoutParams(0,dp(48),1));page.addView(actions);
                  retry.setOnClickListener(v->play(item));external.setOnClickListener(v->openExternalVlc(item.url));
                  try {
                      stopVideo();
                      if(libVlc==null){
                          ArrayList<String> config=new ArrayList<>();config.add("--network-caching=2000");
                          config.add("--http-reconnect");libVlc=new LibVLC(this,config);
                      }
                      player=new MediaPlayer(libVlc);player.attachViews(videoSurface,null,false,false);
                      final MediaPlayer active=player;
                      active.setEventListener(e->runOnUiThread(()->{
                          if(player!=active||!playerVisible)return;
                          if(e.type==MediaPlayer.Event.Opening)state.setText("Abrindo sinal...");
                          else if(e.type==MediaPlayer.Event.Playing)state.setText("● Reproduzindo");
                          else if(e.type==MediaPlayer.Event.Buffering)state.setText("Aguardando dados do servidor...");
                          else if(e.type==MediaPlayer.Event.EncounteredError)state.setText("Falha no sinal. Toque em Reconectar ou teste no VLC.");
                          else if(e.type==MediaPlayer.Event.EndReached)state.setText("Transmissão encerrada.");
                      }));
                      Media media=new Media(libVlc,Uri.parse(item.url));
                      media.addOption(":network-caching=2000");media.addOption(":http-reconnect=true");
                      media.addOption(":http-user-agent=VLC/3.0.21 LibVLC/3.0.21");
                      if(item.url.startsWith("rtsp://"))media.addOption(":rtsp-tcp");
                      player.setMedia(media);media.release();player.play();
                  }catch(Exception ex){state.setText("Não foi possível iniciar o player.");}
              }
              private void openExternalVlc(String url){
                  try {
                      Intent open=new Intent(Intent.ACTION_VIEW);
                      open.setDataAndType(Uri.parse(url),"video/*");open.setPackage("org.videolan.vlc");
                      startActivity(open);
                  }catch(Exception ex){
                      Toast.makeText(this,"Instale o VLC ou teste o canal pelo player interno.",Toast.LENGTH_LONG).show();
                  }
              }
              private void stopVideo(){
                  if(player!=null){
                      try{player.stop();if(player.getVLCVout().areViewsAttached())player.detachViews();}catch(Exception ignored){}
                      player.release();player=null;
                  }
              }
              private void closePlayer(){
                  stopVideo();if(playerVisible){playerVisible=false;watching=null;drawHome();}
              }
              @Override public void onBackPressed(){
                  if(playerVisible){closePlayer();return;}super.onBackPressed();
              }
              @Override protected void onDestroy(){
                  loadVersion++;stopVideo();if(libVlc!=null){libVlc.release();libVlc=null;}
                  if(store!=null)store.close();super.onDestroy();
              }
          }
          XENA_MAINACTIVITY_JAVA
          cat > build-xena/XenaTV_Android/app/src/main/java/br/com/xenatv/app/ChannelStore.java <<'XENA_CHANNELSTORE_JAVA'
          package br.com.xenatv.app;
          
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import android.database.sqlite.SQLiteStatement;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          
          /** Catálogo privado do aparelho. A lista continua visível mesmo se o servidor ficar temporariamente fora. */
          public final class ChannelStore extends SQLiteOpenHelper {
              public static final class Channel {
                  public final long id;
                  public final String name,url,category,logo,type;
                  public final boolean favorite;
                  Channel(long i,String n,String u,String c,String l,String t,boolean f){
                      id=i;name=n;url=u;category=c;logo=l;type=t;favorite=f;
                  }
              }
              public static final class Group {
                  public final String title;
