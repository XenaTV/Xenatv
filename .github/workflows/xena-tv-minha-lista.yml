              private static Result parseInput(String name,String base,InputStream decoded,boolean forceList,String mime) throws IOException {
                  BufferedInputStream input=new BufferedInputStream(new LimitedInputStream(decoded,MAX_BYTES),32768);
                  input.mark(SNIFF_BYTES+16);
                  byte[] peek=new byte[SNIFF_BYTES];
                  int count=input.read(peek);
                  input.reset();
                  if(count<1)throw new IOException("Lista vazia: o servidor não enviou dados.");
