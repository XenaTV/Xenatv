# Xena TV Android - compact GitHub Actions build package
name: Xena TV Android - Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xena-tv-android-apk.yml"
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar Xena TV nativo com LibVLC e canais de teste
