      - name: Diagnosticar filmes por fonte e plataforma sem alterar as series
        shell: bash
        run: |
          set -euo pipefail
          cat > patch_movie_diagnostics_v4.py <<'XENA_V4_PATCH'
          #!/usr/bin/env python3
          """XenaTV V4: tornar observável por que filmes não surgem nas plataformas.
          Não modifica a lógica, o banco ou a sincronização de Séries.
          """
          from pathlib import Path
          p=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          def rep(before,after,label):
           global s
           n=s.count(before)
           if n!=1:raise RuntimeError(f'{label}: esperado 1, encontrado {n}')
           s=s.replace(before,after,1)
          rep('''            int sources=0;
                      for(SourceRegistry.SourceEntry src:new SourceRegistry(this).all()){''','''            int sources=0, knownFilms=0, xtreamSources=0, fetchedFilms=0;
                      int apiFailures=0;
                      for(SourceRegistry.SourceEntry src:new SourceRegistry(this).all()){''','contadores exclusivos de filmes')
          rep('''                    if(MOVIES.equals(kind)&&XtreamCatalog.supports(src.url)){
                                  android.content.SharedPreferences syncPrefs''','''                    if(MOVIES.equals(kind)&&XtreamCatalog.supports(src.url)){
                                  xtreamSources++;
                                  android.content.SharedPreferences syncPrefs''','quantidade de fontes Xtream')
          rep('''                                if(!fresh.isEmpty())db.mergeMovies(fresh);
                                          syncPrefs.edit().putLong(src.id,System.currentTimeMillis()).remove(src.id+"_retry").apply();''','''                                if(!fresh.isEmpty()){fetchedFilms+=db.mergeMovies(fresh);}
                                          syncPrefs.edit().putLong(src.id,System.currentTimeMillis()).remove(src.id+"_retry").apply();''','filmes importados')
          rep('''                            }catch(Exception ex){
                                          syncPrefs.edit().putLong(src.id+"_retry",System.currentTimeMillis()+10L*60*1000).apply();
                                          android.util.Log.w("XenaMovies", "API VOD indisponível para esta fonte: "+ex.getClass().getSimpleName());''','''                            }catch(Exception ex){
                                          apiFailures++;
                                          syncPrefs.edit().putLong(src.id+"_retry",System.currentTimeMillis()+10L*60*1000).apply();
                                          android.util.Log.w("XenaMovies", "API VOD indisponível para esta fonte: "+ex.getClass().getSimpleName());''','registrar erro seguro')
          rep('''                    List<ChannelStore.Group> categories=MOVIES.equals(kind)
                                  ?db.allMovieCategories():db.platformCategories(kind,brand);
                              for(ChannelStore.Group group:categories){''','''                    List<ChannelStore.Group> categories=MOVIES.equals(kind)
                                  ?db.allMovieCategories():db.platformCategories(kind,brand);
                              if(MOVIES.equals(kind))for(ChannelStore.Group category:categories)knownFilms+=category.count;
                              for(ChannelStore.Group group:categories){''','totais por categoria')
          rep('''            final int countSources=sources;
                      runOnUiThread(()->{''','''            final int countSources=sources, totalFilms=knownFilms,
                          validXtream=xtreamSources, refreshedFilms=fetchedFilms, failedApis=apiFailures;
                      runOnUiThread(()->{''','diagnostico disponivel UI')
          rep('''                status.setText(result.isEmpty()
                              ?"Nenhum "+kind.toLowerCase(Locale.ROOT)+" identificado como "+PlatformShortcutRules.displayName(brand)+" nas suas listas."
                              :result.size()+" títulos encontrados • "+countSources+" fontes verificadas");''','''                if(MOVIES.equals(kind)){
                              status.setText(result.size()+" filmes nesta plataforma • "+totalFilms+
                                  " filmes no catálogo • "+countSources+" fontes • "+validXtream+" Xtream"+
                                  (failedApis>0?" • "+failedApis+" API(s) VOD falharam":"")+
                                  (refreshedFilms>0?" • "+refreshedFilms+" sincronizados":""));
                          }else status.setText(result.isEmpty()
                              ?"Nenhuma série identificada para "+PlatformShortcutRules.displayName(brand)+" nas suas listas."
                              :result.size()+" títulos encontrados • "+countSources+" fontes verificadas");''','mostrar falha concreta na tela')
          rep('''                        ?"Sua lista não identificou filmes desta plataforma automaticamente. Toque em 'Associar categorias' acima para vincular as pastas de filmes corretas, sem perder conteúdo."''','''                        ?(totalFilms==0
                                      ?"Ainda não existem filmes VOD reconhecidos nesta fonte. Toque em Sincronizar filmes. Se a API não fornecer VOD, confira sua lista IPTV — séries e TV permanecerão intactas."
                                      :"Existem "+totalFilms+" filmes importados, mas nenhum identificado nesta plataforma. Associe somente as categorias corretas da sua IPTV, sem misturar Netflix, Prime e outras.")''','explicacao diferente para catalogo vazio')
          assert s.count('{')==s.count('}')
          p.write_text(s,encoding='utf-8')
          print('V4: diagnóstico IPTV/VOD observável, sem alteracao de series')
          XENA_V4_PATCH
          python3 -m py_compile patch_movie_diagnostics_v4.py
          python3 patch_movie_diagnostics_v4.py
          python3 - <<'XENA_V4_VALIDATE'
          from pathlib import Path
          main=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java').read_text()
          live=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/LiveTvActivity.java').read_text()
          for key in ('homeGamesPanel();','PIPOOU_BANNER_INTERVAL_MS=8000L','ImageView.ScaleType.CENTER_CROP','XtreamCatalog.moviesOnly','totalFilms'):
              assert key in main, 'Falta no APK: '+key
          for key in ('MiranteStartRules.score','only_fazenda'):
              assert key in live, 'Inicializacao de TV incompleta: '+key
          assert main.count('{')==main.count('}')
          print('CHECK V4 OK: Home/Jogos/Pipoou/Mirante/Filmes; Séries preservadas')
          XENA_V4_VALIDATE

