          """
          from pathlib import Path
          p=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              old=old.replace("                  ","        ")
              new=new.replace("                  ","        ")
              n=s.count(old)
              if n!=1:raise RuntimeError(f'{label}: {n} ocorrências, esperada 1')
              s=s.replace(old,new,1)
          
          # Trocar de lugar a fileira de continuidade: só DEPOIS dos jogos e do Pipoou.
          once('''                  if(store.count()==0){
                                homeContinueSection();
                                addPipoouSpotlight();gap(body,21);''','''                  if(store.count()==0){
                                homeGamesPanel();
                                addPipoouSpotlight();gap(body,21);
                                homeContinueSection();''','ordem home vazia')
          once('''                  homeContinueSection();
                            addPipoouSpotlight();gap(body,22);
                            addRail("Séries",SERIES);''','''                  homeGamesPanel();
                            addPipoouSpotlight();gap(body,22);
                            homeContinueSection();
                            addRail("Séries",SERIES);''','ordem home com catalogo')
          once('''                  homeTitle("Jogos de Hoje","Agenda e canais esportivos",GAMES);
                            Button games=button("⚽ Conferir jogos do dia",false);
                            games.setTextColor(0xff55eb99);games.setBackground(gradient(0xff22103c,0xff102c2d,16));
                            body.addView(games,lp(-1,53));games.setOnClickListener(v->navigate(GAMES));
                            gap(body,22);
                            addRail("Filmes",MOVIES);''','''                  addRail("Filmes",MOVIES);''','remover jogos na posicao errada')
          
          # Consulta leve de agenda real; se não houver rede, permite abrir a tela própria de jogos.
          helper=r'''    /** A Home exibe somente partidas REAIS, sem resultados ou percentuais fictícios. */
              private static final class HomeMatch {
                  final String label, fixture, info;
                  HomeMatch(String l,String f,String i){label=l;fixture=f;info=i;}
              }
              private static volatile long homeGamesCacheAt=0L;
              private static volatile java.util.ArrayList<HomeMatch> homeGamesCache=new java.util.ArrayList<>();
          
              private void homeGamesPanel(){
                  homeTitle("Jogos de Hoje","Agenda real • horário de Brasília",GAMES);
                  LinearLayout list=col();body.addView(list,lp(-1,-2));
                  Button all=button("⚽ Ver todos os jogos",false);
                  all.setTextColor(MINT);all.setBackground(gradient(0xff22103c,0xff102c2d,15));
                  body.addView(all,lp(-1,45));all.setOnClickListener(v->navigate(GAMES));gap(body,20);
                  java.util.ArrayList<HomeMatch> cached=homeGamesCache;
                  if(System.currentTimeMillis()-homeGamesCacheAt<5*60*1000L){
                      drawHomeMatches(list,cached,false);return;
                  }
                  TextView loading=text("Consultando jogos de hoje...",12,MUTED,false);
                  list.addView(loading,lp(-1,36));
                  new Thread(()->{
                      java.util.ArrayList<HomeMatch> games=new java.util.ArrayList<>();
                      String[] leagues={"soccer/bra.1","soccer/bra.2","soccer/conmebol.libertadores","soccer/conmebol.sudamericana"};
                      String[] labels={"Brasileirão Série A","Brasileirão Série B","Libertadores","Sul-Americana"};
                      java.text.SimpleDateFormat day=new java.text.SimpleDateFormat("yyyyMMdd",java.util.Locale.US);
                      day.setTimeZone(java.util.TimeZone.getTimeZone("America/Sao_Paulo"));
                      String date=day.format(new java.util.Date());
                      boolean loadedAny=false;
                      for(int i=0;i<leagues.length&&games.size()<5;i++){
                          java.net.HttpURLConnection con=null;
                          try{
                              String address="https://site.api.espn.com/apis/site/v2/sports/"+leagues[i]+"/scoreboard?dates="+date;
                              con=(java.net.HttpURLConnection)new java.net.URL(address).openConnection();
                              con.setConnectTimeout(5000);con.setReadTimeout(6000);
                              con.setRequestProperty("Accept","application/json");
                              con.setRequestProperty("User-Agent","XenaTV/6.9");
                              if(con.getResponseCode()!=200)continue;
                              byte[] chunk=new byte[8192];int n,total=0;
                              java.io.ByteArrayOutputStream bytes=new java.io.ByteArrayOutputStream();
                              try(java.io.InputStream input=con.getInputStream()){
                                  while((n=input.read(chunk))>0){
                                      total+=n;if(total>500_000)throw new java.io.IOException("Agenda grande");
                                      bytes.write(chunk,0,n);
                                  }
                              }
                              org.json.JSONObject root=new org.json.JSONObject(bytes.toString("UTF-8"));
                              org.json.JSONArray events=root.optJSONArray("events");
                              if(events==null)continue;
                              loadedAny=true;
                              for(int j=0;j<events.length()&&games.size()<5;j++){
                                  org.json.JSONObject event=events.optJSONObject(j);if(event==null)continue;
                                  org.json.JSONArray comps=event.optJSONArray("competitions");
                                  if(comps==null||comps.length()==0)continue;
                                  org.json.JSONArray teams=comps.optJSONObject(0).optJSONArray("competitors");
                                  if(teams==null||teams.length()<2)continue;
                                  String home="",away="",scoreHome="",scoreAway="";
                                  for(int k=0;k<teams.length();k++){
                                      org.json.JSONObject team=teams.optJSONObject(k);if(team==null)continue;
                                      String title=team.optJSONObject("team")==null?"":team.optJSONObject("team").optString("displayName","");
                                      if("home".equals(team.optString("homeAway"))){home=title;scoreHome=team.optString("score","");}
                                      else if("away".equals(team.optString("homeAway"))){away=title;scoreAway=team.optString("score","");}
                                  }
                                  if(home.isEmpty()||away.isEmpty())continue;
                                  org.json.JSONObject status=event.optJSONObject("status");
                                  org.json.JSONObject type=status==null?null:status.optJSONObject("type");
                                  String state=type==null?"pre":type.optString("state","pre");
                                  String info;
                                  if(("in".equals(state)||"post".equals(state))&&!scoreHome.isEmpty()&&!scoreAway.isEmpty())
                                      info=scoreHome+" - "+scoreAway+("in".equals(state)?" • AO VIVO":" • Encerrado");
                                  else{
                                      info="Horário a confirmar";
                                      try{
                                          String utc=event.optString("date","");
                                          java.text.SimpleDateFormat iso=new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'",java.util.Locale.US);
                                          iso.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));
                                          java.util.Date start=iso.parse(utc);
                                          java.text.SimpleDateFormat time=new java.text.SimpleDateFormat("HH:mm",new java.util.Locale("pt","BR"));
                                          time.setTimeZone(java.util.TimeZone.getTimeZone("America/Sao_Paulo"));
                                          info=time.format(start);
                                      }catch(Exception ignored){}
                                  }
                                  games.add(new HomeMatch(labels[i],home+"  ×  "+away,info));
                              }
                          }catch(Exception ignored){}finally{if(con!=null)con.disconnect();}
                      }
                      final boolean received=loadedAny;
                      if(received){homeGamesCache=games;homeGamesCacheAt=System.currentTimeMillis();}
                      runOnUiThread(()->{
                          if(isFinishing()||isDestroyed()||!HOME.equals(tab)||!platformBrand.isEmpty())return;
                          drawHomeMatches(list,games,!received);
                      });
                  },"XenaTV-Home-Games").start();
              }
              private void drawHomeMatches(LinearLayout host,java.util.List<HomeMatch> matches,boolean unavailable){
                  host.removeAllViews();
                  if(matches.isEmpty()){
                      TextView message=text(unavailable?"Agenda indisponível no momento. Abra Jogos de Hoje para tentar novamente.":
                          "Sem partidas identificadas hoje nas competições consultadas.",11,MUTED,false);
                      message.setPadding(dp(13),dp(14),dp(13),dp(14));
                      message.setBackground(shape(0xb61a1032,0xff823cc9,15));
                      host.addView(message,lp(-1,-2));gap(host,8);return;
                  }
                  HorizontalScrollView strip=new HorizontalScrollView(this);
                  strip.setHorizontalScrollBarEnabled(false);
                  LinearLayout rowCards=row();
                  for(HomeMatch match:matches){
                      LinearLayout card=col();card.setPadding(dp(14),dp(12),dp(14),dp(12));
                      card.setBackground(gradient(0xff26103b,0xff0d2b2b,17));
                      card.addView(text(match.label,10,MINT,true));gap(card,7);
                      TextView fixture=text(match.fixture,14,WHITE,true);fixture.setMaxLines(2);card.addView(fixture);gap(card,6);
                      card.addView(text(match.info,12,ACCENT,true));
                      LinearLayout.LayoutParams at=lp(widthDp()<450?246:290,119);at.rightMargin=dp(9);
                      rowCards.addView(card,at);card.setOnClickListener(v->navigate(GAMES));
                  }
                  strip.addView(rowCards);host.addView(strip);gap(host,10);
              }
          '''
          assert s.count('    private void showHome(){')==1
          s=s.replace('    private void showHome(){',helper+'\n    private void showHome(){',1)
          assert s.count('{')==s.count('}'),('braces',s.count('{'),s.count('}'))
          assert s.count('homeGamesPanel();')==2
          assert s.index('homeGamesPanel();',s.index('private void showHome()')) < s.index('addPipoouSpotlight();',s.index('private void showHome()'))
          p.write_text(s,encoding='utf-8')
          print('V4: jogos reais (com fallback), ordem banner/jogos/Pipoou/continuar, séries não alteradas')
