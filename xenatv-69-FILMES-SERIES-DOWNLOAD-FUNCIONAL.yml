                      int score=FazendaStartRules.score(entry.title,entry.group);
                      if(score>bestScore){bestScore=score;best=entry;}
                  }
                  // Se não houver Fazenda, inicia a primeira TV válida em vez de uma tela vazia.
                  if(bestScore==Integer.MIN_VALUE&&getIntent().getBooleanExtra("only_fazenda",false))return null;
                  return bestScore==Integer.MIN_VALUE?channels.get(0):best;
              }'''
          new='''    private Entry chooseStartupChannel(){
                  if(channels.isEmpty())return null;
                  if(getIntent().getBooleanExtra("only_fazenda",false)){
                      // A Fazenda abre automaticamente SOMENTE no Cantinho do Pipoou.
                      Entry best=null;int bestScore=Integer.MIN_VALUE;
                      for(Entry entry:channels){
                          int score=FazendaStartRules.score(entry.title,entry.group);
                          if(score>bestScore){bestScore=score;best=entry;}
                      }
                      return bestScore==Integer.MIN_VALUE?null:best;
                  }
                  // TV AO VIVO normal: a TV Mirante (São Luís/Globo) é o canal inicial.
                  // Não reutiliza o antigo canal inicial salvo, que podia ser A Fazenda.
                  Entry mirante=null;int bestScore=0;
                  for(Entry entry:channels){
                      int score=MiranteStartRules.score(entry.title,entry.group);
                      if(score>bestScore){bestScore=score;mirante=entry;}
                  }
                  // Sem Mirante na lista? Mostrar a lista, NUNCA abrir A Fazenda.
                  return mirante;
              }'''
          assert s.count(old)==1, f'Trecho de inicializacao nao encontrado: {s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          helper=p.with_name('MiranteStartRules.java')
          helper.write_text('''package br.com.xenatv.app;

          /** Seleciona somente Mirante/Globo São Luís para a TV normal. */
          public final class MiranteStartRules {
              private MiranteStartRules(){}
              public static int score(String title,String group){
                  if(FazendaStartRules.isFazenda(title,group))return 0;
                  String name=FazendaStartRules.key(title);
                  // Evitar confundir a categoria Globo com um canal real da Mirante.
                  if(name.contains("tv mirante"))return 100;
                  if(name.contains("globo mirante") || name.contains("mirante globo"))return 95;
                  if(name.equals("mirante") || name.startsWith("mirante "))return 90;
                  if(name.contains("globo sao luis") || name.contains("globo slz") ||
                     name.contains("globo maranhao") || name.matches(".*\\\\bglobo\\\\s+ma\\\\b.*"))return 70;
                  return 0;
              }
          }
          ''',encoding='utf-8')
          assert 'return mirante;' in s and 'only_fazenda' in s
          print('PATCH OK: TV normal prioriza Mirante; Pipoou ainda prioriza Fazenda; ausência Mirante mostra canais.')
          XENA_MIRANTE_PATCH
          python3 -m py_compile patch_tv_mirante.py
          python3 patch_tv_mirante.py
          python3 - <<'XENA_MIRANTE_TEST'
          from pathlib import Path
          p=Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/LiveTvActivity.java')
          s=p.read_text(encoding='utf-8')
          assert 'return mirante;' in s
          assert 'if(getIntent().getBooleanExtra("only_fazenda",false))' in s
          assert 'MiranteStartRules.score(entry.title,entry.group)' in s
          assert 'Prefere a Fazenda/câmera principal' not in s
          assert Path('xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app/MiranteStartRules.java').is_file()
          print('INICIALIZACAO TV: Mirante prioritária; Fazenda só via Pipoou')
          XENA_MIRANTE_TEST
          cat > TestMiranteStart.java <<'TEST_MIRANTE'
          package br.com.xenatv.app;
          public class TestMiranteStart {
              static void check(boolean ok){if(!ok)throw new AssertionError("Regra Mirante inválida");}
