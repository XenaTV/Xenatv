          s=exact(s,'star.setBackground(shape(0xdd1a1a30,0xff6c658c,24));','star.setBackground(shape(ch.favorite?0xff390918:0xdd1a1a30,ch.favorite?0xffe22d4a:0xffa243e3,24));','main fundo estrela')
          s=exact(s,'star.setTextColor(wanted?MINT:WHITE);','star.setTextColor(wanted?0xffb91635:WHITE);\n                        star.setBackground(shape(wanted?0xff390918:0xdd1a1a30,wanted?0xffe22d4a:0xffa243e3,24));','main toggle estrela')
          p.write_text(s)
          print('OK: estrela invertida e vermelho-sangue em TV ao Vivo, cartões e favoritos principais; brilho TV')
          XENA_NEON_FAV_PATCH
