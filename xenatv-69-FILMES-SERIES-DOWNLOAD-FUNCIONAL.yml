                  check(MiranteStartRules.score("TV Mirante HD","TV Aberta")>0);
                  check(MiranteStartRules.score("Globo São Luís","TV Aberta")>0);
                  check(MiranteStartRules.score("Globo MA","TV Aberta")>0);
                  check(MiranteStartRules.score("A Fazenda câmera 1","Realities")==0);
                  check(MiranteStartRules.score("Globo News","Notícias")==0);
                  check(MiranteStartRules.score("TV Mirante","A Fazenda")==0);
                  check(MiranteStartRules.score("Globo RJ","TV Aberta")==0);
                  System.out.println("7 testes de canais TV Mirante OK");
              }
          }
          TEST_MIRANTE
          app=xena-premium/XenaTV_Android/app/src/main/java/br/com/xenatv/app
