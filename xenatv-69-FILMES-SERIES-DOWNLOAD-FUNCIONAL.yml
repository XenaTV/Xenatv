          javac -encoding UTF-8 -d /tmp/teste_mirante_xenatv \
            "$app/FazendaStartRules.java" "$app/MiranteStartRules.java" /tmp/teste_mirante_xenatv/TestMiranteStart.java
          java -cp /tmp/teste_mirante_xenatv br.com.xenatv.app.TestMiranteStart


